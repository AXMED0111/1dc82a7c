<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Debt Book</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#f2f4f7);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#ffffff));
  --text:var(--tg-theme-text-color,#101828);
  --hint:var(--tg-theme-hint-color,#667085);
  --accent:var(--tg-theme-button-color,#2457d6);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
  --link:var(--tg-theme-link-color,#2457d6);
  --sep:var(--tg-theme-section-separator-color,rgba(128,128,128,.2));
  --danger:var(--tg-theme-destructive-text-color,#d92d20);
  --ok:#12b76a;
  --soft:color-mix(in srgb,var(--accent) 10%,transparent);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:var(--tg-theme-secondary-bg-color,#0e1116);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#171b22));
  --text:var(--tg-theme-text-color,#e6e9ef);
  --hint:var(--tg-theme-hint-color,#8b93a1);
  --accent:var(--tg-theme-button-color,#4c7cf0);
  --link:var(--tg-theme-link-color,#6f97f5);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;flex:none}
.top h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--hint)}
.grow{flex:1;min-width:0}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--sep);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.lang{display:flex;border:1px solid var(--sep);border-radius:10px;overflow:hidden;background:var(--card);flex:none}
.lang button{border:0;background:none;padding:7px 10px;font-size:12px;font-weight:650;color:var(--hint);cursor:pointer}
.lang button.on{background:var(--accent);color:var(--accent-text)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}svg.i.l{width:26px;height:26px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--accent);border:0;cursor:pointer}
.chip.warn{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.chip.good{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 12px;border:1px solid var(--sep)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tool{background:var(--card);border:1px solid var(--sep);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:128px}
.tool:active{transform:scale(.985)}
.tool .ic{width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.tool b{font-size:14.5px;font-weight:650}
.tool span{font-size:12.5px;color:var(--hint);line-height:1.35}
.tool.dis{opacity:.55;cursor:default}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);border:1px solid var(--sep);border-radius:6px;padding:2px 6px;align-self:flex-start}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--hint);margin:18px 4px 8px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--hint);padding:4px 4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:13px 16px;font-weight:650;background:var(--accent);color:var(--accent-text);cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec2{background:var(--soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--sep)}
.btn.sm{padding:9px 12px;font-size:13.5px;width:auto}
.btn+.btn{margin-top:8px}
.row{display:flex;gap:8px;align-items:center}
.drop{position:relative;overflow:hidden;border:1.5px dashed var(--sep);border-radius:var(--r);padding:26px 16px;text-align:center;cursor:pointer;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.drop .ic{width:48px;height:48px;border-radius:14px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.drop small{color:var(--hint)}
.files{list-style:none;margin:0;padding:0}
.files li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep)}
.files li:last-child{border-bottom:0}
.thumb{width:40px;height:40px;border-radius:8px;background:var(--soft);color:var(--accent);display:grid;place-items:center;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.fn{font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs{font-size:12px;color:var(--hint)}
.mini{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--hint);display:grid;place-items:center;cursor:pointer;flex:none}
.mini:disabled{opacity:.3}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--hint);margin:12px 0 6px}
label.f:first-child{margin-top:0}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--hint);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--sep);background:var(--bg);border-radius:10px;padding:10px 12px;outline:none}
input.t:focus,select.t:focus{border-color:var(--accent)}
.opt{display:flex;flex-direction:column;gap:6px}
.radio{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--sep);border-radius:12px;cursor:pointer;background:var(--card)}
.radio.on{border-color:var(--accent);background:var(--soft)}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--hint);flex:none;display:grid;place-items:center}
.radio.on .dot{border-color:var(--accent)}
.radio.on .dot:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.bar{height:6px;border-radius:6px;background:var(--bg);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.err{color:var(--danger);font-size:13px;display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.okmsg{color:var(--ok);font-size:13px;display:flex;gap:8px;align-items:center;margin-top:10px}
.center{text-align:center}
.big{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:4px auto 10px;background:var(--soft);color:var(--accent)}
.big.good{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
h2{font-size:17px;margin:0 0 4px;font-weight:650}
p.m{margin:0;color:var(--hint);font-size:13.5px}
.feat{list-style:none;padding:0;margin:12px 0 0}
.feat li{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.feat svg{color:var(--ok)}
.price{font-weight:700;margin-left:auto;text-align:right;font-size:14px}
.price small{display:block;font-weight:500;color:var(--hint);font-size:11.5px}
.kv{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--sep);border-radius:10px;background:var(--bg);margin-bottom:8px}
.kv code{font:600 13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;flex:1}
.kv .k{font-size:11.5px;color:var(--hint);display:block;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:9;max-width:90%;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.banner{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--text);margin-bottom:12px}
.banner svg{color:var(--accent);margin-top:1px}
table.pl{width:100%;border-collapse:collapse;font-size:13px}
.plan{border:1px solid var(--sep);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.plan .full{grid-column:1/-1}
.plan input,.plan select{padding:8px 10px;font-size:13px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.tgl{width:44px;height:26px;border-radius:13px;background:var(--sep);border:0;position:relative;cursor:pointer;flex:none}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl.on{background:var(--accent)}.tgl.on:after{left:21px}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat div{background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-size:18px}
.stat span{font-size:11.5px;color:var(--hint)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
/* real file input laid over the button: Telegram for PC blocks opening a hidden one from code */
.pickwrap{position:relative;overflow:hidden}.pickin{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.drop.over{border-color:var(--accent);background:var(--soft)}
.foot{text-align:center;color:var(--hint);font-size:11.5px;margin-top:18px}
</style>
<style>
.qpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;background:var(--card);color:var(--hint);border:1px solid var(--sep);border-radius:999px;padding:6px 12px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.12);pointer-events:none}
textarea.t{min-height:84px;resize:vertical;font:inherit;width:100%}
.chrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--sep);border-radius:var(--r);background:var(--card);margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
.av{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--sep);background:var(--card);border-radius:10px;padding:9px 6px;font-weight:600;font-size:13px;color:var(--hint);cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
ol.steps{margin:0;padding-left:20px}ol.steps li{margin:6px 0;font-size:14px}
.g2 .btn+.btn,.g3 .btn+.btn{margin-top:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--hint);margin:2px 4px 2px 0}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.pill.bad{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}.pill.ac{background:var(--soft);color:var(--accent)}
.num{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--sep);background:var(--card);font-size:18px;cursor:pointer}
.stepper b{min-width:28px;text-align:center;font-size:18px}
.score{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;margin:4px auto 8px;font-size:26px;font-weight:700;border:6px solid var(--accent);color:var(--accent)}
.meter{height:8px;border-radius:8px;background:var(--bg);overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--accent)}
.photo{width:100%;border-radius:12px;display:block;max-height:320px;object-fit:cover;background:var(--bg)}
.rec{width:84px;height:84px;border-radius:50%;border:0;background:var(--danger);color:#fff;display:grid;place-items:center;margin:8px auto;cursor:pointer}
.rec.on{animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--danger) 25%,transparent)}}
.inv{border-radius:18px;padding:26px 20px;text-align:center;border:1px solid var(--sep);background:var(--card);margin-bottom:12px}
.inv .eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--hint)}
.inv h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:26px;margin:10px 0 6px;line-height:1.2}
.inv .line{width:48px;height:1px;background:var(--accent);margin:14px auto}
.qrbox{background:#fff;border-radius:14px;padding:14px;display:inline-block}
.qrbox svg,.qrbox img{display:block;width:200px;height:200px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}table.tb td{padding:8px 4px;border-bottom:1px solid var(--sep);vertical-align:top}table.tb td:first-child{color:var(--hint);width:38%}

/* ---- v2 visual layer: motion, skeletons, insights, health ---- */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app.enter>*{animation:fadeUp .24s cubic-bezier(.2,.7,.2,1) both}   /* only when moving to another screen */
#app.enter>*:nth-child(2){animation-delay:.03s}#app.enter>*:nth-child(3){animation-delay:.06s}#app.enter>*:nth-child(4){animation-delay:.09s}#app.enter>*:nth-child(5){animation-delay:.12s}#app.enter>*:nth-child(n+6){animation-delay:.15s}
.top .logo{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#7c3aed));box-shadow:0 6px 16px -8px var(--accent)}
.card,.chrow,.tool,.radio{box-shadow:0 1px 2px rgba(16,24,40,.04)}
.btn,.chrow,.tool,.radio,.mini,.ibtn{transition:transform .08s ease,box-shadow .15s ease,background-color .15s ease}
.btn:active,.chrow:active,.tool:active,.radio:active,.mini:active,.ibtn:active{transform:scale(.975)}
.btn:not(.ghost):not(.sec2){box-shadow:0 6px 14px -10px var(--accent)}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--bg) 25%,color-mix(in srgb,var(--sep) 70%,var(--bg)) 37%,var(--bg) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.banner.bad{background:color-mix(in srgb,var(--danger) 12%,transparent)}.banner.bad svg{color:var(--danger)}
.banner.warn{background:color-mix(in srgb,#f79009 14%,transparent)}.banner.warn svg{color:#b54708}
.banner{align-items:center}
.insight{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);margin-bottom:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--accent) 25%,var(--sep));font-size:13.5px}
.insight .ii{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-text);flex:none}
.insight.bad{background:linear-gradient(135deg,color-mix(in srgb,var(--danger) 12%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--danger) 30%,var(--sep))}.insight.bad .ii{background:var(--danger)}
.insight .btn{width:auto;flex:none}
.hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ht{position:relative;background:var(--bg);border-radius:12px;padding:10px 12px 10px 14px;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.ht:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ok)}
.ht.warn:before{background:#f79009}.ht.bad:before{background:var(--danger)}
.ht b{font-size:16px}.ht span{font-size:11.5px;color:var(--hint)}.ht small{font-size:10.5px;color:var(--hint)}.ht .dot{display:none}
details summary{cursor:pointer}
.bub{max-width:88%;padding:8px 12px;border-radius:12px;margin-top:8px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}.bub.me{background:var(--soft);margin-left:auto}.bub.them{background:var(--bg)}.bub .fs{font-size:11px;margin-bottom:2px}
.intro{border-color:color-mix(in srgb,var(--accent) 30%,var(--sep));background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 10%,var(--card)),var(--card) 60%)}
.intro .ii{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-text);flex:none}
.faq summary{list-style:none}.faq summary::-webkit-details-marker{display:none}.faq summary:after{content:'+';float:right;color:var(--hint);font-weight:700}.faq[open] summary:after{content:'–'}
@media (prefers-reduced-motion:reduce){#app.enter>*,.sk{animation:none}.btn,.chrow,.tool{transition:none}}
</style>

.wrap{padding-bottom:110px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 14px;margin-bottom:12px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#2b6cff 0%,#1b2a6b 45%,#0b1226 100%);box-shadow:0 14px 34px rgba(11,18,38,.28)}

.hero .sub{font-size:12.5px;opacity:.8}
.hero .hmini{color:#fff;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}

.hero .hmini b{display:block;font-size:15px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero .hmini span{font-size:11px;opacity:.75}
.kpis2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--sep);border-radius:16px;padding:12px 14px}.kpi .v{font-size:20px;font-weight:800;margin-top:2px}.kpi .k{font-size:12px;color:var(--hint)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{border:1.5px solid var(--sep);background:var(--card);border-radius:16px;padding:12px;text-align:left;display:flex;align-items:center;gap:10px;cursor:pointer;color:inherit;font:inherit;font-weight:600}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.t-debt{color:#2f6bff;background:color-mix(in srgb,#2f6bff 14%,transparent)}.t-payment{color:#16a34a;background:color-mix(in srgb,#16a34a 14%,transparent)}
.t-income{color:#0d9488;background:color-mix(in srgb,#0d9488 14%,transparent)}.t-expense{color:#dc2626;background:color-mix(in srgb,#dc2626 13%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{border:1px solid var(--sep);background:var(--card);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;color:inherit;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-text,#fff);border-color:var(--accent)}
.amtbig{font-size:32px!important;font-weight:800!important;text-align:center;letter-spacing:-.01em}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:linear-gradient(135deg,#2f6bff,#1b2a6b);color:#fff;box-shadow:0 12px 26px rgba(27,42,107,.4);display:grid;place-items:center;z-index:55;cursor:pointer}
.fab .i{width:26px;height:26px}
.dayh{font-size:12px;color:var(--hint);margin:12px 4px 6px;font-weight:700;letter-spacing:.02em}
.hbar{height:8px;border-radius:6px;background:color-mix(in srgb,var(--hint) 18%,transparent);overflow:hidden;margin-top:6px}.hbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#2f6bff,#7c3aed)}
.wa{background:#25D366!important;color:#fff!important;border-color:#25D366!important}
.lockt{opacity:.75}
.rrow{display:flex;align-items:center;gap:10px}
.phone2{display:grid;grid-template-columns:minmax(120px,42%) 1fr;gap:8px}

   var st=s.settings,acc=st.testMode&&!d.simulateFree?'test':s.sub&&new Date(s.sub.expiry)>new Date()?'sub':s.freeUsed<st.freeAllowance?'free':'';
   if(!acc)return{ok:true,allowed:false};if(acc==='free')s.freeUsed++;var n={id:'c'+K.uid(),name:d.name,phone:d.phone,token:'t'+K.uid(),linked:false,entries:[]};s.app.customers.push(n);

   if(!d.id){s.app.cash=s.app.cash||[];if(!s.app.cash.some(function(x){return x.id===e.id}))s.app.cash.push(e);return{ok:true,customer:null}}
   var c=fc(s,d.id);if(!c.entries.some(function(x){return x.id===e.id}))c.entries.push(e);return{ok:true,customer:sum(c)}},
  dbDeleteEntry:function(d,s){if(!d.id){s.app.cash=(s.app.cash||[]).filter(function(e){return e.id!==d.entry});return{ok:true}}var c=fc(s,d.id);c.entries=c.entries.filter(function(e){return e.id!==d.entry});return{ok:true,customer:sum(c)}},
  dbRemindAction:function(d,s){var c=fc(s,d.id);c.reminded=new Date().toISOString();return{ok:true,allowed:true,reminded:c.reminded}},
  dbSaveShop:function(d,s){s.app.shop=d.shop;return{ok:true}},
  dbReport:function(d,s){if(tier()==='free')return{ok:true,allowed:false};var n=new Date(),y=n.getUTCFullYear(),mo=n.getUTCMonth(),f=function(x){return x.toISOString().slice(0,10)},P;
   P=d.period==='lastmonth'?{from:f(new Date(Date.UTC(y,mo-1,1))),to:f(new Date(Date.UTC(y,mo,0)))}:d.period==='year'?{from:y+'-01-01',to:f(n)}:d.period==='all'?{from:'0000-01-01',to:'9999-12-31'}:{from:f(new Date(Date.UTC(y,mo,1))),to:f(n)};
   var T={credit:0,paid:0,outstanding:0,overdueCount:0,overdueAmount:0,customers:0,income:0,expense:0},out={shop:s.app.shop,period:d.period,from:P.from,to:P.to,totals:T,customers:[],entries:[],byCategory:[],byMethod:[]},cat={},meth={};
   s.app.customers.forEach(function(c){if(d.customer&&c.id!==d.customer)return;var sm=sum(c),cr=0,pd=0;c.entries.forEach(function(e){if(e.date<P.from||e.date>P.to)return;if(e.type==='debt')cr+=+e.amount;else{pd+=+e.amount;if(e.method)meth[e.method]=(meth[e.method]||0)+(+e.amount)}out.entries.push({date:e.date,name:c.name,type:e.type,amount:+e.amount,note:e.note,due:e.due,method:e.method})});
    T.customers++;T.credit+=cr;T.paid+=pd;if(sm.balance>0)T.outstanding+=sm.balance;if(sm.overdue){T.overdueCount++;T.overdueAmount+=sm.balance}
    out.customers.push({name:c.name,phone:c.phone,credit:cr,paid:pd,balance:sm.balance,due:sm.dueDate,overdue:sm.overdue})});
   if(!d.customer)(s.app.cash||[]).forEach(function(e){if(e.date<P.from||e.date>P.to)return;var a=+e.amount;if(e.type==='income'){T.income+=a;if(e.method)meth[e.method]=(meth[e.method]||0)+a}else{T.expense+=a;cat[e.category||'Other']=(cat[e.category||'Other']||0)+a}out.entries.push({date:e.date,name:e.category||'',type:e.type,amount:a,note:e.note,method:e.method})});
   T.sales=T.credit+T.income;T.profit=T.sales-T.expense;T.cashIn=T.paid+T.income;T.net=T.cashIn-T.expense;
   out.byCategory=Object.keys(cat).map(function(k){return{category:k,amount:cat[k]}}).sort(function(a,b){return b.amount-a.amount});out.byMethod=Object.keys(meth).map(function(k){return{method:k,amount:meth[k]}}).sort(function(a,b){return b.amount-a.amount});
   out.customers.sort(function(a,b){return b.balance-a.balance});out.entries.sort(function(a,b){return a.date<b.date?-1:1});return{ok:true,allowed:true,report:out}},
  dbStatement:function(d,s){var c=s.app.customers.filter(function(x){return x.token===d.token})[0];return c?{ok:true,shop:s.app.shop,customer:sum(c)}:{ok:false}}
 }

 return'<select class="t" id="'+id+'">'+lst.map(function(x){return'<option value="'+x.c+'" '+(x.c===sel?'selected':'')+'>'+esc(x.n)+(withCode?' +'+x.d:'')+'</option>'}).join('')+'</select>'}
function custById(id){return D.book?D.book.customers.filter(function(c){return c.id===id})[0]:null}
function keepAdd(){var A=D.add;if(!A)return;var g=function(i){var e=document.getElementById(i);return e?e.value:null},v;
 if((v=g('aamt'))!==null)A.amount=v;if((v=g('acust'))!==null)A.cust=v;if((v=g('adate'))!==null)A.date=v;if((v=g('adue'))!==null)A.due=v;if((v=g('anote'))!==null)A.note=v}
function markReminded(c,via){c.reminded=new Date().toISOString();setCust(c);K.queueSave('dbRemindAction',{id:c.id,via:via});setTimeout(K.render,300)}
function periodLabel(r){return r.from==='0000-01-01'?t('p_all'):t('p_'+r.period)+' · '+r.from+' → '+r.to}

  {kpis:[[t('sales'),m(T.sales,c)],[t('expenses'),m(T.expense,c),'bad'],[t('profit'),m(T.profit,c),T.profit>=0?'good':'bad'],[t('net_cash'),m(T.net,c)]]},
  {kpis:[[t('credit_sales'),m(T.credit,c)],[t('received'),m(T.paid,c),'good'],[t('outstanding_now'),m(T.outstanding,c)],[t('overdue_amt')+' ('+T.overdueCount+')',m(T.overdueAmount,c),'bad']]}];
 if(r.byCategory&&r.byCategory.length)blocks.push({h:t('by_cat')},{bars:{items:r.byCategory.map(function(x){return[x.category,x.amount]}),fmt:function(v){return m(v,c)}}});
 blocks.push({h:t('cust_balances')},{table:{cols:[{label:t('customer'),w:2},{label:t('phone_l'),w:1.5},{label:t('credit_sales'),w:1.25,align:'right'},{label:t('received'),w:1.55,align:'right'},{label:t('balance'),w:1.2,align:'right'},{label:t('due').replace(/\s*\(.*\)/,''),w:1.2}],
   rows:r.customers.map(function(x){return[x.name,x.phone||'',m(x.credit,c),m(x.paid,c),{v:m(x.balance,c),tone:x.overdue?'bad':x.balance<=0?'good':null},x.due||'']}),
   total:[t('total'),'',m(T.credit,c),m(T.paid,c),m(T.outstanding,c),'']}},
  {h:t('transactions')},{table:{cols:[{label:t('date'),w:1.2},{label:t('type'),w:1.2},{label:t('customer')+' / '+t('category'),w:2},{label:t('amount'),w:1.2,align:'right'},{label:t('note').replace(/\s*\(.*\)/,''),w:2}],empty:t('no_tx'),
   rows:r.entries.map(function(e){var neg=e.type==='expense';return[e.date,t('ty_'+e.type),e.name||'',{v:(neg?'−':'+')+m(e.amount,c),tone:neg?'bad':e.type==='debt'?null:'good'},e.note||'']})}});
 return{brand:r.shop.name||t('appName'),title:t('fin_report'),subtitle:periodLabel(r),rtl:false,blocks:blocks}}

 blocks:[{kpis:[[t('balance'),m(cc.balance,cu),cc.overdue?'bad':cc.balance<=0?'good':null],[t('credit_sales'),m(cc.credit,cu)],[t('received'),m(cc.paid,cu),'good']]},
  {h:t('history')},{table:{cols:[{label:t('date'),w:1.2},{label:t('type'),w:1},{label:t('note').replace(/\s*\(.*\)/,''),w:2.4},{label:t('amount'),w:1.2,align:'right'},{label:t('balance'),w:1.2,align:'right'}],empty:t('no_tx'),
   rows:r.entries.map(function(e){bal+=e.type==='debt'?e.amount:-e.amount;return[e.date,t(e.type),e.note||'',(e.type==='payment'?'−':'+')+m(e.amount,cu),m(bal,cu)]})}}]}}
function fc(s,id){return s.app.customers.filter(function(c){return c.id===id})[0]}
function computeA(s,d){var st=s.settings,test=st.testMode&&!d.simulateFree,left=Math.max(0,st.freeAllowance-s.freeUsed);return{entitled:test||left>0,reason:test?'test':left>0?'free':'blocked',freeLeft:left,freeUsed:s.freeUsed,freeAllowance:st.freeAllowance,credits:0}}
/* Optimistic update: cards and lists change at once; the server's answer replaces them when the save arrives.
   withPending()/cashWithPending() lay saves still waiting in the phone queue over data read from the server, so nothing seems to vanish. */
function setCust(c){if(D.cust&&D.cust.id===c.id)D.cust=c;if(D.book&&D.book.customers)D.book.customers=D.book.customers.map(function(x){return x.id===c.id?c:x})}
function withPending(c){var es=(c.entries||[]).slice(),ch=false;K.pending().forEach(function(p){var d=p.data;if(d.id!==c.id)return;
  if(p.action==='dbAddEntry'&&!es.some(function(e){return e.id===d.entry})){es.push({id:d.entry,type:d.type,amount:+d.amount,date:d.date,due:d.due,note:d.note,method:d.method,category:d.category});ch=true}
  if(p.action==='dbDeleteEntry'){var n=es.length;es=es.filter(function(e){return e.id!==d.entry});ch=ch||es.length!==n}});
 return ch?sum(Object.assign({},c,{entries:es})):c}
function cashWithPending(list){var es=list.slice();K.pending().forEach(function(p){var d=p.data;if(d.id)return;
  if(p.action==='dbAddEntry'&&!es.some(function(e){return e.id===d.entry}))es.push({id:d.entry,type:d.type,amount:+d.amount,date:d.date,note:d.note,method:d.method,category:d.category});
  if(p.action==='dbDeleteEntry')es=es.filter(function(e){return e.id!==d.entry})});return es}
K.onSaved('dbAddEntry',function(r){if(r.ok&&r.customer){setCust(withPending(r.customer));K.render()}});
K.onSaved('dbDeleteEntry',function(r){if(r.ok&&r.customer){setCust(withPending(r.customer));K.render()}});
K.onSaved('dbRemindAction',function(r){if(r.ok&&r.allowed===false)bizWall()});
/* balance + oldest open due date (same rule as the server) */
function sum(c){var bal=0,dues=[];(c.entries||[]).forEach(function(e){if(e.type!=='debt'&&e.type!=='payment')return;bal+=e.type==='debt'?+e.amount:-e.amount;if(e.type==='debt'&&e.due)dues.push(e.due)});dues.sort();
 var due=bal>0?(dues[0]||''):'';return Object.assign({},c,{balance:Math.round(bal*100)/100,dueDate:due,overdue:!!due&&due<today()})}

})();
