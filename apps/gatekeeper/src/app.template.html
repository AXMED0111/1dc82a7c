<script>
(function(){
var t=K.t,esc=K.esc,ic=K.ic,S=K.S,api=K.api;
var KEY=K.param('c');
var G={tab:'channels',mine:null,fee:0,subs:null,edit:null,offer:null,members:null,mf:'active',q:'',member:null,bc:{aud:'active'}};
function money(n){return'$'+(+n||0).toFixed(2).replace(/\.00$/,'')}
function planName(id){var p=(G.edit&&G.edit.plans||[]).filter(function(x){return x.id===id})[0];return p?p.label:id==='gift'?'Gift':id==='test'?'Test':id}
function confirmBox(msg,cb){if(K.IN_TG&&K.TG.showConfirm)K.TG.showConfirm(msg,function(ok){if(ok)cb()});else if(confirm(msg))cb()}
function statusChip(c){if(!c.botOk)return'<span class="pill bad">'+t('notready')+'</span>';return c.status==='active'?'<span class="pill ok">'+t('active')+'</span>':'<span class="pill">'+t('paused')+'</span>'}
function memPill(m){if(m.status==='stopped')return'<span class="pill bad">'+t('m_stopped')+'</span>';if(m.status==='expired')return'<span class="pill">'+t('m_expired')+'</span>';
 return m.daysLeft<=3?'<span class="pill bad">'+t('days_left',{n:Math.max(0,m.daysLeft)})+'</span>':'<span class="pill ok">'+t('days_left',{n:m.daysLeft})+'</span>'}
function filtered(){var q=G.q.toLowerCase();return(G.members||[]).filter(function(m){var f=G.mf==='active'?m.status==='active':G.mf==='expiring'?m.status==='active'&&m.daysLeft<=3:m.status!=='active';
 return f&&(!q||(m.name+' '+(m.username||'')).toLowerCase().indexOf(q)>=0)})}
function offerPaywall(o){var c=o.channel;K.paywall({noRef:true,title:c.title,text:c.description||t('tagline'),icon:'channel',features:[t('f_instant'),t('f_auto'),t('f_remind')],
 plans:c.plans.map(function(p){return{id:c.key+'|'+p.id,label:p.label,days:p.days,credits:0,usd:p.usd,stars:p.stars}}),paidText:t('paid_ok2'),
 after:function(){S.stack=[];S.screen='offer';G.offer=null;K.render();loadOffer()}})}
function loadOffer(){api('gkChannel',{key:KEY}).then(function(r){G.offer=r;K.render()})}

K.app({
 icon:'channel',freeLabel:null,showPlans:false,
 defaults:{appName:'Channel Pass',freeAllowance:0,x_feePercent:5,plans:[],x_refOn:false},
 adminFields:[{key:'x_feePercent',label:'Platform fee (%)',type:'number',ph:'5',hint:'Your share of every channel sale. Creators are paid the rest.'}],
 adminLoad:function(){return api('adminGk')},

 adminExtra:function(x){x=x||{channels:[]};return'<div class="sec">Creators &amp; payouts owed</div><div class="card">'+(x.channels&&x.channels.length?'<ul class="files">'+x.channels.map(function(c){return'<li><div class="grow"><div class="fn">'+esc(c.title)+'</div><div class="fs">Owner '+esc(c.owner)+' · '+c.members+' members · pay to: '+esc(c.payout||'—')+'</div></div><div class="price">'+money(c.owedUsd)+'<small>'+c.owedStars+' Stars</small></div></li>'}).join('')+'</ul>':'<p class="m">No channels yet.</p>')+'</div>'},
 startScreen:function(){return KEY?'offer':'home'},

  codes:'Koodhadhka',codes_sub:'Koodhad iibsadayaashaada. Waxay geliyaan koodhka marka ay bixinayaan. Tusaale: VIP20 = 20% qiimo dhimis.',r_title:'Warbixinta xubnaha',r_active:'Firfircoon',r_expiring:'3 maalmood ku dhammaanaya',r_ended:'Dhammaaday / la joojiyay',r_revenue:'Dakhliga guud',name:'Magaca',status:'Xaalad',until:'ilaa {d}'}},
 enter:{
  home:function(){if(G.tab==='channels')api('gkMine').then(function(r){G.mine=r.ok?r.channels:[];G.fee=r.feePercent||0;K.render()});else api('gkMySubs').then(function(r){G.subs=r.ok?r.subs:[];K.render()})},
  offer:function(){G.offer=null;loadOffer()},
  members:function(){api('gkMembers',{key:G.edit.key}).then(function(r){G.members=r.ok?r.members:[];K.render()})}
 },
 screens:{
  home:function(){var h=K.header(t('appName'),t('tagline'))+K.banners()+'<div class="tabs"><button data-a="tab" data-v="channels" class="'+(G.tab==='channels'?'on':'')+'">'+t('t_channels')+'</button><button data-a="tab" data-v="subs" class="'+(G.tab==='subs'?'on':'')+'">'+t('t_subs')+'</button></div>';
   if(G.tab==='channels'){if(!G.mine)return h+K.spin();if(!G.mine.length)h+=K.empty('channel',t('none_ch'));
    G.mine.forEach(function(c){h+='<button class="chrow" data-a="edit" data-key="'+esc(c.key)+'"><div class="av">'+esc((c.title||'?').charAt(0).toUpperCase())+'</div><div class="grow"><div class="fn">'+esc(c.title)+'</div><div class="fs">'+t('members_n',{n:c.members||0})+' · '+money(c.revenue.usd)+(c.revenue.stars?' + '+c.revenue.stars+' Stars':'')+'</div><div>'+statusChip(c)+'</div></div></button>'});
    return h+'<button class="btn" data-go="how">'+ic('plus')+t('add')+'</button><button class="btn ghost" data-a="reload">'+ic('refresh')+t('refresh')+'</button>'}
   if(!G.subs)return h+K.spin();if(!G.subs.length)h+=K.empty('users',t('none_sub'));
   G.subs.forEach(function(s){h+='<div class="chrow"><div class="av">'+esc((s.title||'?').charAt(0))+'</div><div class="grow"><div class="fn">'+esc(s.title)+'</div><div class="fs">'+t('until',{d:K.fmtDate(s.expiry)})+'</div></div><button class="btn sm" data-open="'+esc(s.inviteLink)+'">'+ic('ext','s')+t('join')+'</button><button class="btn sm sec2" data-a="offer" data-key="'+esc(s.key)+'">'+t('renew')+'</button></div>'});
   return h},
  how:function(){var bot=K.CFG.botUsername||'YourBot';return K.header(t('how_title'),'')+'<div class="card"><ol class="steps"><li>'+t('s1')+'</li><li>'+t('s2',{bot:esc(bot)})+'</li><li>'+t('s3')+'</li><li>'+t('s4')+'</li></ol></div>'+
   (K.CFG.botUsername?'<button class="btn sec2" data-open="https://t.me/'+esc(K.CFG.botUsername)+'?startchannel&admin=invite_users+restrict_members">'+ic('ext')+'@'+esc(K.CFG.botUsername)+'</button>':'')+'<button class="btn" data-act="back">'+ic('refresh')+t('refresh')+'</button>'},
  edit:function(){var c=G.edit,fee=G.fee,r=c.revenue||{usd:0,stars:0,orders:0},url=K.appLink('c_'+c.key),h=K.header(c.title,t('edit'))+K.errBox();
   h+='<div class="g2"><button class="btn" data-a="members">'+ic('users')+t('members')+' ('+(c.members||0)+')</button><button class="btn sec2" data-a="bcopen">'+ic('send')+t('broadcast').split(' ')[0]+'</button></div><div class="g2"><button class="btn ghost" data-a="mpdf">'+ic('file')+t('members_pdf').replace(' (PDF)','')+'</button><button class="btn ghost" data-a="codes">'+ic('star')+t('codes')+'</button></div>';
   h+='<div class="sec">'+t('share')+'</div><div class="card">'+K.kv(t('share'),url,true)+'<p class="m">'+t('share_sub')+'</p>'+(c.botOk?'':'<div class="err">'+ic('alert','s')+'<span>'+t('s3')+'</span></div>')+'</div>';
   h+='<div class="card"><div class="sw"><div><b style="font-size:14px">'+t('publish')+'</b><div class="fs">'+t('publish_sub')+'</div></div><button class="tgl '+(c.status==='active'?'on':'')+'" data-a="pub"></button></div>'+
    '<label class="f">'+t('desc')+'</label><textarea class="t" id="desc" maxlength="500">'+esc(c.description)+'</textarea></div>';
   h+='<div class="sec">'+t('plans')+'</div>'+c.plans.map(function(p,i){return'<div class="plan"><div class="full"><label class="f">'+t('plan_label')+'</label><input class="t" data-pi="'+i+'" data-k="label" value="'+esc(p.label)+'" placeholder="1 month"></div>'+
    '<div><label class="f">'+t('days')+'</label><input class="t" type="number" data-pi="'+i+'" data-k="days" value="'+esc(p.days)+'"></div><div><label class="f">'+t('usd')+'</label><input class="t" type="number" step="0.01" data-pi="'+i+'" data-k="usd" value="'+esc(p.usd)+'"></div>'+
    '<div><label class="f">'+t('stars')+'</label><input class="t" type="number" data-pi="'+i+'" data-k="stars" value="'+esc(p.stars)+'"></div><div style="display:flex;align-items:flex-end"><button class="btn sm ghost" style="width:100%" data-a="prm" data-i="'+i+'">'+t('remove')+'</button></div></div>'}).join('')+
    (c.plans.length<6?'<button class="btn sm sec2" data-a="addplan">'+ic('plus','s')+t('add_plan')+'</button>':'');
   h+='<div class="card" style="margin-top:12px"><label class="f">'+t('payout')+'</label><input class="t" id="payout" value="'+esc(c.payout)+'"></div><button class="btn" data-a="savech">'+ic('check')+t('save')+'</button>';
   h+='<div class="sec">'+t('earn')+'</div><div class="card stat"><div><b>'+money(r.usd)+'</b><span>'+t('gross')+' (USD)</span></div><div><b>'+(r.stars||0)+'</b><span>'+t('gross')+' (Stars)</span></div><div><b>'+fee+'%</b><span>'+t('fee')+'</span></div><div><b>'+money(r.usd*(100-fee)/100)+'</b><span>'+t('net')+'</span></div></div>';
   return h+'<button class="btn ghost" data-a="newlink">'+ic('link')+t('new_link')+'</button>'},
  members:function(){var h=K.header(t('members'),G.edit.title);if(!G.members)return h+K.spin();
   var cnt={active:0,expiring:0,ended:0};G.members.forEach(function(m){if(m.status==='active'){cnt.active++;if(m.daysLeft<=3)cnt.expiring++}else cnt.ended++});
   h+='<div class="tabs">'+[['active',t('f_active')+' '+cnt.active],['expiring',t('f_expiring')+' '+cnt.expiring],['ended',t('f_ended')+' '+cnt.ended]].map(function(x){return'<button data-a="mf" data-v="'+x[0]+'" class="'+(G.mf===x[0]?'on':'')+'">'+esc(x[1])+'</button>'}).join('')+'</div>';
   h+='<input class="t" id="mq" placeholder="'+t('search')+'" value="'+esc(G.q)+'" style="margin-bottom:10px">';
   var list=filtered();if(!list.length)h+=K.empty('users',t('none_m'));
   list.forEach(function(m){h+='<button class="chrow" data-a="member" data-id="'+esc(m.user_id)+'"><div class="av">'+esc(m.name.charAt(0).toUpperCase())+'</div><div class="grow"><div class="fn">'+esc(m.name)+(m.username?' <span class="fs">@'+esc(m.username)+'</span>':'')+'</div><div class="fs">'+t('end')+': '+K.fmtDate(m.expiry)+'</div><div>'+memPill(m)+'</div></div>'+ic('back','s" style="transform:rotate(180deg);color:var(--hint)')+'</button>'});
   if(G.mf==='expiring'&&list.length)h+='<button class="btn sec2" data-a="bcexp">'+ic('bell')+t('broadcast')+' · '+t('aud_expiring')+'</button>';
   return h},
  member:function(){var m=G.member,h=K.header(m.name,m.username?'@'+m.username:'')+K.errBox();
   h+='<div class="card"><table class="tb"><tr><td>'+t('status')+'</td><td>'+memPill(m)+'</td></tr><tr><td>'+t('plan')+'</td><td>'+esc(planName(m.plan))+'</td></tr><tr><td>'+t('start')+'</td><td>'+K.fmtDate(m.start)+'</td></tr><tr><td>'+t('end')+'</td><td>'+K.fmtDate(m.expiry)+'</td></tr><tr><td>Telegram ID</td><td>'+esc(m.user_id)+'</td></tr></table></div>';
   h+='<div class="sec">'+t('send_msg')+'</div><div class="card"><textarea class="t" id="mmsg" placeholder="'+t('msg_ph')+'" maxlength="1000"></textarea><button class="btn sm" style="margin-top:8px;width:100%" data-a="mnotify">'+ic('send','s')+t('send')+'</button></div>';
   h+='<div class="sec">'+t('extend')+'</div><div class="card"><p class="m" style="margin-bottom:10px">'+t('extend_sub')+'</p><div class="g3">'+[7,30,90].map(function(d){return'<button class="btn sm sec2" style="margin-top:0" data-a="mext" data-d="'+d+'">+'+d+'</button>'}).join('')+'</div>'+
    '<div class="row" style="margin-top:8px"><input class="t" id="mdays" type="number" min="1" max="365" placeholder="'+t('custom_days')+'"><button class="btn sm" data-a="mext" data-d="custom">'+t('send').replace(t('send'),'+')+'</button></div></div>';
   if(m.status==='active')h+='<div class="sec">'+t('stop')+'</div><div class="card"><p class="m" style="margin-bottom:10px">'+t('stop_sub')+'</p><label class="f">'+t('reason')+'</label><input class="t" id="mreason"><button class="btn" style="margin-top:10px;background:var(--danger)" data-a="mstop">'+ic('x')+t('stop')+'</button></div>';
   return h},
  chcodes:function(){var h=K.header(t('codes'),G.edit.title)+'<p class="m" style="margin-bottom:10px">'+t('codes_sub')+'</p>';if(!G.codes)return h+K.spin();
   return h+K.codesBlock(G.codes,G.edit.plans.map(function(p){return p.id}).join(', '))},
  broadcast:function(){var h=K.header(t('broadcast'),G.edit.title);
   h+='<div class="card"><label class="f">'+t('aud')+'</label>'+K.seg('aud',G.bc.aud,[['active',t('aud_active')],['expiring',t('aud_expiring')]])+'<label class="f">'+t('send_msg')+'</label><textarea class="t" id="bctext" maxlength="1500" style="min-height:120px" placeholder="'+t('bc_ph')+'"></textarea><div class="fs" style="margin-top:6px">'+t('bc_hint')+'</div></div>';
   return h+'<button class="btn" data-a="bcsend">'+ic('send')+t('send')+'</button>'+K.errBox()},
  offer:function(){var o=G.offer;if(!o)return K.header(t('appName'),'')+K.spin();if(!o.ok)return K.header(t('appName'),'')+K.empty('alert',t('not_found'));
   var c=o.channel,h=K.header(c.title,c.username?'@'+c.username:'')+K.banners();
   h+='<div class="card"><div class="row" style="gap:12px"><div class="av">'+esc(c.title.charAt(0).toUpperCase())+'</div><h2 class="grow">'+esc(c.title)+'</h2></div>'+(c.description?'<p class="m" style="margin-top:10px;white-space:pre-line">'+esc(c.description)+'</p>':'')+'</div>';
   if(o.member)h+='<div class="card"><div class="okmsg" style="margin:0">'+ic('check','s')+t('active_until',{d:K.fmtDate(o.member.expiry)})+'</div></div><button class="btn" data-open="'+esc(o.inviteLink)+'">'+ic('ext')+t('join')+'</button>';
   if(c.status!=='active')return h+(o.member?'':'<div class="card"><p class="m">'+t('not_found')+'</p></div>');
   h+='<div class="sec">'+t('plans')+'</div><div class="card"><ul class="files">'+c.plans.map(function(p){return'<li><div class="grow"><div class="fn">'+esc(p.label)+'</div><div class="fs">'+t('days')+': '+p.days+'</div></div><div class="price">'+(p.usd?money(p.usd):'')+(p.stars?'<small>'+p.stars+' Stars</small>':'')+'</div></li>'}).join('')+'</ul></div>';
   h+='<button class="btn" data-a="buy">'+ic('star')+(o.member?t('renew'):t('join'))+'</button>';
   if(S.me.access&&S.me.access.reason==='test')h+='<button class="btn ghost" data-a="testjoin">'+ic('shield')+t('test_join')+'</button>';
   return h}
 },
 onSeg:function(n,v){if(n==='aud'){G.bc.aud=v;var x=document.getElementById('bctext'),keep=x?x.value:'';K.render();document.getElementById('bctext').value=keep}},
 actions:{
  tab:function(el,d){G.tab=d.v;G.mine=G.subs=null;K.home()},
  reload:function(){G.mine=null;K.home()},
  edit:function(el,d){G.edit=JSON.parse(JSON.stringify(G.mine.filter(function(c){return c.key===d.key})[0]));K.go('edit')},
  offer:function(el,d){KEY=d.key;K.go('offer')},
  pub:function(){keep();G.edit.status=G.edit.status==='active'?'paused':'active';K.render()},
  addplan:function(){keep();G.edit.plans.push({id:'p'+Date.now().toString(36).slice(-4),label:'',days:30,usd:1,stars:75});K.render()},
  prm:function(el,d){keep();G.edit.plans.splice(+d.i,1);K.render()},
  savech:function(){keep();var c=G.edit;api('gkSave',{key:c.key,description:c.description,plans:c.plans,payout:c.payout,status:c.status}).then(function(r){S.msg=r.ok?t('saved'):'';S.err=r.ok?'':t('e_gen');K.render()})},
  newlink:function(){api('gkRefreshLink',{key:G.edit.key}).then(function(r){K.toast(r.ok?t('saved'):t('e_gen'))})},
  members:function(){G.members=null;G.mf='active';G.q='';K.go('members')},
  mf:function(el,d){G.mf=d.v;K.render()},
  member:function(el,d){G.member=G.members.filter(function(m){return m.user_id===d.id})[0];K.go('member')},
  mnotify:function(){var x=document.getElementById('mmsg').value.trim();if(!x)return;api('gkMemberAction',{key:G.edit.key,user_id:G.member.user_id,op:'notify',text:x}).then(function(r){
   if(r.ok){document.getElementById('mmsg').value='';K.toast(t('sent'));K.haptic('ok')}else{S.err=r.error==='blocked_bot'?t('blocked_bot'):t('e_gen');K.render()}})},
  mext:function(el,d){var days=d.d==='custom'?parseInt(document.getElementById('mdays').value,10):+d.d;if(!(days>=1&&days<=365))return;
   api('gkMemberAction',{key:G.edit.key,user_id:G.member.user_id,op:'extend',days:days}).then(function(r){if(!r.ok){S.err=t('e_gen');return K.render()}
    G.member.expiry=r.expiry;G.member.status='active';G.member.daysLeft=Math.ceil((new Date(r.expiry)-Date.now())/864e5);S.msg=t('extended_ok',{d:K.fmtDate(r.expiry)});S.err='';K.haptic('ok');K.render()})},
  mstop:function(){var m=G.member,why=(document.getElementById('mreason')||{}).value||'';confirmBox(t('stop_confirm',{n:m.name}),function(){
   api('gkMemberAction',{key:G.edit.key,user_id:m.user_id,op:'stop',reason:why}).then(function(r){if(!r.ok){S.err=t('e_gen');return K.render()}m.status='stopped';m.daysLeft=0;S.msg=t('stopped_ok');S.err='';K.haptic('ok');K.render()})})},
  codes:function(){G.codes=null;K.go('chcodes');api('gkCodes',{key:G.edit.key}).then(function(r){G.codes=r.codes||[];K.render()})},
  bcopen:function(){G.bc.aud='active';K.go('broadcast')},
  bcexp:function(){G.bc.aud='expiring';K.go('broadcast')},
  bcsend:function(){var x=document.getElementById('bctext').value.trim();if(!x)return;confirmBox(t('broadcast')+'?',function(){
   api('gkBroadcast',{key:G.edit.key,audience:G.bc.aud,text:x}).then(function(r){if(r.ok){S.msg=t('bc_ok',{n:r.queued});document.getElementById('bctext').value=''}else S.err=t('e_gen');K.render()})})},
  mpdf:function(){var c=G.edit;K.showReport(function(){return api('gkMembers',{key:c.key}).then(function(r){var ms=r.members||[],a=ms.filter(function(m){return m.status==='active'}),rev=c.revenue||{usd:0,stars:0};
   return{brand:t('appName'),title:t('r_title'),subtitle:c.title,blocks:[{kpis:[[t('r_active'),a.length,'good'],[t('r_expiring'),a.filter(function(m){return m.daysLeft<=3}).length,'bad'],[t('r_ended'),ms.length-a.length],[t('r_revenue'),money(rev.usd)+(rev.stars?' + '+rev.stars+'★':'')]]},
    {h:t('members')+' ('+ms.length+')'},{table:{cols:[{label:t('name'),w:2},{label:t('username'),w:1.6},{label:t('plan'),w:1},{label:t('start'),w:1.1},{label:t('end'),w:1.1},{label:t('status'),w:1.3}],
     rows:ms.map(function(m){return[m.name,m.username?'@'+m.username:'',planName(m.plan),K.fmtDate(m.start),K.fmtDate(m.expiry),{v:m.status==='active'?t('days_left',{n:m.daysLeft}):t(m.status==='stopped'?'m_stopped':'m_expired'),tone:m.status!=='active'?'bad':m.daysLeft<=3?'bad':'good'}]})}}]}})},
   (c.title.replace(/[^\w\- ]+/g,'')||'channel')+' members.pdf')},
  buy:function(){offerPaywall(G.offer)},
  testjoin:function(){api('gkTestJoin',{key:KEY}).then(function(){G.offer=null;loadOffer()})}
 },
 demoResolvePlan:function(id,s){var p=String(id).split('|'),c=s.app.channels.filter(function(x){return x.key===p[0]})[0],pl=c&&c.plans.filter(function(x){return x.id===p[1]})[0];return pl?{id:id,label:pl.label,days:pl.days,credits:0,usd:pl.usd,stars:pl.stars}:null},
 demoOnPaid:function(o,p,s){var k=String(o.plan).split('|')[0];if(!s.app.channels.some(function(c){return c.key===k}))return false;dActivate(s,k,'me','Demo buyer','',p.days,String(o.plan).split('|')[1]);return true},
 demoSeed:function(){var d=function(n){return new Date(Date.now()+n*864e5).toISOString()};
  return{channels:[{key:'demo1',title:'Demo Trading Signals',username:'',description:'Daily signals and market notes. Members get every post the moment it is published.',status:'active',botOk:true,
   plans:[{id:'p1',label:'1 month',days:30,usd:5,stars:350},{id:'p2',label:'3 months',days:90,usd:12,stars:850}],payout:'',inviteLink:'https://t.me/+demoInvite'}],
   members:[{key:'demo1',user_id:'7001',name:'Hodan Ahmed',username:'hodan_a',plan:'p1',start:d(-28),expiry:d(2),status:'active'},{key:'demo1',user_id:'7002',name:'Abdi Hassan',username:'',plan:'p2',start:d(-40),expiry:d(50),status:'active'},
    {key:'demo1',user_id:'7003',name:'Faisal Omar',username:'faisal_o',plan:'p1',start:d(-10),expiry:d(20),status:'active'},{key:'demo1',user_id:'7004',name:'Layla Noor',username:'',plan:'p1',start:d(-45),expiry:d(-15),status:'expired'}],
   outbox:[]}},
 demo:{
  gkMine:function(d,s){return{ok:true,feePercent:+s.settings.x_feePercent||0,channels:s.app.channels.map(function(c){return Object.assign({},c,{members:s.app.members.filter(function(m){return m.key===c.key&&m.status==='active'&&new Date(m.expiry)>new Date()}).length,revenue:dRev(s,c.key)})})}},
  gkSave:function(d,s){var c=dCh(s,d.key);c.description=d.description;c.plans=d.plans.filter(function(p){return p.label&&(p.usd>0||p.stars>0)});c.payout=d.payout;if(d.status)c.status=d.status;return{ok:true}},
  gkRefreshLink:function(){return{ok:true}},
  gkChannel:function(d,s){var c=dCh(s,d.key);if(!c)return{ok:false,error:'not_found'};var m=dMem(s,d.key,'me');return{ok:true,channel:c,member:m?{expiry:m.expiry}:null,inviteLink:m?c.inviteLink:''}},
  gkMySubs:function(d,s){return{ok:true,subs:s.app.members.filter(function(m){return m.user_id==='me'&&m.status==='active'&&new Date(m.expiry)>new Date()}).map(function(m){var c=dCh(s,m.key)||{};return{key:m.key,title:c.title,expiry:m.expiry,inviteLink:c.inviteLink}})}},
  gkTestJoin:function(d,s){var c=dCh(s,d.key);dActivate(s,d.key,'me','Demo buyer','',(c.plans[0]||{days:1}).days,'test');return{ok:true}},
  gkMembers:function(d,s){var now=Date.now();return{ok:true,members:s.app.members.filter(function(m){return m.key===d.key}).map(function(m){var st=m.status==='active'&&new Date(m.expiry)>now?'active':m.status==='stopped'?'stopped':'expired';
   return{user_id:m.user_id,name:m.name,username:m.username,plan:m.plan,start:m.start,expiry:m.expiry,status:st,daysLeft:Math.ceil((new Date(m.expiry)-now)/864e5)}}).sort(function(a,b){return a.status===b.status?new Date(a.expiry)-new Date(b.expiry):a.status==='active'?-1:1})}},
  gkMemberAction:function(d,s){var m=s.app.members.filter(function(x){return x.key===d.key&&x.user_id===d.user_id})[0];if(!m)return{ok:false};
   if(d.op==='notify'){s.app.outbox.push({to:m.user_id,text:d.text});return{ok:true}}
   if(d.op==='extend'){var base=m.status==='active'&&new Date(m.expiry)>new Date()?new Date(m.expiry):new Date();m.expiry=new Date(base.getTime()+d.days*864e5).toISOString();m.status='active';return{ok:true,expiry:m.expiry}}
   if(d.op==='stop'){m.status='stopped';m.expiry=new Date().toISOString();return{ok:true}}return{ok:false}},
  gkCodes:function(d,s){return{ok:true,codes:(s.codes||[]).filter(function(c){return c.scope==='ch:'+d.key})}},
  gkCodeSave:function(d,s){return K.dCodeSave(s,d,'ch:'+d.key)},
  gkCodeToggle:function(d,s){var c=(s.codes||[]).filter(function(x){return x.code===d.code})[0];if(c)c.active=!!d.active;return{ok:true}},
  gkBroadcast:function(d,s){var now=Date.now(),n=0;s.app.members.forEach(function(m){var e=new Date(m.expiry).getTime();if(m.key!==d.key||m.status!=='active'||e<=now||(d.audience==='expiring'&&e>now+3*864e5))return;s.app.outbox.push({to:m.user_id,text:d.text});n++});return{ok:true,queued:n}},
  adminGk:function(d,s){var fee=+s.settings.x_feePercent||0;return{ok:true,feePercent:fee,channels:s.app.channels.map(function(c){var r=dRev(s,c.key);return{key:c.key,title:c.title,owner:'demo',payout:c.payout,members:0,revenue:r,owedUsd:Math.round(r.usd*(100-fee))/100,owedStars:Math.floor(r.stars*(100-fee)/100)}})}}
 }
});
function dCh(s,k){return s.app.channels.filter(function(c){return c.key===k})[0]}
function dMem(s,k,u){return s.app.members.filter(function(m){return m.key===k&&m.user_id===u&&m.status==='active'&&new Date(m.expiry)>new Date()})[0]}
function dActivate(s,k,u,name,un,days,plan){var m=dMem(s,k,u),base=m?new Date(m.expiry):new Date(),exp=new Date(base.getTime()+(+days||30)*864e5).toISOString();if(m)m.expiry=exp;else s.app.members.push({key:k,user_id:u,name:name,username:un,plan:plan,start:new Date().toISOString(),expiry:exp,status:'active'})}
function dRev(s,k){var r={usd:0,stars:0,orders:0};s.orders.forEach(function(o){if(o.status==='paid'&&String(o.plan).indexOf(k+'|')===0){r.orders++;if(o.currency==='XTR')r.stars+=+o.amount;else r.usd+=parseFloat(String(o.amount).replace(/[^\d.]/g,''))||0}});return r}
function keep(){var c=G.edit,d=document.getElementById('desc'),p=document.getElementById('payout');if(d)c.description=d.value;if(p)c.payout=p.value;
 document.querySelectorAll('[data-pi]').forEach(function(el){c.plans[+el.dataset.pi][el.dataset.k]=el.type==='number'?+el.value:el.value.trim()})}
document.addEventListener('input',function(e){if(e.target.id==='mq'){G.q=e.target.value;var pos=e.target.selectionStart;K.render();var q=document.getElementById('mq');q.focus();q.setSelectionRange(pos,pos)}});
})();
