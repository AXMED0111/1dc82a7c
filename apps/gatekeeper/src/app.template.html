var LANG=lsGet('gk_lang',null)||(EDITION==='local'||(TGU&&TGU.language_code==='so')?'so':CFG.defaultLang);
function t(k,v){var s=(L[LANG]&&L[LANG][k])||L.en[k]||k;if(v)for(var x in v)s=s.split('{'+x+'}').join(v[x]);return s}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ic(n,c){return'<svg class="i '+(c||'')+'"><use href="#i-'+n+'"/></svg>'}
function fmtDate(s){var d=new Date(s);return isNaN(d)?'':d.toISOString().slice(0,10)}
function money(n){return'$'+(+n||0).toFixed(2)}
var toastT;function toast(m){var el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}el.textContent=m;el.classList.remove('hide');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.add('hide')},2400)}
function copy(x){(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(function(){toast(t('copied'))},function(){var ta=document.createElement('textarea');ta.value=x;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('copied'))}catch(e){}ta.remove()})}
function openLink(u){if(!u)return;if(IN_TG&&/^https:\/\/t\.me\//.test(u))TG.openTelegramLink(u);else window.open(u,'_blank')}
function shareUrl(key){if(CFG.botUsername&&CFG.appShortName)return'https://t.me/'+CFG.botUsername+'/'+CFG.appShortName+'?startapp=c_'+key;
  if(CFG.botUsername)return'https://t.me/'+CFG.botUsername+'?start=c_'+key;return location.origin+location.pathname+'?c='+key}

/* ---------- DEMO backend ---------- */
var LOCAL_METHODS=['evc','zaad','sahal','mpesa'];
function demoDefaults(){return{testMode:true,x_feePercent:5,appName:'Channel Pass',supportContact:'',localPrefixes:'252',plans:[],freeAllowance:0,freeMaxMB:0,paidMaxMB:0,
  methods:{stars:true,usdt_trc20:'',usdt_bep20:'',evc:'',zaad:'',sahal:'',mpesa:''}}}
var Demo={
 st:function(){var s=lsGet('gk_demo_v1',null);if(!s){s={settings:demoDefaults(),channels:[{key:'demo1',title:'Demo Trading Signals',username:'',description:'Daily signals and market notes. Members get every post the moment it is published.',status:'active',botOk:true,
   plans:[{id:'p1',label:'1 month',days:30,usd:5,stars:350},{id:'p2',label:'3 months',days:90,usd:12,stars:850}],payout:'',inviteLink:'https://t.me/+demoInvite'}],members:[],orders:[]}}return s},
 sv:function(s){lsSet('gk_demo_v1',s)},
 ch:function(s,k){return s.channels.filter(function(c){return c.key===k})[0]},
 mem:function(s,k){var now=new Date();return s.members.filter(function(m){return m.key===k&&new Date(m.expiry)>now})[0]},
 activate:function(s,k,days){var m=this.mem(s,k),base=m?new Date(m.expiry):new Date();base.setDate(base.getDate()+(+days||30));if(m)m.expiry=base.toISOString();else s.members.push({key:k,expiry:base.toISOString()})},
 rev:function(s,k){var r={usd:0,stars:0,orders:0};s.orders.forEach(function(o){if(o.status==='paid'&&o.plan.indexOf(k+'|')===0){r.orders++;if(o.currency==='XTR')r.stars+=o.amount;else r.usd+=parseFloat(String(o.amount).replace(/[^\d.]/g,''))||0}});return r},
 handle:function(a,d){var self=this,s=this.st();return new Promise(function(res){setTimeout(function(){var r;try{r=self.run(a,d,s)}catch(e){r={ok:false,error:e.message}}self.sv(s);res(r)},120)})},
 run:function(a,d,s){var self=this,st=s.settings,region=(EDITION==='local'||s.phoneVerified)?'LOCAL':'GLOBAL',ch,o,p;
  switch(a){
  case'init':var m=st.methods,ms=[];if(m.stars)ms.push({id:'stars'});if(m.usdt_trc20)ms.push({id:'usdt_trc20'});if(m.usdt_bep20)ms.push({id:'usdt_bep20'});
    if(region==='LOCAL')LOCAL_METHODS.forEach(function(k){if(m[k])ms.push({id:k,local:true})});
    return{ok:true,demo:true,isAdmin:true,verified:false,user:{id:TGU?TGU.id:0},region:region,phoneVerified:!!s.phoneVerified,methods:ms,access:{reason:st.testMode?'test':'free'}};
  case'gkMine':return{ok:true,feePercent:st.x_feePercent,channels:s.channels.map(function(c){return Object.assign({},c,{members:s.members.filter(function(x){return x.key===c.key&&new Date(x.expiry)>new Date()}).length,revenue:self.rev(s,c.key)})})};
  case'gkSave':ch=this.ch(s,d.key);if(!ch)return{ok:false};ch.description=d.description;ch.plans=d.plans.filter(function(p){return p.label&&(p.usd>0||p.stars>0)});ch.payout=d.payout;if(d.status)ch.status=d.status;return{ok:true};
  case'gkRefreshLink':return{ok:true};
  case'gkChannel':ch=this.ch(s,d.key);if(!ch)return{ok:false,error:'not_found'};var mm=this.mem(s,d.key);return{ok:true,channel:ch,member:mm?{expiry:mm.expiry}:null,inviteLink:mm?ch.inviteLink:''};
  case'gkMySubs':return{ok:true,subs:s.members.filter(function(m){return new Date(m.expiry)>new Date()}).map(function(m){var c=self.ch(s,m.key)||{};return{key:m.key,title:c.title,expiry:m.expiry,inviteLink:c.inviteLink}})};
  case'gkTestJoin':ch=this.ch(s,d.key);this.activate(s,d.key,(ch.plans[0]||{days:1}).days);return{ok:true};
  case'createOrder':var pr=String(d.plan).split('|');ch=this.ch(s,pr[0]);p=ch&&ch.plans.filter(function(x){return x.id===pr[1]})[0];if(!p)return{ok:false,error:'plan'};
    o={order_id:'D'+Date.now().toString(36),plan:d.plan,method:d.method,status:'pending',days:p.days};
    if(d.method==='stars'){o.amount=p.stars;o.currency='XTR'}else if(/^usdt/.test(d.method)){o.amount=(+p.usd+Math.floor(Math.random()*9000+1000)/1e6).toFixed(4);o.currency='USDT';o.address=st.methods[d.method];o.network=d.method==='usdt_trc20'?'TRC20 (Tron)':'BEP20 (BNB Smart Chain)'}
    else{if(!s.phoneVerified)return{ok:false,error:'phone_required'};o.amount=money(p.usd);o.currency='USD';o.number=st.methods[d.method]}
    s.orders.push(o);return Object.assign({ok:true},o);
  case'checkOrder':o=s.orders.filter(function(x){return x.order_id===d.order_id})[0];return{ok:true,status:o?o.status:'pending'};
  case'demoPay':o=s.orders.filter(function(x){return x.order_id===d.order_id})[0];if(o&&o.status!=='paid'){o.status='paid';this.activate(s,o.plan.split('|')[0],o.days)}return{ok:true,status:'paid'};
  case'submitManual':o=s.orders.filter(function(x){return x.order_id===d.order_id})[0];o.status='review';o.tx_ref=d.txid;return{ok:true,status:'review'};
  case'demoVerifyPhone':s.phoneVerified=true;return{ok:true};
  case'adminGet':return{ok:true,settings:st,secrets:{BOT_TOKEN:false,TRONGRID_KEY:false,ETHERSCAN_KEY:false}};
  case'adminSave':s.settings=Object.assign(demoDefaults(),d.settings);return{ok:true};
  case'adminSetSecret':return{ok:true};
  case'adminPending':return{ok:true,items:s.orders.filter(function(x){return x.status==='review'}).map(function(x){return Object.assign({user_id:'demo'},x)})};
  case'adminDecide':o=s.orders.filter(function(x){return x.order_id===d.order_id})[0];if(d.approve){o.status='paid';this.activate(s,o.plan.split('|')[0],o.days)}else o.status='rejected';return{ok:true};
  case'adminGk':return{ok:true,feePercent:st.x_feePercent,channels:s.channels.map(function(c){var r=self.rev(s,c.key);return{key:c.key,title:c.title,owner:'demo',payout:c.payout,members:0,revenue:r,owedUsd:Math.round(r.usd*(100-st.x_feePercent))/100,owedStars:Math.floor(r.stars*(100-st.x_feePercent)/100)}})};
  case'adminResetMe':s.members=[];s.phoneVerified=false;return{ok:true};
  }return{ok:false,error:'unknown_action'}}
};
function api(action,data){data=Object.assign({},data||{});if(DEMO)return Demo.handle(action,data);
  return fetch(CFG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',
    body:JSON.stringify(Object.assign({action:action,app:CFG.appId,edition:EDITION,initData:IN_TG?TG.initData:''},data))}).then(function(r){return r.json()}).catch(function(){return{ok:false,error:'network'}})}

/* ---------- state & nav ---------- */
var S={screen:KEY?'offer':'home',stack:[],tab:'channels',me:null,mine:null,subs:null,edit:null,offer:null,plan:null,payment:null,admin:null,err:''};
var $app=document.getElementById('app');
function go(s){S.stack.push(S.screen);S.screen=s;S.err='';render();window.scrollTo(0,0)}
function back(){S.screen=S.stack.pop()||'home';S.err='';load(S.screen)}
if(IN_TG)TG.BackButton.onClick(back);
function header(title,sub){return'<div class="top">'+(S.screen==='home'||S.screen==='offer'&&!S.stack.length||IN_TG?'<div class="logo">'+ic('channel')+'</div>':'<button class="ibtn" data-act="back">'+ic('back')+'</button>')+
  '<div class="grow"><h1>'+esc(title)+'</h1>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div><div class="lang"><button data-lang="so" class="'+(LANG==='so'?'on':'')+'">SO</button><button data-lang="en" class="'+(LANG==='en'?'on':'')+'">EN</button></div>'+
  (S.me&&S.me.isAdmin?'<button class="ibtn" data-act="settings">'+ic('settings')+'</button>':'')+'</div>'}
function banners(){var h='';if(DEMO)h+='<div class="banner">'+ic('info','s')+'<span>'+t('demo_banner')+'</span></div>';
  if(S.me&&S.me.access&&S.me.access.reason==='test')h+='<div class="banner">'+ic('shield','s')+'<span>'+t('test_banner')+'</span></div>';return h}
function spin(){return'<div class="card center"><div class="spin" style="margin:0 auto;color:var(--accent)"></div></div>'}
function errBox(){return S.err?'<div class="err">'+ic('alert','s')+'<span>'+esc(S.err)+'</span></div>':''}
function load(screen){render();
  if(screen==='home'){if(S.tab==='channels')api('gkMine').then(function(r){S.mine=r.ok?r:{channels:[],feePercent:0};render()});else api('gkMySubs').then(function(r){S.subs=r.ok?r.subs:[];render()})}
  if(screen==='offer'){api('gkChannel',{key:KEY}).then(function(r){S.offer=r;if(r.ok&&r.channel.plans[0]&&!S.plan)S.plan=r.channel.plans[0].id;render()})}
  if(screen==='settings')loadAdmin();}

/* ---------- render ---------- */
function render(){if(IN_TG){if(S.stack.length)TG.BackButton.show();else TG.BackButton.hide()}
  if(!S.me){$app.innerHTML=spin();return}var h='';
  switch(S.screen){case'home':h=rHome();break;case'how':h=rHow();break;case'edit':h=rEdit();break;case'offer':h=rOffer();break;case'pay':h=rPay();break;case'settings':h=rSettings();break}
  $app.innerHTML=h}
function statusChip(c){if(!c.botOk)return'<span class="chip warn">'+ic('alert','s')+t('notready')+'</span>';return c.status==='active'?'<span class="chip good">'+ic('check','s')+t('active')+'</span>':'<span class="chip">'+t('paused')+'</span>'}
function rHome(){var h=header(t('appName'),t('tagline'))+banners()+'<div class="tabs"><button data-tab="channels" class="'+(S.tab==='channels'?'on':'')+'">'+t('t_channels')+'</button><button data-tab="subs" class="'+(S.tab==='subs'?'on':'')+'">'+t('t_subs')+'</button></div>';
  if(S.tab==='channels'){if(!S.mine)return h+spin();
    if(!S.mine.channels.length)h+='<div class="card center"><div class="big">'+ic('channel','l')+'</div><p class="m">'+t('none_ch')+'</p></div>';
    S.mine.channels.forEach(function(c){h+='<button class="chrow" data-edit="'+esc(c.key)+'"><div class="av">'+esc((c.title||'?').charAt(0).toUpperCase())+'</div><div class="grow"><div class="fn">'+esc(c.title)+'</div><div class="fs">'+t('members',{n:c.members||0})+' · '+money(c.revenue.usd)+(c.revenue.stars?' + '+c.revenue.stars+' Stars':'')+'</div></div>'+statusChip(c)+'</button>'});
    h+='<button class="btn" data-act="how">'+ic('plus')+t('add')+'</button><button class="btn ghost" data-act="reload">'+ic('refresh')+t('refresh')+'</button>'}
  else{if(!S.subs)return h+spin();if(!S.subs.length)h+='<div class="card center"><div class="big">'+ic('users','l')+'</div><p class="m">'+t('none_sub')+'</p></div>';
    S.subs.forEach(function(s){h+='<div class="chrow"><div class="av">'+esc((s.title||'?').charAt(0))+'</div><div class="grow"><div class="fn">'+esc(s.title)+'</div><div class="fs">'+t('until',{d:fmtDate(s.expiry)})+'</div></div><button class="btn sm" data-open="'+esc(s.inviteLink)+'">'+ic('ext','s')+t('join')+'</button><button class="btn sm sec2" data-offer="'+esc(s.key)+'">'+t('renew')+'</button></div>'})}
  return h}
function rHow(){var bot=CFG.botUsername||'YourBot';return header(t('how_title'),'')+'<div class="card"><ol class="steps"><li>'+t('s1')+'</li><li>'+t('s2',{bot:esc(bot)})+'</li><li>'+t('s3')+'</li><li>'+t('s4')+'</li></ol></div>'+
  (CFG.botUsername?'<button class="btn sec2" data-open="https://t.me/'+esc(CFG.botUsername)+'?startchannel&admin=invite_users+restrict_members">'+ic('ext')+'@'+esc(CFG.botUsername)+'</button>':'')+'<button class="btn" data-act="back">'+ic('refresh')+t('refresh')+'</button>'}
function rEdit(){var c=S.edit,fee=S.mine?S.mine.feePercent:0,r=c.revenue||{usd:0,stars:0,orders:0},url=shareUrl(c.key),h=header(c.title,t('edit'));
  h+='<div class="sec">'+t('share')+'</div><div class="card"><div class="kv"><code>'+esc(url)+'</code><button class="mini" data-copy="'+esc(url)+'">'+ic('copy')+'</button></div><p class="m">'+t('share_sub')+'</p>'+
    (c.botOk?'':'<div class="err">'+ic('alert','s')+'<span>'+t('s3')+'</span></div>')+'</div>';
  h+='<div class="card"><div class="sw"><div><b style="font-size:14px">'+t('publish')+'</b><div class="fs">'+t('publish_sub')+'</div></div><button class="tgl '+(c.status==='active'?'on':'')+'" data-act="togglepub"></button></div>'+
    '<label class="f">'+t('desc')+'</label><textarea class="t" id="desc" maxlength="500">'+esc(c.description)+'</textarea></div>';
  h+='<div class="sec">'+t('plans')+'</div>'+c.plans.map(function(p,i){return'<div class="plan"><div class="full"><label class="f">'+t('plan_label')+'</label><input class="t" data-pi="'+i+'" data-k="label" value="'+esc(p.label)+'" placeholder="1 month"></div>'+
    '<div><label class="f">'+t('days')+'</label><input class="t" type="number" data-pi="'+i+'" data-k="days" value="'+esc(p.days)+'"></div><div><label class="f">'+t('usd')+'</label><input class="t" type="number" step="0.01" data-pi="'+i+'" data-k="usd" value="'+esc(p.usd)+'"></div>'+
    '<div><label class="f">'+t('stars')+'</label><input class="t" type="number" data-pi="'+i+'" data-k="stars" value="'+esc(p.stars)+'"></div><div style="display:flex;align-items:flex-end"><button class="btn sm ghost" style="width:100%" data-prm="'+i+'">'+t('remove')+'</button></div></div>'}).join('')+
    (c.plans.length<6?'<button class="btn sm sec2" data-act="addplan">'+ic('plus','s')+t('add_plan')+'</button>':'');
  h+='<div class="card" style="margin-top:12px"><label class="f">'+t('payout')+'</label><input class="t" id="payout" value="'+esc(c.payout)+'"></div>';
  h+='<button class="btn" data-act="savech">'+ic('check')+t('save')+'</button>'+(S.msg?'<div class="okmsg">'+ic('check','s')+esc(S.msg)+'</div>':'')+errBox();
  h+='<div class="sec">'+t('earn')+'</div><div class="card stat"><div><b>'+money(r.usd)+'</b><span>'+t('gross')+' (USD)</span></div><div><b>'+(r.stars||0)+'</b><span>'+t('gross')+' (Stars)</span></div>'+
    '<div><b>'+fee+'%</b><span>'+t('fee')+'</span></div><div><b>'+money(r.usd*(100-fee)/100)+'</b><span>'+t('net')+'</span></div><div><b>'+(r.orders||0)+'</b><span>'+t('orders')+'</span></div><div><b>'+(c.members||0)+'</b><span>'+t('members',{n:''}).trim()+'</span></div></div>';
  h+='<button class="btn ghost" data-act="newlink">'+ic('link')+t('new_link')+'</button>';return h}
function rOffer(){var o=S.offer,h;if(!o)return header(t('appName'),'')+spin();
  if(!o.ok)return header(t('appName'),'')+'<div class="card center"><div class="big">'+ic('alert','l')+'</div><p class="m">'+t('not_found')+'</p></div>';
  var c=o.channel,me=S.me;h=header(c.title,c.username?'@'+c.username:'')+banners();
  h+='<div class="card"><div class="row" style="gap:12px"><div class="av">'+esc(c.title.charAt(0).toUpperCase())+'</div><div class="grow"><h2>'+esc(c.title)+'</h2></div></div>'+(c.description?'<p class="m" style="margin-top:10px;white-space:pre-line">'+esc(c.description)+'</p>':'')+'</div>';
  if(o.member)h+='<div class="card"><div class="okmsg" style="margin:0">'+ic('check','s')+t('active_until',{d:fmtDate(o.member.expiry)})+'</div></div><button class="btn" data-open="'+esc(o.inviteLink)+'">'+ic('ext')+t('join')+'</button><div class="sec">'+t('renew')+'</div>';
  if(c.status!=='active')return h+'<div class="card"><p class="m">'+t('not_found')+'</p></div>';
  h+=(o.member?'':'<div class="sec">'+t('choose')+'</div>')+'<div class="opt">'+c.plans.map(function(p){return'<div class="radio '+(S.plan===p.id?'on':'')+'" data-plan="'+esc(p.id)+'"><span class="dot"></span><div><b>'+esc(p.label)+'</b><div class="fs">'+t('d_days',{n:p.days})+'</div></div><div class="price">'+(p.usd?money(p.usd):'')+(p.stars?'<small>'+p.stars+' Stars</small>':'')+'</div></div>'}).join('')+'</div>';
  h+='<div class="sec">'+t('pay_with')+'</div>';
  if(!me.methods.length)h+='<div class="card"><p class="m">'+t('no_methods')+'</p></div>';
  else h+='<div class="opt">'+me.methods.map(function(m){return'<button class="radio" style="width:100%;text-align:left" data-method="'+m.id+'"><span class="thumb" style="width:34px;height:34px">'+ic(m.id==='stars'?'star':/^usdt/.test(m.id)?'wallet':'phone')+'</span><b class="grow">'+t(m.id==='stars'?'stars_m':m.id)+'</b></button>'}).join('')+'</div>';
  if(me.access&&me.access.reason==='test')h+='<button class="btn ghost" style="margin-top:12px" data-act="testjoin">'+ic('shield')+t('test_join')+'</button>';
  return h+errBox()}
function rPay(){var o=S.payment,h=header(t(o.method==='stars'?'stars_m':o.method),'');
  if(o.status==='paid')return h+'<div class="card center"><div class="big good">'+ic('check','l')+'</div><h2>'+t('paid_ok')+'</h2></div><button class="btn" data-act="tooffer">'+ic('ext')+t('join')+'</button>';
  if(o.status==='review')return h+'<div class="card center"><div class="big">'+ic('clock','l')+'</div><p class="m">'+t('pending')+'</p></div>';
  if(o.phoneNeeded)return h+'<div class="card center"><div class="big">'+ic('phone','l')+'</div><p class="m">'+t('verify_text')+'</p></div><button class="btn" data-act="verifyphone">'+ic('phone')+t('verify_phone')+'</button>';
  if(/^usdt/.test(o.method))h+='<div class="card"><p class="m" style="margin-bottom:12px">'+t('send_exact')+'</p><div class="kv"><div class="grow"><span class="k">'+t('amount')+'</span><code>'+esc(o.amount)+' USDT</code></div><button class="mini" data-copy="'+esc(o.amount)+'">'+ic('copy')+'</button></div>'+
    '<div class="kv"><div class="grow"><span class="k">'+t('network')+'</span><code>'+esc(o.network)+'</code></div></div><div class="kv"><div class="grow"><span class="k">'+t('address')+'</span><code>'+esc(o.address)+'</code></div><button class="mini" data-copy="'+esc(o.address)+'">'+ic('copy')+'</button></div>'+
    '<div class="note">'+ic('alert','s')+'<span>'+t('usdt_note',{net:esc(o.network)})+'</span></div></div><button class="btn" data-act="checkpay">'+ic('refresh')+t('check_pay')+'</button>';
  else h+='<div class="card"><p class="m" style="margin-bottom:12px">'+t('mm_text',{a:esc(o.amount),n:esc(o.number),m:t(o.method)})+'</p><div class="kv"><div class="grow"><span class="k">'+t(o.method)+'</span><code>'+esc(o.number)+'</code></div><button class="mini" data-copy="'+esc(o.number)+'">'+ic('copy')+'</button></div>'+
    '<label class="f">'+t('txid')+'</label><input class="t" id="txid" autocomplete="off"></div><button class="btn" data-act="submittx">'+t('submit')+'</button>';
  return h+errBox()}

/* ---------- admin ---------- */
var SECRETS={BOT_TOKEN:'Telegram bot token',TRONGRID_KEY:'TronGrid API key (TRC20 checks)',ETHERSCAN_KEY:'Etherscan API key (BEP20 checks)'};
function loadAdmin(){S.admin=null;render();Promise.all([api('adminGet'),api('adminPending'),api('adminGk')]).then(function(r){
  S.admin={settings:r[0].settings||demoDefaults(),secrets:r[0].secrets||{},pending:r[1].items||[],gk:r[2].ok?r[2]:{channels:[]}};render()})}
function rSettings(){var A=S.admin,h=header('Settings','Admin only');if(!A)return h+spin();var st=A.settings,m=st.methods;
  function inp(id,v,ph,ty){return'<input class="t" data-set="'+id+'" type="'+(ty||'text')+'" value="'+esc(v)+'" placeholder="'+esc(ph||'')+'">'}
  function sw(id,on,l,s){return'<div class="sw"><div><b style="font-size:14px">'+l+'</b>'+(s?'<div class="fs">'+s+'</div>':'')+'</div><button class="tgl '+(on?'on':'')+'" data-toggle="'+id+'"></button></div>'}
  if(DEMO)h+='<div class="banner">'+ic('info','s')+'<span>Demo mode: set <b>apiUrl</b> in config.js to connect the server.</span></div>';
  h+='<div class="sec">General</div><div class="card">'+sw('testMode',st.testMode,'Test mode','Shows a “get access without paying” button so you can test the full flow.')+
    '<label class="f">Platform fee (%)</label>'+inp('x_feePercent',st.x_feePercent,'5','number')+'<label class="f">Support contact</label>'+inp('supportContact',st.supportContact,'@username')+
    '<label class="f">Local phone prefixes</label>'+inp('localPrefixes',st.localPrefixes,'252')+'</div>';
  h+='<div class="sec">Payment methods</div><div class="card">'+sw('m_stars',m.stars,'Telegram Stars','Global. Verify fees and payout terms before launch.')+
    '<label class="f">USDT TRC20 receive address</label>'+inp('m_usdt_trc20',m.usdt_trc20,'T…')+'<label class="f">USDT BEP20 receive address</label>'+inp('m_usdt_bep20',m.usdt_bep20,'0x…')+
    '<div class="fs" style="margin-top:12px">Local only (hidden from global users):</div><label class="f">EVC Plus</label>'+inp('m_evc',m.evc,'+252…')+'<label class="f">Zaad</label>'+inp('m_zaad',m.zaad,'+252…')+
    '<label class="f">Sahal</label>'+inp('m_sahal',m.sahal,'+252…')+'<label class="f">M-Pesa</label>'+inp('m_mpesa',m.mpesa,'+254…')+'</div><button class="btn" data-act="savesettings">'+ic('check')+'Save settings</button>'+(S.msg?'<div class="okmsg">'+ic('check','s')+esc(S.msg)+'</div>':'');
  h+='<div class="sec">Secrets (write-only)</div><div class="card">'+Object.keys(SECRETS).map(function(k){return'<label class="f">'+SECRETS[k]+' — <span style="color:'+(A.secrets[k]?'var(--ok)':'var(--danger)')+'">'+(A.secrets[k]?'set':'not set')+'</span></label><div class="row"><input class="t" type="password" autocomplete="off" id="sec_'+k+'" placeholder="Paste new value"><button class="btn sm sec2" data-secret="'+k+'">Save</button></div>'}).join('')+'</div>';
  h+='<div class="sec">Payments to review</div><div class="card">'+(A.pending.length?'<ul class="files">'+A.pending.map(function(p){return'<li><div class="grow"><div class="fn">'+esc(p.method)+' · '+esc(p.amount)+'</div><div class="fs">User '+esc(p.user_id)+' · Tx '+esc(p.tx_ref)+'</div></div><button class="btn sm" data-approve="'+esc(p.order_id)+'">Approve</button><button class="btn sm ghost" data-reject="'+esc(p.order_id)+'">Reject</button></li>'}).join('')+'</ul>':'<p class="m">Nothing to review.</p>')+'</div>';
  h+='<div class="sec">Creators &amp; payouts owed</div><div class="card">'+(A.gk.channels.length?'<ul class="files">'+A.gk.channels.map(function(c){return'<li><div class="grow"><div class="fn">'+esc(c.title)+'</div><div class="fs">Owner '+esc(c.owner)+' · '+c.members+' members · pay to: '+esc(c.payout||'—')+'</div></div><div class="price">'+money(c.owedUsd)+'<small>'+c.owedStars+' Stars</small></div></li>'}).join('')+'</ul>':'<p class="m">No channels yet.</p>')+'</div>';
  h+='<div class="sec">Testing</div><div class="card"><button class="btn sm ghost" style="width:100%" data-act="resetme">Reset my memberships</button></div>';return h}
function collectSettings(){var st=JSON.parse(JSON.stringify(S.admin.settings));document.querySelectorAll('[data-set]').forEach(function(el){var k=el.dataset.set,v=el.type==='number'?+el.value:el.value.trim();if(k.indexOf('m_')===0)st.methods[k.slice(2)]=v;else st[k]=v});return st}
function collectEdit(){var c=S.edit;var d=document.getElementById('desc');if(d)c.description=d.value;var p=document.getElementById('payout');if(p)c.payout=p.value;
  document.querySelectorAll('[data-pi]').forEach(function(el){c.plans[+el.dataset.pi][el.dataset.k]=el.type==='number'?+el.value:el.value.trim()})}

/* ---------- payments ---------- */
function startPayment(method){var plan=KEY+'|'+S.plan;S.err='';
  if(method==='stars'&&!DEMO&&!IN_TG){S.err=t('open_in_tg');return render()}
  api('createOrder',{plan:plan,method:method}).then(function(r){
    if(!r.ok){if(r.error==='phone_required'){S.payment={method:method,phoneNeeded:true};return go('pay')}S.err=r.error==='network'?t('e_net'):t('e_gen');return render()}
    S.payment=r;
    if(method==='stars'){if(DEMO){if(confirm(t('pay_demo')))api('demoPay',{order_id:r.order_id}).then(paid);return}
      TG.openInvoice(r.invoiceLink,function(s){if(s==='paid')poll(r.order_id,10)});return}
    go('pay')})}
function poll(id,n){api('checkOrder',{order_id:id}).then(function(r){if(r.ok&&r.status==='paid')return paid();if(n>0)setTimeout(function(){poll(id,n-1)},2000)})}
function paid(){S.payment=Object.assign(S.payment||{},{status:'paid'});try{TG.HapticFeedback.notificationOccurred('success')}catch(e){}if(S.screen!=='pay')go('pay');else render()}

document.addEventListener('click',function(ev){var el=ev.target.closest('[data-act],[data-lang],[data-tab],[data-edit],[data-copy],[data-open],[data-offer],[data-plan],[data-method],[data-prm],[data-toggle],[data-secret],[data-approve],[data-reject]');if(!el)return;var d=el.dataset;
  if(d.lang){LANG=d.lang;lsSet('gk_lang',LANG);return render()}
  if(d.tab){S.tab=d.tab;return load('home')}
  if(d.edit){S.edit=JSON.parse(JSON.stringify(S.mine.channels.filter(function(c){return c.key===d.edit})[0]));S.msg='';return go('edit')}
  if(d.copy)return copy(d.copy);
  if(d.open!=null)return openLink(d.open);
  if(d.offer){KEY=d.offer;S.offer=null;S.plan=null;go('offer');return load('offer')}
  if(d.plan){S.plan=d.plan;return render()}
  if(d.method)return startPayment(d.method);
  if(d.prm!=null){collectEdit();S.edit.plans.splice(+d.prm,1);return render()}
  if(d.toggle){S.admin.settings=collectSettings();if(d.toggle==='testMode')S.admin.settings.testMode=!S.admin.settings.testMode;else S.admin.settings.methods.stars=!S.admin.settings.methods.stars;return render()}
  if(d.secret){var i=document.getElementById('sec_'+d.secret);if(!i.value.trim())return;api('adminSetSecret',{key:d.secret,value:i.value.trim()}).then(function(r){i.value='';toast(r.ok?'Saved':(r.error||'Error'));if(r.ok){S.admin.secrets[d.secret]=true;render()}});return}
  if(d.approve||d.reject){api('adminDecide',{order_id:d.approve||d.reject,approve:!!d.approve}).then(function(){loadAdmin()});return}
  switch(d.act){
  case'back':return back();
  case'how':return go('how');
  case'reload':S.mine=null;return load('home');
  case'settings':S.msg='';go('settings');return loadAdmin();
  case'togglepub':collectEdit();S.edit.status=S.edit.status==='active'?'paused':'active';return render();
  case'addplan':collectEdit();S.edit.plans.push({id:'p'+Date.now().toString(36).slice(-4),label:'',days:30,usd:1,stars:75});return render();
  case'savech':collectEdit();var c=S.edit;api('gkSave',{key:c.key,description:c.description,plans:c.plans,payout:c.payout,status:c.status}).then(function(r){if(r.ok){S.msg=t('saved');S.err='';S.mine=null;api('gkMine').then(function(x){S.mine=x;render()})}else{S.err=t('e_gen');render()}});return;
  case'newlink':api('gkRefreshLink',{key:S.edit.key}).then(function(r){toast(r.ok?t('saved'):t('e_gen'))});return;
  case'testjoin':api('gkTestJoin',{key:KEY}).then(function(){S.offer=null;load('offer')});return;
  case'tooffer':S.stack=[];S.screen='offer';S.offer=null;return load('offer');
  case'savesettings':var st=collectSettings();api('adminSave',{settings:st}).then(function(r){if(r.ok){S.admin.settings=st;S.msg='Saved';init()}else toast(r.error||'Error')});return;
  case'resetme':api('adminResetMe').then(function(){toast('Reset')});return;
  case'checkpay':api('checkOrder',{order_id:S.payment.order_id}).then(function(r){if(r.ok&&r.status==='paid')return paid();if(DEMO&&confirm(t('pay_demo')))return api('demoPay',{order_id:S.payment.order_id}).then(paid);S.err=t('not_yet');render()});return;
  case'submittx':var tx=document.getElementById('txid').value.trim();if(tx.length<4)return;api('submitManual',{order_id:S.payment.order_id,txid:tx}).then(function(r){if(r.ok)S.payment.status='review';else S.err=t('e_gen');render()});return;
  case'verifyphone':var after=function(){init().then(function(){S.stack=[];S.screen='offer';render()})};
    if(DEMO){api('demoVerifyPhone').then(after);return}if(IN_TG&&TG.requestContact)TG.requestContact(function(ok){if(ok)setTimeout(after,1500)});return;
  }});

function init(){return api('init',{start:START}).then(function(r){S.me=r.ok?r:{methods:[],access:{}};return r})}
if(IN_TG){try{TG.ready();TG.expand();if(TG.isVersionAtLeast('7.7'))TG.disableVerticalSwipes()}catch(e){}}
render();init().then(function(){load(S.screen)});
})();
</script>
</body>
