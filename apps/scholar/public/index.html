<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Scholarship Finder</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#f2f4f7);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#ffffff));
  --text:var(--tg-theme-text-color,#101828);
  --hint:var(--tg-theme-hint-color,#667085);
  --accent:var(--tg-theme-button-color,#2457d6);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
  --link:var(--tg-theme-link-color,#2457d6);
  --sep:var(--tg-theme-section-separator-color,rgba(128,128,128,.2));
  --danger:var(--tg-theme-destructive-text-color,#d92d20);
  --ok:#12b76a;
  --soft:color-mix(in srgb,var(--accent) 10%,transparent);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:var(--tg-theme-secondary-bg-color,#0e1116);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#171b22));
  --text:var(--tg-theme-text-color,#e6e9ef);
  --hint:var(--tg-theme-hint-color,#8b93a1);
  --accent:var(--tg-theme-button-color,#4c7cf0);
  --link:var(--tg-theme-link-color,#6f97f5);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;flex:none}
.top h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--hint)}
.grow{flex:1;min-width:0}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--sep);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.lang{display:flex;border:1px solid var(--sep);border-radius:10px;overflow:hidden;background:var(--card);flex:none}
.lang button{border:0;background:none;padding:7px 10px;font-size:12px;font-weight:650;color:var(--hint);cursor:pointer}
.lang button.on{background:var(--accent);color:var(--accent-text)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}svg.i.l{width:26px;height:26px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--accent);border:0;cursor:pointer}
.chip.warn{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.chip.good{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 12px;border:1px solid var(--sep)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tool{background:var(--card);border:1px solid var(--sep);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:128px}
.tool:active{transform:scale(.985)}
.tool .ic{width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.tool b{font-size:14.5px;font-weight:650}
.tool span{font-size:12.5px;color:var(--hint);line-height:1.35}
.tool.dis{opacity:.55;cursor:default}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);border:1px solid var(--sep);border-radius:6px;padding:2px 6px;align-self:flex-start}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--hint);margin:18px 4px 8px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--hint);padding:4px 4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:13px 16px;font-weight:650;background:var(--accent);color:var(--accent-text);cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec2{background:var(--soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--sep)}
.btn.sm{padding:9px 12px;font-size:13.5px;width:auto}
.btn+.btn{margin-top:8px}
.row{display:flex;gap:8px;align-items:center}
.drop{border:1.5px dashed var(--sep);border-radius:var(--r);padding:26px 16px;text-align:center;cursor:pointer;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.drop .ic{width:48px;height:48px;border-radius:14px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.drop small{color:var(--hint)}
.files{list-style:none;margin:0;padding:0}
.files li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep)}
.files li:last-child{border-bottom:0}
.thumb{width:40px;height:40px;border-radius:8px;background:var(--soft);color:var(--accent);display:grid;place-items:center;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.fn{font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs{font-size:12px;color:var(--hint)}
.mini{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--hint);display:grid;place-items:center;cursor:pointer;flex:none}
.mini:disabled{opacity:.3}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--hint);margin:12px 0 6px}
label.f:first-child{margin-top:0}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--hint);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--sep);background:var(--bg);border-radius:10px;padding:10px 12px;outline:none}
input.t:focus,select.t:focus{border-color:var(--accent)}
.opt{display:flex;flex-direction:column;gap:6px}
.radio{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--sep);border-radius:12px;cursor:pointer;background:var(--card)}
.radio.on{border-color:var(--accent);background:var(--soft)}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--hint);flex:none;display:grid;place-items:center}
.radio.on .dot{border-color:var(--accent)}
.radio.on .dot:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.bar{height:6px;border-radius:6px;background:var(--bg);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.err{color:var(--danger);font-size:13px;display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.okmsg{color:var(--ok);font-size:13px;display:flex;gap:8px;align-items:center;margin-top:10px}
.center{text-align:center}
.big{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:4px auto 10px;background:var(--soft);color:var(--accent)}
.big.good{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
h2{font-size:17px;margin:0 0 4px;font-weight:650}
p.m{margin:0;color:var(--hint);font-size:13.5px}
.feat{list-style:none;padding:0;margin:12px 0 0}
.feat li{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.feat svg{color:var(--ok)}
.price{font-weight:700;margin-left:auto;text-align:right;font-size:14px}
.price small{display:block;font-weight:500;color:var(--hint);font-size:11.5px}
.kv{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--sep);border-radius:10px;background:var(--bg);margin-bottom:8px}
.kv code{font:600 13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;flex:1}
.kv .k{font-size:11.5px;color:var(--hint);display:block;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:9;max-width:90%;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.banner{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--text);margin-bottom:12px}
.banner svg{color:var(--accent);margin-top:1px}
table.pl{width:100%;border-collapse:collapse;font-size:13px}
.plan{border:1px solid var(--sep);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.plan .full{grid-column:1/-1}
.plan input,.plan select{padding:8px 10px;font-size:13px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.tgl{width:44px;height:26px;border-radius:13px;background:var(--sep);border:0;position:relative;cursor:pointer;flex:none}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl.on{background:var(--accent)}.tgl.on:after{left:21px}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat div{background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-size:18px}
.stat span{font-size:11.5px;color:var(--hint)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.foot{text-align:center;color:var(--hint);font-size:11.5px;margin-top:18px}
</style>
<style>
textarea.t{min-height:84px;resize:vertical;font:inherit;width:100%}
.chrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--sep);border-radius:var(--r);background:var(--card);margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
.av{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--sep);background:var(--card);border-radius:10px;padding:9px 6px;font-weight:600;font-size:13px;color:var(--hint);cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
ol.steps{margin:0;padding-left:20px}ol.steps li{margin:6px 0;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--hint);margin:2px 4px 2px 0}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.pill.bad{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}.pill.ac{background:var(--soft);color:var(--accent)}
.num{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--sep);background:var(--card);font-size:18px;cursor:pointer}
.stepper b{min-width:28px;text-align:center;font-size:18px}
.score{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;margin:4px auto 8px;font-size:26px;font-weight:700;border:6px solid var(--accent);color:var(--accent)}
.meter{height:8px;border-radius:8px;background:var(--bg);overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--accent)}
.photo{width:100%;border-radius:12px;display:block;max-height:320px;object-fit:cover;background:var(--bg)}
.rec{width:84px;height:84px;border-radius:50%;border:0;background:var(--danger);color:#fff;display:grid;place-items:center;margin:8px auto;cursor:pointer}
.rec.on{animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--danger) 25%,transparent)}}
.inv{border-radius:18px;padding:26px 20px;text-align:center;border:1px solid var(--sep);background:var(--card);margin-bottom:12px}
.inv .eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--hint)}
.inv h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:26px;margin:10px 0 6px;line-height:1.2}
.inv .line{width:48px;height:1px;background:var(--accent);margin:14px auto}
.qrbox{background:#fff;border-radius:14px;padding:14px;display:inline-block}
.qrbox svg,.qrbox img{display:block;width:200px;height:200px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}table.tb td{padding:8px 4px;border-bottom:1px solid var(--sep);vertical-align:top}table.tb td:first-child{color:var(--hint);width:38%}
</style>

<style>.locked{filter:blur(3px);pointer-events:none;user-select:none}.lockwrap{position:relative}.lockwrap .over{position:absolute;inset:0;display:grid;place-items:center}</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>

  <symbol id="i-merge" viewBox="0 0 24 24"><path d="M7 4v4a5 5 0 0 0 5 5 5 5 0 0 0 5-5V4"/><path d="M12 13v7"/><path d="M9 17l3 3 3-3"/></symbol>

  <symbol id="i-pdfimg" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><circle cx="10" cy="12" r="1.3"/><path d="M8 18l3.5-3.5 2 2L15 15l1.5 3"/></symbol>
  <symbol id="i-word" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8 12l1.3 5 1.7-4 1.7 4 1.3-5"/></symbol>
  <symbol id="i-compress" viewBox="0 0 24 24"><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>

 adminExtra:function(){return'<div class="sec">Scholarships</div><div class="card"><button class="btn sm sec2" style="width:100%" data-a="manage">'+ic('list','s')+t('manage')+'</button></div>'},
 enter:{
  home:function(){api('scHome').then(function(r){if(r.ok){F.profile=r.profile;F.list=r.matches;F.locked=r.locked;F.savedIds=r.saved||[]}else{F.list=[]}K.render()})},

 },
 screens:{
  home:function(){var h=K.header(t('appName'),t('tagline'))+'<div class="row" style="margin:-4px 0 12px">'+(/^(sub|test)$/.test(S.me.access.reason)?K.planChip():'<button class="chip" data-act="paywall">'+ic('lock','s')+t('unlock')+'</button>')+'<button class="chip" data-a="profile">'+ic('user','s')+t('profile')+'</button></div>'+K.banners();
   if(!F.list)return h+K.spin();
   if(!F.profile)return h+K.empty('award',t('setup'),'<button class="btn" style="margin-top:12px" data-a="profile">'+t('start')+'</button>');
   if(K.DEMO)h+='<div class="note" style="margin-bottom:8px">'+ic('info','s')+'<span>'+t('sample')+'</span></div>';
   h+='<div class="tabs"><button data-a="filter" data-v="all" class="'+(F.filter==='all'?'on':'')+'">'+t('f_all')+'</button><button data-a="filter" data-v="full" class="'+(F.filter==='full'?'on':'')+'">'+t('f_full')+'</button><button data-a="filter" data-v="soon" class="'+(F.filter==='soon'?'on':'')+'">'+t('f_soon')+'</button><button data-a="filter" data-v="saved" class="'+(F.filter==='saved'?'on':'')+'">'+t('saved')+'</button></div>';
   var list=F.list.filter(function(s){return F.filter==='all'||F.filter==='full'&&s.funding==='full'||F.filter==='soon'&&daysLeft(s.deadline)<=30||F.filter==='saved'&&F.savedIds.indexOf(s.id)>=0});
   if(!list.length&&!F.locked)h+=K.empty('search',F.filter==='saved'?t('none_saved'):t('no_matches'));
   list.forEach(function(s){h+=card(s)});
   if(list.length)h+='<button class="btn sec2" style="margin-top:4px" data-a="slpdf">'+ic('file')+t('shortlist')+(K.isPro()?'':' · Pro')+'</button>';
   if(F.locked&&F.filter!=='saved')h+='<div class="lockwrap"><div class="locked">'+card({id:'x',name:'██████████ Scholarship',provider:'█████',host:'████',funding:'full',deadline:new Date(Date.now()+40*864e5).toISOString().slice(0,10),score:80,levels:[],fields:[]})+'</div><div class="over"><button class="btn sm" data-act="paywall">'+ic('lock','s')+t('more_locked',{n:F.locked})+' · '+t('unlock')+'</button></div></div>';
   return h},
  profile:function(){var p=F.form,h=K.header(t('profile'),'');
   function sel(id,opts,val){return'<select class="t" id="'+id+'">'+opts.map(function(o){return'<option value="'+esc(o[0])+'" '+(String(val)===String(o[0])?'selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>'}
   h+='<div class="card"><label class="f">'+t('country')+'</label>'+sel('pcountry',COUNTRIES.map(function(c){return[c[0],c[1]]}),p.country)+'<label class="f">'+t('level')+'</label>'+K.seg('level',p.level,LEVELS.map(function(l){return[l,t(l)]}))+
    '<label class="f">'+t('field')+'</label>'+sel('pfield',FIELDS.map(function(f){return[f,t('f_'+f)]}),p.field)+'<label class="f">'+t('english')+'</label>'+K.seg('english',p.english,[['none',t('e_none')],['ielts',t('e_ielts')],['duolingo',t('e_duo')]])+
    '<label class="f">'+t('need')+'</label>'+K.seg('need',p.need,[['full',t('full')],['partial',t('partial')],['any',t('any')]])+'<label class="f">'+t('gpa')+'</label><input class="t" id="pgpa" value="'+esc(p.gpa||'')+'" placeholder="3.2 / 4.0">'+
    '<div class="sw" style="margin-top:10px"><div><b style="font-size:14px">'+t('alerts')+'</b><div class="fs">'+t('alerts_sub')+'</div></div><button class="tgl '+(p.alerts?'on':'')+'" data-a="alerts"></button></div></div>';
   return h+'<button class="btn" data-a="saveprofile">'+ic('search')+t('save_profile')+'</button>'+K.errBox()},
  detail:function(){var s=F.detail,saved=F.savedIds.indexOf(s.id)>=0,dl=daysLeft(s.deadline),h=K.header(s.name,s.provider);
   h+='<div class="card"><div class="row"><span class="pill ac">'+t('match',{n:s.score})+'</span><span class="pill '+(dl<=14?'bad':'')+'">'+(dl===0?t('closes_today'):t('days_left',{n:dl}))+'</span></div>'+(s.summary?'<p class="m" style="margin-top:10px">'+esc(s.summary)+'</p>':'')+
    '<table class="tb" style="margin-top:10px"><tr><td>'+t('host')+'</td><td>'+esc(s.host)+'</td></tr><tr><td>'+t('funding')+'</td><td>'+t(s.funding)+'</td></tr><tr><td>'+t('levels')+'</td><td>'+s.levels.map(t).join(', ')+'</td></tr><tr><td>'+t('deadline')+'</td><td>'+esc(s.deadline)+'</td></tr>'+(s.lang_req?'<tr><td>'+t('lang_req')+'</td><td>'+esc(s.lang_req)+'</td></tr>':'')+'</table>'+
    (K.DEMO?'<div class="note" style="margin-top:8px">'+ic('info','s')+'<span>'+t('sample')+'</span></div>':'')+'</div>';
   return h+'<button class="btn" data-open="'+esc(s.url)+'">'+ic('ext')+t('apply')+'</button><button class="btn '+(saved?'sec2':'ghost')+'" data-a="save" data-id="'+esc(s.id)+'">'+ic(saved?'check':'star')+(saved?t('unsave'):t('save_s'))+'</button>'},
  schadmin:function(){var h=K.header(t('manage'),'Admin');if(!F.adm)return h+K.spin();
   h+='<button class="btn" data-a="schnew">'+ic('plus')+'Add scholarship</button><div style="height:10px"></div>';
   F.adm.forEach(function(s){h+='<button class="chrow" data-a="schedit" data-id="'+esc(s.id)+'"><div class="grow"><div class="fn">'+esc(s.name)+'</div><div class="fs">'+esc(s.host)+' · '+esc(s.deadline)+' · '+esc(s.status||'active')+'</div></div>'+ic('edit')+'</button>'});return h},
  schform:function(){var s=F.admForm,h=K.header(s.id?'Edit scholarship':'Add scholarship','Admin');
   function f(k,l,ph,ty){return'<label class="f">'+l+'</label><input class="t" data-sf="'+k+'" type="'+(ty||'text')+'" value="'+esc(Array.isArray(s[k])?s[k].join(', '):s[k]||'')+'" placeholder="'+esc(ph||'')+'">'}
   h+='<div class="card">'+f('name','Name')+f('provider','Provider')+f('host','Host country / region')+f('url','Official URL','https://')+f('deadline','Deadline','','date')+
    f('levels','Levels (comma): bachelor, master, phd, short')+f('fields','Fields (comma) or any: '+FIELDS.slice(1).join(', '))+f('eligible','Eligible (comma): ALL, AFRICA, SOUTH_ASIA, MENA or country codes like SO, KE')+
    '<label class="f">Funding</label>'+K.seg('sfund',s.funding,[['full','Full'],['partial','Partial']])+f('lang_req','Language requirement (optional)')+'<label class="f">Summary</label><textarea class="t" data-sf="summary">'+esc(s.summary||'')+'</textarea>'+
    '<label class="f">Status</label>'+K.seg('sstatus',s.status||'active',[['active','Active'],['hidden','Hidden']])+'</div>';
   return h+'<button class="btn" data-a="schsave">'+ic('check')+'Save</button>'+(s.id?'<button class="btn ghost" style="color:var(--danger)" data-a="schdel">'+ic('trash')+'Delete</button>':'')+K.errBox()}
 },
 onSeg:function(n,v){if(n==='sfund'||n==='sstatus'){readSch();F.admForm[n==='sfund'?'funding':'status']=v;return K.render()}readProfile();F.form[n]=v;K.render()},
 actions:{
  profile:function(){F.form=Object.assign({country:'SO',level:'bachelor',field:'any',english:'none',need:'full',gpa:'',alerts:true},F.profile||{});K.go('profile')},
  alerts:function(){readProfile();F.form.alerts=!F.form.alerts;K.render()},
  saveprofile:function(){readProfile();api('scSaveProfile',{profile:F.form}).then(function(r){if(!r.ok){S.err=t('e_gen');return K.render()}F.profile=F.form;F.list=null;K.home()})},
  filter:function(el,d){F.filter=d.v;K.render()},
  open:function(el,d){F.detail=F.list.filter(function(s){return s.id===d.id})[0];K.go('detail')},
  save:function(el,d){var on=F.savedIds.indexOf(d.id)<0;if(on&&S.me.access.reason!=='sub'&&S.me.access.reason!=='test')return K.paywall({title:t('appName'),text:t('pw_text'),icon:'award',features:[t('matches')+' ∞',t('saved'),t('alerts')]});
   api('scSave',{id:d.id,on:on}).then(function(r){if(r.ok){F.savedIds=r.saved;K.render()}})},
  manage:function(){K.go('schadmin')},
  slpdf:function(){if(!K.isPro())return K.paywall({title:t('appName'),text:t('pw_text'),icon:'award',features:[t('matches')+' ∞',t('shortlist'),t('alerts')]});
   var list=F.list.filter(function(s){return F.filter!=='saved'||F.savedIds.indexOf(s.id)>=0}),p=F.profile,cn=(COUNTRIES.filter(function(c){return c[0]===p.country})[0]||['','',''])[1];
   K.showReport({brand:t('appName'),title:t('sl_title'),subtitle:t('profile_l')+': '+cn+' · '+t(p.level)+' · '+t('f_'+p.field),
    blocks:[{table:{cols:[{label:t('name_l'),w:3},{label:t('host'),w:1.6},{label:t('funding'),w:1.3},{label:t('deadline'),w:1.2},{label:'%',w:0.6,align:'right'}],
     rows:list.map(function(s){var dl=daysLeft(s.deadline);return[s.name,s.host,t(s.funding),{v:s.deadline,tone:dl<=14?'bad':null},s.score]})}},
     {h:t('links')},{text:list.map(function(s,i){return(i+1)+'. '+s.name+' — '+s.url}).join('\n')}].concat(K.DEMO?[{text:t('sample')}]:[])},'scholarship-shortlist.pdf')},
  schnew:function(){F.admForm={id:'',name:'',provider:'',host:'',url:'',deadline:'',levels:['master'],fields:['any'],eligible:['ALL'],funding:'full',lang_req:'',summary:'',status:'active'};K.go('schform')},
  schedit:function(el,d){F.admForm=JSON.parse(JSON.stringify(F.adm.filter(function(s){return s.id===d.id})[0]));K.go('schform')},
  schsave:function(){readSch();var s=F.admForm;if(!s.name||!s.deadline||!s.url){S.err='Name, URL and deadline are required.';return K.render()}api('adminSchSave',{item:s}).then(function(r){if(r.ok)K.back();else{S.err=r.error||t('e_gen');K.render()}})},
  schdel:function(){if(confirm('Delete?'))api('adminSchDelete',{id:F.admForm.id}).then(function(){K.back()})}
 },
 demoSeed:function(){function d(n){return new Date(Date.now()+n*864e5).toISOString().slice(0,10)}
  function s(id,name,prov,host,lv,fl,el,fund,dl,url,sum,lr){return{id:id,name:name,provider:prov,host:host,levels:lv,fields:fl,eligible:el,funding:fund,deadline:d(dl),url:url,summary:sum,lang_req:lr||'',status:'active'}}
  return{profile:null,saved:[],items:[
   s('s1','Chevening Scholarships','UK Government','United Kingdom',['master'],['any'],['ALL'],'full',45,'https://www.chevening.org','One-year master\'s degrees in the UK for future leaders.','IELTS or equivalent'),
   s('s2','DAAD Development-Related Postgraduate Courses','DAAD','Germany',['master','phd'],['engineering','agriculture','social','science','business'],['AFRICA','SOUTH_ASIA','MENA'],'full',60,'https://www.daad.de','Postgraduate courses with relevance to developing countries.','English or German'),
   s('s3','Türkiye Scholarships','Government of Türkiye','Türkiye',['bachelor','master','phd'],['any'],['ALL'],'full',20,'https://www.turkiyeburslari.gov.tr','Full scholarships including a Turkish language year.',''),
   s('s4','Mastercard Foundation Scholars Program','Mastercard Foundation','Partner universities',['bachelor','master'],['any'],['AFRICA'],'full',75,'https://mastercardfdn.org','For academically talented young Africans with financial need.',''),
   s('s5','Erasmus Mundus Joint Masters','European Union','Europe (multiple)',['master'],['any'],['ALL'],'full',90,'https://www.eacea.ec.europa.eu','Joint master\'s programmes across several European universities.','English'),
   s('s6','MEXT Scholarship','Government of Japan','Japan',['bachelor','master','phd'],['engineering','science','computing','social'],['ALL'],'full',35,'https://www.studyinjapan.go.jp','Japanese government scholarship via embassy recommendation.',''),
   s('s7','Commonwealth Shared Scholarships','CSC UK','United Kingdom',['master'],['agriculture','medicine','engineering','education','science'],['SO','KE','UG','TZ','RW','NG','GH','PK','IN','BD','ZM','ZW','MW','CM'],'full',8,'https://cscuk.fcdo.gov.uk','Master\'s study in the UK for students from eligible Commonwealth countries.','IELTS'),
   s('s8','University Merit Award (example)','Example University','Malaysia',['bachelor','master'],['business','computing'],['ALL'],'partial',50,'https://example.org','Partial tuition waiver for strong applicants.','')]}},
 demo:{
  scHome:function(d,s){var p=s.app.profile;if(!p)return{ok:true,profile:null,matches:[],locked:0};var all=s.app.items.filter(function(x){return x.status!=='hidden'}).map(function(x){return Object.assign({score:score(p,x)},x)}).filter(function(x){return x.score>0})
    .sort(function(a,b){return b.score-a.score||a.deadline.localeCompare(b.deadline)});var a=K.S.me.access,full=a.reason==='sub'||(a.reason==='test');var n=full?all.length:+s.settings.freeAllowance||3;
   return{ok:true,profile:p,matches:all.slice(0,n),locked:Math.max(0,all.length-n),saved:s.app.saved}},
  scSaveProfile:function(d,s){s.app.profile=d.profile;return{ok:true}},
  scSave:function(d,s){var i=s.app.saved.indexOf(d.id);if(d.on&&i<0)s.app.saved.push(d.id);if(!d.on&&i>=0)s.app.saved.splice(i,1);return{ok:true,saved:s.app.saved}},
  adminSchList:function(d,s){return{ok:true,items:s.app.items}},
  adminSchSave:function(d,s){var it=d.item;if(it.id){var i=s.app.items.findIndex(function(x){return x.id===it.id});s.app.items[i]=it}else{it.id='s'+K.uid();s.app.items.push(it)}return{ok:true}},
  adminSchDelete:function(d,s){s.app.items=s.app.items.filter(function(x){return x.id!==d.id});return{ok:true}}
 }
});
function card(s){var dl=daysLeft(s.deadline);return'<button class="chrow" data-a="open" data-id="'+esc(s.id)+'"><div class="av">'+ic('award')+'</div><div class="grow"><div class="fn">'+esc(s.name)+'</div><div class="fs">'+esc(s.provider)+' · '+esc(s.host)+'</div><div><span class="pill ac">'+t('match',{n:s.score})+'</span>'+
 (s.funding==='full'?'<span class="pill ok">'+t('full')+'</span>':'<span class="pill">'+t('partial')+'</span>')+'<span class="pill '+(dl<=14?'bad':'')+'">'+(dl===0?t('closes_today'):t('days_left',{n:dl}))+'</span>'+(F.savedIds&&F.savedIds.indexOf(s.id)>=0?'<span class="pill ac">'+ic('check','s')+'</span>':'')+'</div></div></button>'}
function readProfile(){var c=document.getElementById('pcountry');if(!c)return;F.form.country=c.value;F.form.field=document.getElementById('pfield').value;F.form.gpa=document.getElementById('pgpa').value.trim()}
function readSch(){document.querySelectorAll('[data-sf]').forEach(function(el){var k=el.dataset.sf,v=el.value.trim();F.admForm[k]=['levels','fields','eligible'].indexOf(k)>=0?v.split(',').map(function(x){return x.trim()}).filter(Boolean):v})}
})();
</script>
