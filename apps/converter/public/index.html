<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#f2f4f7);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#ffffff));
  --text:var(--tg-theme-text-color,#101828);
  --hint:var(--tg-theme-hint-color,#667085);
  --accent:var(--tg-theme-button-color,#2457d6);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
  --link:var(--tg-theme-link-color,#2457d6);
  --sep:var(--tg-theme-section-separator-color,rgba(128,128,128,.2));
  --danger:var(--tg-theme-destructive-text-color,#d92d20);
  --ok:#12b76a;
  --soft:color-mix(in srgb,var(--accent) 10%,transparent);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:var(--tg-theme-secondary-bg-color,#0e1116);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#171b22));
  --text:var(--tg-theme-text-color,#e6e9ef);
  --hint:var(--tg-theme-hint-color,#8b93a1);
  --accent:var(--tg-theme-button-color,#4c7cf0);
  --link:var(--tg-theme-link-color,#6f97f5);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;flex:none}
.top h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--hint)}
.grow{flex:1;min-width:0}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--sep);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.lang{display:flex;border:1px solid var(--sep);border-radius:10px;overflow:hidden;background:var(--card);flex:none}
.lang button{border:0;background:none;padding:7px 10px;font-size:12px;font-weight:650;color:var(--hint);cursor:pointer}
.lang button.on{background:var(--accent);color:var(--accent-text)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}svg.i.l{width:26px;height:26px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--accent);border:0;cursor:pointer}
.chip.warn{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.chip.good{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 12px;border:1px solid var(--sep)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tool{background:var(--card);border:1px solid var(--sep);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:128px}
.tool:active{transform:scale(.985)}
.tool .ic{width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.tool b{font-size:14.5px;font-weight:650}
.tool span{font-size:12.5px;color:var(--hint);line-height:1.35}
.tool.dis{opacity:.55;cursor:default}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);border:1px solid var(--sep);border-radius:6px;padding:2px 6px;align-self:flex-start}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--hint);margin:18px 4px 8px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--hint);padding:4px 4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:13px 16px;font-weight:650;background:var(--accent);color:var(--accent-text);cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec2{background:var(--soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--sep)}
.btn.sm{padding:9px 12px;font-size:13.5px;width:auto}
.btn+.btn{margin-top:8px}
.row{display:flex;gap:8px;align-items:center}
.drop{border:1.5px dashed var(--sep);border-radius:var(--r);padding:26px 16px;text-align:center;cursor:pointer;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.drop .ic{width:48px;height:48px;border-radius:14px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.drop small{color:var(--hint)}
.files{list-style:none;margin:0;padding:0}
.files li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep)}
.files li:last-child{border-bottom:0}
.thumb{width:40px;height:40px;border-radius:8px;background:var(--soft);color:var(--accent);display:grid;place-items:center;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.fn{font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs{font-size:12px;color:var(--hint)}
.mini{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--hint);display:grid;place-items:center;cursor:pointer;flex:none}
.mini:disabled{opacity:.3}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--hint);margin:12px 0 6px}
label.f:first-child{margin-top:0}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--hint);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--sep);background:var(--bg);border-radius:10px;padding:10px 12px;outline:none}
input.t:focus,select.t:focus{border-color:var(--accent)}
.opt{display:flex;flex-direction:column;gap:6px}
.radio{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--sep);border-radius:12px;cursor:pointer;background:var(--card)}
.radio.on{border-color:var(--accent);background:var(--soft)}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--hint);flex:none;display:grid;place-items:center}
.radio.on .dot{border-color:var(--accent)}
.radio.on .dot:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.bar{height:6px;border-radius:6px;background:var(--bg);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.err{color:var(--danger);font-size:13px;display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.okmsg{color:var(--ok);font-size:13px;display:flex;gap:8px;align-items:center;margin-top:10px}
.center{text-align:center}
.big{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:4px auto 10px;background:var(--soft);color:var(--accent)}
.big.good{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
h2{font-size:17px;margin:0 0 4px;font-weight:650}
p.m{margin:0;color:var(--hint);font-size:13.5px}
.feat{list-style:none;padding:0;margin:12px 0 0}
.feat li{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.feat svg{color:var(--ok)}
.price{font-weight:700;margin-left:auto;text-align:right;font-size:14px}
.price small{display:block;font-weight:500;color:var(--hint);font-size:11.5px}
.kv{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--sep);border-radius:10px;background:var(--bg);margin-bottom:8px}
.kv code{font:600 13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;flex:1}
.kv .k{font-size:11.5px;color:var(--hint);display:block;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:9;max-width:90%;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.banner{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--text);margin-bottom:12px}
.banner svg{color:var(--accent);margin-top:1px}
table.pl{width:100%;border-collapse:collapse;font-size:13px}
.plan{border:1px solid var(--sep);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.plan .full{grid-column:1/-1}
.plan input,.plan select{padding:8px 10px;font-size:13px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.tgl{width:44px;height:26px;border-radius:13px;background:var(--sep);border:0;position:relative;cursor:pointer;flex:none}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl.on{background:var(--accent)}.tgl.on:after{left:21px}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat div{background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-size:18px}
.stat span{font-size:11.5px;color:var(--hint)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.foot{text-align:center;color:var(--hint);font-size:11.5px;margin-top:18px}
</style>

    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,nm,data);

    c.setUint32(12,dt,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);

function loadImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){res({im:im,u:u})};im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img:'+file.name))};im.src=u})}
var SIZES={a4:[595.28,841.89],letter:[612,792]},MARGINS={none:0,small:18,normal:36};
function runImg2Pdf(files,o,prog){return libPdf().then(function(P){return P.PDFDocument.create().then(function(doc){
  var i=0;function next(){if(i>=files.length)return doc.save();prog(t('file_x',{a:i+1,b:files.length}),i/files.length);
    var f=files[i++].file;return loadImg(f).then(function(r){var im=r.im,w=im.naturalWidth,h=im.naturalHeight,max=2480,sc=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(r.u);
      return canvasBlob(c,'image/jpeg',0.86).then(readBuf).then(function(buf){c.width=c.height=0;return doc.embedJpg(buf)}).then(function(jpg){
        var land=o.orient==='landscape'||(o.orient==='auto'&&w>h),pw,ph;
        if(o.size==='fit'){pw=land?841.89:595.28;ph=pw*h/w}else{var z=SIZES[o.size];pw=land?z[1]:z[0];ph=land?z[0]:z[1]}
        var m=MARGINS[o.margin]||0,bw=pw-2*m,bh=ph-2*m,s=Math.min(bw/w,bh/h),dw=w*s,dh=h*s;
        if(o.size==='fit'&&!m){dw=pw;dh=ph}
        var pg=doc.addPage([pw,ph]);pg.drawImage(jpg,{x:(pw-dw)/2,y:(ph-dh)/2,width:dw,height:dh});return tick().then(next)})})}
  return next()})}).then(function(bytes){return[{name:baseName(files[0].file.name)+(files.length>1?'-'+files.length+'-pages':'')+'.pdf',blob:new Blob([bytes],{type:'application/pdf'})}]})}

function openPdfLib(P,buf){return P.PDFDocument.load(buf).catch(function(e){if(/encrypt/i.test(e.message||e.name))throw new Error('enc');throw e})}
function runMerge(files,o,prog){return libPdf().then(function(P){return P.PDFDocument.create().then(function(out){
  var i=0;function next(){if(i>=files.length)return out.save();prog(t('file_x',{a:i+1,b:files.length}),i/files.length);var f=files[i++].file;
    return readBuf(f).then(function(b){return openPdfLib(P,b)}).then(function(src){return out.copyPages(src,src.getPageIndices())}).then(function(pp){pp.forEach(function(p){out.addPage(p)});return tick().then(next)})}
  return next()})}).then(function(bytes){return[{name:'merged.pdf',blob:new Blob([bytes],{type:'application/pdf'})}]})}

function runSplit(files,o,prog){var f=files[0].file,bn=baseName(f.name);return libPdf().then(function(P){return readBuf(f).then(function(b){return openPdfLib(P,b)}).then(function(src){
  var n=src.getPageCount(),groups;
  if(o.mode==='every')groups=parseRanges(o.pages,n).reduce(function(a,g){return a.concat(g.map(function(x){return[x]}))},[]);
  else if(o.mode==='ranges')groups=parseRanges(o.pages,n);
  else groups=[parseRanges(o.pages,n).reduce(function(a,g){return a.concat(g)},[])];
  var out=[],i=0;
  function label(g){return g.length===1?'page-'+(g[0]+1):'pages-'+(g[0]+1)+'-'+(g[g.length-1]+1)}
  function next(){if(i>=groups.length)return out;var g=groups[i++];prog(t('file_x',{a:i,b:groups.length}),i/groups.length);
    return P.PDFDocument.create().then(function(d){return d.copyPages(src,g).then(function(pp){pp.forEach(function(p){d.addPage(p)});return d.save()})})
      .then(function(bytes){out.push({name:bn+'-'+(o.mode==='extract'&&groups.length===1&&g.length>1&&!o.pages?'copy':label(g))+'.pdf',blob:new Blob([bytes],{type:'application/pdf'})});return tick().then(next)})}
  return next()})})}

function runPdf2Img(files,o,prog){var f=files[0].file,bn=baseName(f.name);return libPdfjs().then(function(J){return readBuf(f).then(function(b){
  return J.getDocument({data:new Uint8Array(b),isEvalSupported:false}).promise.catch(function(e){if(e&&e.name==='PasswordException')throw new Error('enc');throw e})}).then(function(doc){
  var n=doc.numPages,idx=parseRanges(o.pages,n).reduce(function(a,g){return a.concat(g)},[]),out=[],i=0,scale=o.q==='high'?2.5:1.6,
      type=o.fmt==='png'?'image/png':'image/jpeg',ext=o.fmt==='png'?'png':'jpg',pad=String(n).length;
  function next(){if(i>=idx.length){doc.destroy();return out}var pn=idx[i++]+1;prog(t('page_x',{a:i,b:idx.length}),(i-1)/idx.length);
    return doc.getPage(pn).then(function(pg){var vp=pg.getViewport({scale:scale}),lim=4096/Math.max(vp.width,vp.height);if(lim<1)vp=pg.getViewport({scale:scale*lim});

        out.push({name:bn+'-page-'+String(pn).padStart(pad,'0')+'.'+ext,blob:bl});return next()})})}
  return next()})})}

function refreshMe(){return api('init',{start:START}).then(function(r){if(r.ok)S.me=r;else if(!S.me)S.me={access:computeAccess(defaultSettings(),null,0,false),plans:[],methods:[],error:r.error};return r})}
function addFiles(list){var T=TOOLS[S.tool],arr=[].slice.call(list||[]);
  arr=arr.filter(function(f){return T.kind==='img'?/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp)$/i.test(f.name):(f.type==='application/pdf'||/\.pdf$/i.test(f.name))});
  if(!T.multi){resetTool();arr=arr.slice(0,1)}
  arr.forEach(function(f){var it={file:f};if(T.kind==='img')it.url=URL.createObjectURL(f);S.files.push(it);
    if(T.kind==='pdf'&&S.tool!=='merge')countPages(it)});
  S.err='';render()}
function countPages(it){libPdf().then(function(P){return readBuf(it.file).then(function(b){return P.PDFDocument.load(b,{ignoreEncryption:true,updateMetadata:false})})}).then(function(d){it.pages=d.getPageCount();render()}).catch(function(){})}
function errMsg(e){var m=String(e&&e.message||e);if(m==='enc')return t('e_enc');if(m==='range')return t('e_range');if(m.indexOf('img:')===0)return t('e_img',{f:m.slice(4)});if(m==='network')return t('e_net');return t('e_gen')}
function runTool(){var a=S.me.access,k=S.tool;var pg=document.getElementById('pages');if(pg)S.opts.pages=pg.value;
  if(!S.files.length){S.err=t('e_none');return render()}
  if(k==='merge'&&S.files.length<2){S.err=t('e_two');return render()}
  if(!a.entitled){S.err='';return go('paywall')}
  var total=S.files.reduce(function(s,f){return s+f.file.size},0);
  if(total>a.maxMB*MB){S.err=t('e_size',{n:a.maxMB});render();if(a.reason==='free'){setTimeout(function(){go('paywall')},900)}return}
  if(k==='split'||k==='pdf2img'){try{parseRanges(S.opts.pages,S.files[0].pages||99999)}catch(e){S.err=t('e_range');return render()}}
  S.busy=true;S.err='';S.prog={label:'',p:0};render();
  RUN[k](S.files,S.opts,function(label,p){S.prog={label:label,p:p};var b=document.querySelector('.bar i'),l=b&&b.parentNode.nextElementSibling;if(b){b.style.width=Math.round(p*100)+'%';l.textContent=label}})
  .then(function(out){return api('consume',{tool:k,files:S.files.length,bytes:total}).then(function(r){
    if(!r.ok)throw new Error(r.error==='network'?'network':'server');
    S.me.access=r.access;if(!r.allowed){S.busy=false;return go('paywall')}
    S.deliveryToken=r.token;S.results=out;S.busy=false;haptic('ok');render()})})
  .catch(function(e){console.error(e);S.busy=false;S.err=errMsg(e);render()})}
function sendResults(idx){var list=idx==null?S.results:[S.results[idx]],i=0;toast(t('sending'));
  function next(){if(i>=list.length){toast(t('sent'));haptic('ok');return}var r=list[i++];
    return blobB64(r.blob).then(function(b64){return api('sendFile',{token:S.deliveryToken,name:r.name,mime:r.blob.type,data:b64})}).then(function(res){
      if(!res.ok){if(res.error==='write_access'&&IN_TG&&TG.requestWriteAccess){TG.requestWriteAccess(function(ok){if(ok){i--;next()}else toast(t('e_write'))});return}throw new Error(res.error)}
      return next()})}
  next().catch(function(e){toast(errMsg(e))})}
function startPayment(method){var plan=S.payPlan;S.err='';S.codeErr='';
  if(method==='stars'&&!DEMO&&!IN_TG){S.err=t('open_in_tg');return render()}
  api('createOrder',{plan:plan,method:method,code:S.disc?S.disc.code:''}).then(function(r){
    if(r.ok&&r.free){S.payment=r;return onPaid(r)}

  var d=el.dataset,i;

  if(d.tool){S.tool=d.tool;S.opts=Object.assign({},DEF_OPTS[d.tool]);resetTool();haptic();return go('tool')}
  if(d.rm!=null){i=+d.rm;if(S.files[i].url)URL.revokeObjectURL(S.files[i].url);S.files.splice(i,1);return render()}
  if(d.up!=null){i=+d.up;S.files.splice(i-1,0,S.files.splice(i,1)[0]);return render()}

  if(d.dl!=null){var r=S.results[+d.dl];return saveBlob(r.blob,r.name)}

  if(d.plan){S.payPlan=d.plan;return render()}

  if(d.toggle){if(d.toggle==='simfree'){lsSet('pdft_simfree',!lsGet('pdft_simfree',false));refreshMe().then(render);return}
    S.admin.settings=collectSettings();if(d.toggle==='testMode')S.admin.settings.testMode=!S.admin.settings.testMode;else if(d.toggle==='x_refOn')S.admin.settings.x_refOn=!S.admin.settings.x_refOn;else if(d.toggle==='m_stars')S.admin.settings.methods.stars=!S.admin.settings.methods.stars;return render()}
  if(d.planRm!=null){S.admin.settings=collectSettings();S.admin.settings.plans.splice(+d.planRm,1);return render()}
  if(d.secret){var inpS=document.getElementById('sec_'+d.secret);if(!inpS.value.trim())return;api('adminSetSecret',{key:d.secret,value:inpS.value.trim()}).then(function(r){inpS.value='';toast(r.ok?'Saved':(r.error||'Error'));if(r.ok){S.admin.secrets[d.secret]=true;render()}});return}
  if(d.approve||d.reject){api('adminDecide',{order_id:d.approve||d.reject,approve:!!d.approve}).then(function(r){toast(r.ok?'Done':(r.error||'Error'));loadAdmin()});return}
  switch(d.act){
  case 'back':return back();
  case 'home':S.stack=[];S.screen='home';return render();
  case 'pick':$picker.accept=TOOLS[S.tool].accept;$picker.multiple=TOOLS[S.tool].multi;$picker.value='';return $picker.click();
  case 'clear':resetTool();return render();
  case 'run':return runTool();
  case 'again':resetTool();return render();
  case 'dl0':return saveBlob(S.results[0].blob,S.results[0].name);
  case 'dlzip':Promise.all(S.results.map(function(r){return readBuf(r.blob).then(function(b){return{name:r.name,data:new Uint8Array(b)}})})).then(function(fs){saveBlob(makeZip(fs),baseName(S.files[0]?S.files[0].file.name:'files')+'.zip')});return;
  case 'sendall':return sendResults(null);
  case 'account':return go('account');
  case 'help':return go('help');
  case 'introok':lsSet('pdft_intro',true);return render();
  case 'paywall':S.err='';S.disc=null;S.codeErr='';return go('paywall');
  case 'settings':S.adminMsg='';go('settings');return loadAdmin();
  case 'addplan':S.admin.settings=collectSettings();S.admin.settings.plans.push({id:'plan_'+(S.admin.settings.plans.length+1),label:'New plan',days:30,usd:1,stars:75,region:'GLOBAL'});return render();
  case 'savesettings':var st=collectSettings();api('adminSave',{settings:st}).then(function(r){if(r.ok){S.admin.settings=st;S.adminMsg='Saved';refreshMe().then(render)}else toast(r.error||'Error')});return;
  case 'resetme':api('adminResetMe').then(function(){refreshMe().then(function(){toast('Reset');render()})});return;
  case 'checkpay':api('checkOrder',{order_id:S.payment.order_id}).then(function(r){if(r.ok&&r.status==='paid')return onPaid(r);
      if(DEMO&&confirm(t('pay_demo')))return api('demoPay',{order_id:S.payment.order_id}).then(onPaid);S.err=t('not_yet');render()});return;
  case 'submittx':var tx=document.getElementById('txid').value.trim();if(tx.length<4){S.err=t('txid');return render()}
    api('submitManual',{order_id:S.payment.order_id,txid:tx}).then(function(r){if(r.ok){S.payment.status='review';S.err=''}else S.err=errMsg(r.error);render()});return;
  case 'applycode':var cv=((document.getElementById('dcode')||{}).value||'').trim().toUpperCase();S.codeErr='';if(!cv){S.disc=null;return render()}
    api('checkCode',{code:cv,plan:S.payPlan}).then(function(r){if(r.ok){S.disc={code:r.code,pct:r.pct};haptic('ok')}else{S.disc=null;S.codeErr=t(r.error||'code_invalid')}render()});return;
  case 'freecode':return startPayment('code');
  case 'sharetg':return openLink('https://t.me/share/url?url='+encodeURIComponent(refLink())+'&text='+encodeURIComponent(t('invite_msg')));
  case 'sharewa':return openLink('https://wa.me/?text='+encodeURIComponent(t('invite_msg')+' '+refLink()));
  case 'codeadd':var f={code:document.getElementById('nc_code').value.trim().toUpperCase(),pct:+document.getElementById('nc_pct').value,max_uses:+document.getElementById('nc_max').value||0,expires:document.getElementById('nc_exp').value,note:document.getElementById('nc_note').value.trim()};
    api('adminCodeSave',f).then(function(r){if(r.ok){toast('Saved');loadAdmin()}else toast(r.error==='code_format'?'Code: 3–20 letters/numbers':r.error==='code_pct'?'Discount: 1–100%':'Error')});return;
  case 'verifyphone':
    if(DEMO){api('demoVerifyPhone').then(function(){refreshMe().then(function(){S.stack=['home'];go('paywall',false)})});return}
    if(IN_TG&&TG.requestContact)TG.requestContact(function(ok){if(ok)setTimeout(function(){refreshMe().then(function(){S.stack=['home'];go('paywall',false)})},1500)});return;
  }
});
$picker.addEventListener('change',function(){addFiles($picker.files)});

/* ---------- boot ---------- */
if(IN_TG){try{TG.ready();TG.expand();if(TG.isVersionAtLeast&&TG.isVersionAtLeast('7.7'))TG.disableVerticalSwipes()}catch(e){}}
document.documentElement.lang=LANG;
render();
refreshMe().then(render);
})();
</script>
</body>
</html>
