<style>
.cd{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--accent);margin-top:12px}
.tz2{font-size:12.5px;color:var(--hint);margin-top:4px}
.tkt{position:relative;border-radius:22px;overflow:hidden;margin-bottom:12px;background:linear-gradient(150deg,#0b1024 0%,#16205a 55%,#3a1d6e 100%);color:#fff;box-shadow:0 18px 40px -22px rgba(22,32,90,.7)}
.tkt .top{display:block;padding:20px 20px 16px;text-align:left;position:static}.tkt .ey{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.65}.tkt h3{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:22px;margin:6px 0 4px;line-height:1.25}
.tkt .sub{font-size:13px;opacity:.8}.tkt .cut{position:relative;border-top:2px dashed rgba(255,255,255,.22);margin:0 16px}
.tkt .cut:before,.tkt .cut:after{content:'';position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}.tkt .cut:before{left:-29px}.tkt .cut:after{right:-29px}
.tkt .bot{display:block;padding:16px 20px 20px;text-align:center}.tkt .sub{display:block}.tkt .qrbox{box-shadow:0 0 0 6px rgba(255,255,255,.08)}
.tkt .who{font-size:20px;font-weight:700;margin-top:12px}.tkt .plus{display:inline-block;margin-left:6px;font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;background:rgba(255,255,255,.16);vertical-align:3px}
.tkt .code{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;font-size:13px;opacity:.75;margin-top:6px}.tkt .op{font-size:12.5px;opacity:.8;margin-top:8px}
.bar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#8b5cf6);transition:width .4s}
.door b.n{font-size:30px;letter-spacing:-.02em}.door .fs{margin-top:2px}
.res{text-align:center;border-radius:18px;padding:22px 18px;margin:12px 0;border:1px solid var(--sep);background:var(--card)}
.res .ri{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px}.res h2{margin:4px 0}.res.in .ri{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.res.warn .ri{background:color-mix(in srgb,#f59e0b 18%,transparent);color:#d97706}.res.early .ri{background:var(--soft);color:var(--accent)}.res.bad .ri{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.res.in{border-color:color-mix(in srgb,var(--ok) 40%,var(--sep))}.res .pv{margin-top:12px;text-align:left;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.lst{list-style:none;margin:0;padding:0}.lst li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--sep);font-size:14px}.lst li:first-child{border-top:0}
</style>
</head>

<script>
(function(){
var t=K.t,esc=K.esc,ic=K.ic,S=K.S,api=K.api;
var EKEY=K.param('e'),GKEY=K.param('g'),TKEY=K.param('t'),SKEY=K.param('s');
var R={events:null,ev:null,edit:null,inv:null,tk:null,door:null,scan:null,reply:{rsvp:'yes',party:1,name:'',msg:''},sending:false,msgOk:false};
/* door helper links this phone has opened (a helper can then also check in from a scanned ticket link) */
var STAFF=K.lsGet('rsv_staff',[]);if(SKEY&&STAFF.indexOf(SKEY)<0){STAFF.unshift(SKEY);STAFF=STAFF.slice(0,10);K.lsSet('rsv_staff',STAFF)}

/* ---------- time zones: event times are venue times; every clock time is shown in the event's zone ---------- */
var DEF_TZ='Africa/Mogadishu';
function tzOk(z){try{new Intl.DateTimeFormat('en',{timeZone:z});return!!z}catch(e){return false}}
var PHONE_TZ=(function(){try{var z=Intl.DateTimeFormat().resolvedOptions().timeZone;return tzOk(z)?z:DEF_TZ}catch(e){return DEF_TZ}})();
var ZONES=['Africa/Mogadishu','Africa/Nairobi','Africa/Addis_Ababa','Africa/Djibouti','Africa/Kampala','Africa/Dar_es_Salaam','Africa/Cairo','Asia/Dubai','Asia/Riyadh','Asia/Qatar','Europe/Istanbul','Europe/London','Europe/Stockholm','Europe/Oslo','Europe/Helsinki','Europe/Copenhagen','Europe/Amsterdam','Europe/Berlin','America/New_York','America/Chicago','America/Toronto','America/Los_Angeles','Australia/Melbourne','UTC'];
function tzOf(e){return e&&tzOk(e.tz)?e.tz:DEF_TZ}
function loc(){return K.lang()==='so'?'so-SO':'en-GB'}
function offMin(tz,d){try{var p={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}).formatToParts(d).forEach(function(x){p[x.type]=x.value});
 return Math.round((Date.UTC(+p.year,p.month-1,+p.day,+p.hour%24,+p.minute)-Math.floor(d.getTime()/60000)*60000)/60000)}catch(e){return 0}}
function zoned(date,time,tz){var a=String(date||'').split('-').map(Number);if(!a[0]||!a[1]||!a[2])return null;var b=String(time||'00:00').split(':').map(function(x){return+x||0});
 var wall=Date.UTC(a[0],a[1]-1,a[2],b[0],b[1]),u=wall-offMin(tz,new Date(wall))*6e4;u=wall-offMin(tz,new Date(u))*6e4;return new Date(u)}
function city(tz){return String(tz).split('/').pop().replace(/_/g,' ')}
function tzLabel(tz){var m=offMin(tz,new Date()),a=Math.abs(m);return city(tz)+' (UTC'+(m<0?'−':'+')+Math.floor(a/60)+(a%60?':'+('0'+a%60).slice(-2):'')+')'}
function clockIn(iso,tz){if(!iso)return'';var d=new Date(iso);if(isNaN(d))return'';try{return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d)}catch(x){return d.toISOString().slice(11,16)}}
function dayIn(iso,tz){var d=new Date(iso);try{return new Intl.DateTimeFormat(loc(),{timeZone:tz,weekday:'short',day:'numeric',month:'short'}).format(d)}catch(x){return d.toISOString().slice(0,10)}}
function sameDay(a,b,tz){try{var f=new Intl.DateTimeFormat('en-CA',{timeZone:tz});return f.format(new Date(a))===f.format(new Date(b))}catch(x){return false}}
function whenAt(iso,tz){return(sameDay(iso,Date.now(),tz)?'':dayIn(iso,tz)+' ')+clockIn(iso,tz)}   // "15:00" today, "Sat 24 Dec 15:00" otherwise
function inTime(iso){var ms=new Date(iso)-Date.now();if(!iso||isNaN(ms))return'';if(ms<=0)return t('started');var m=Math.ceil(ms/6e4),h=Math.floor(m/60),d=Math.floor(h/24);
 return d>=2?t('in_days',{n:d}):h>=1?t('in_hm',{h:h,m:m%60}):t('in_m',{n:m})}
function fmtWhen(e){var d=e.date?new Date(e.date+'T12:00:00Z'):null;if(!d||isNaN(d))return e.date||'';
 try{return d.toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'})+(e.time?' · '+e.time:'')}catch(x){return e.date+' '+(e.time||'')}}
function yourTime(e){var tz=tzOf(e);if(!e.time||!e.starts_at)return'';var a=offMin(tz,new Date(e.starts_at)),b=offMin(PHONE_TZ,new Date(e.starts_at));
 return a===b?'':t('venue_time',{c:city(tz)})+' · '+t('your_time',{t:whenAt(e.starts_at,PHONE_TZ)})}
function opensLine(e){if(!e.checkin_opens_at)return'';return t('opens_at',{t:whenAt(e.checkin_opens_at,tzOf(e))})}
function cbLabel(n){n=+n;return n>=999?t('cb_any'):n===0?t('cb_0'):n<1?t('cb_m'):t('cb_h',{n:n})}
function people(n){n=+n||0;return n===1?t('one_person'):t('people',{n:n})}
function plus(n){n=+n||1;return n>1?'+'+(n-1):''}

/* ---------- tickets ---------- */
function ticketUrl(key){return K.CFG.botUsername?K.appLink('t_'+key):'RSVP:'+key}
function qrObj(text){var q=qrcode(0,'M');q.addData(text);q.make();return q}
function qrSvg(text){try{return qrObj(text).createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return''}}
function parseCode(s){var m=/(?:[?&](?:start|startapp)=t_|[?&]t=|^RSVP:|^t_)([A-Za-z0-9]+)/i.exec(String(s||'').trim());return m?m[1]:String(s||'').trim()}
function wrap(x,s,maxW){var w=String(s||'').split(/\s+/),out=[],line='';w.forEach(function(word){var tst=line?line+' '+word:word;if(x.measureText(tst).width>maxW&&line){out.push(line);line=word}else line=tst});if(line)out.push(line);return out}
function rr(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()}
/* a designed ticket picture (1080×1600): invitation on top, QR + name + party below a perforation */
function ticketBlob(e,g){return new Promise(function(res){
 var W=1080,H=1600,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d'),F='"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif',SER='Georgia,"Times New Roman",serif';
 var bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0b1024');bg.addColorStop(.55,'#16205a');bg.addColorStop(1,'#3a1d6e');x.fillStyle=bg;x.fillRect(0,0,W,H);
 [[150,120,460,'rgba(99,102,241,.35)'],[W-80,560,420,'rgba(236,72,153,.22)'],[W/2,H,520,'rgba(56,189,248,.14)']].forEach(function(o){var gr=x.createRadialGradient(o[0],o[1],0,o[0],o[1],o[2]);gr.addColorStop(0,o[3]);gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(0,0,W,H)});
 var tz=tzOf(e),y=128;x.textAlign='center';x.fillStyle='rgba(255,255,255,.62)';x.font='600 28px '+F;x.fillText(t('t_invite').split('').join(String.fromCharCode(8202))+'   ·   '+t('t_ticket').split('').join(String.fromCharCode(8202)),W/2,y);
 x.fillStyle='#fff';x.font='500 68px '+SER;y+=88;wrap(x,e.title,W-180).slice(0,3).forEach(function(l){x.fillText(l,W/2,y);y+=80});
 if(e.hosts){x.fillStyle='rgba(255,255,255,.75)';x.font='400 32px '+F;y+=4;wrap(x,e.hosts,W-200).slice(0,2).forEach(function(l){x.fillText(l,W/2,y);y+=42})}
 y+=18;x.fillStyle='rgba(255,255,255,.35)';x.fillRect(W/2-40,y,80,3);y+=58;x.fillStyle='#fff';x.font='600 36px '+F;x.fillText(fmtWhen(e),W/2,y);
 if(e.venue||e.address){y+=50;x.fillStyle='rgba(255,255,255,.8)';x.font='400 31px '+F;wrap(x,[e.venue,e.address].filter(Boolean).join(' · '),W-200).slice(0,2).forEach(function(l){x.fillText(l,W/2,y);y+=42});y-=42}
 var py=Math.max(y+56,600),pw=W-120,q=qrObj(ticketUrl(g.key)),n=q.getModuleCount(),room=H-60-py-56-40-250,qs=Math.max(380,Math.min(540,room)),cell=Math.floor(qs/(n+2)),qw=cell*(n+2),qx=Math.round((W-qw)/2),qy=py+56,ny=qy+qw+40;
 x.save();x.beginPath();x.rect(0,0,W,H);[60,W-60].forEach(function(cx){x.moveTo(cx+28,ny);x.arc(cx,ny,28,0,Math.PI*2)});x.clip('evenodd');x.fillStyle='#fff';rr(x,60,py,pw,H-py-60,40);x.fill();x.restore();
 x.strokeStyle='#d0d5dd';x.lineWidth=3;x.setLineDash([16,12]);x.beginPath();x.moveTo(110,ny);x.lineTo(W-110,ny);x.stroke();x.setLineDash([]);
 x.fillStyle='#0b1024';for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(qx+(k+1)*cell,qy+(r+1)*cell,cell,cell);
 var ty=ny+92,nm=g.name,pl=plus(g.party),fs=56,plw=0;x.font='700 34px '+F;if(pl)plw=x.measureText(pl).width+44;
 do{x.font='700 '+fs+'px '+F;fs-=2}while(fs>34&&x.measureText(nm).width+(pl?plw+18:0)>W-220);var nmw=x.measureText(nm).width;
 var sx=W/2-(nmw+(pl?plw+18:0))/2;x.textAlign='left';x.fillStyle='#0b1024';x.fillText(nm,sx,ty);
 if(pl){var bx=sx+nmw+18;x.fillStyle='#4f46e5';rr(x,bx,ty-44,plw,56,28);x.fill();x.fillStyle='#fff';x.font='700 34px '+F;x.fillText(pl,bx+22,ty-4)}
 x.textAlign='center';x.fillStyle='#475467';x.font='500 32px '+F;x.fillText(people(g.party),W/2,ty+54);
 x.fillStyle='#98a2b3';x.font='600 28px ui-monospace,Menlo,Consolas,monospace';x.fillText(t('t_code')+'  '+String(g.key).toUpperCase(),W/2,ty+104);
 x.fillStyle='#667085';x.font='400 27px '+F;x.fillText(t('t_show')+(e.checkin_opens_at?'  ·  '+opensLine(e):''),W/2,H-100);
 c.toBlob(function(b){res(b)},'image/jpeg',0.92)})}
function sendTicket(auto){var v=R.inv,g=v&&v.guest;if(!g||g.rsvp!=='yes'||R.sending)return;R.sending=true;K.render();
 ticketBlob(v.event,g).then(function(blob){
  if(!K.CFG.fileUrl||!K.IN_TG){K.saveBlob(blob,(v.event.title.replace(/[^\w\- ]+/g,'')||'ticket')+' ticket.jpg');R.sending=false;K.render();return}
  function up(){return fetch(K.CFG.fileUrl+'?kind=photo&ref='+encodeURIComponent(g.key),{method:'POST',headers:{'x-tg-init':K.TG.initData},body:blob}).then(function(r){return r.json()}).catch(function(){return{ok:false,error:'network'}})}
  function done(r){R.sending=false;if(r.ok){g.ticket_sent=true;K.toast(t('ticket_sent'));K.haptic('ok')}else if(!auto)K.toast(t('e_gen'));K.render()}
  up().then(function(r){if(!r.ok&&r.error==='write_access'&&K.TG.requestWriteAccess){K.TG.requestWriteAccess(function(ok){if(ok)up().then(done);else done(r)});return}done(r)})
 })}

function blank(){return{key:'',title:'',hosts:'',date:'',time:'',venue:'',address:'',map_url:'',notes:'',dress:'',deadline:'',open_max:4,status:'draft',tz:PHONE_TZ,checkin_before:3}}
function inviteText(e,link){return(K.lang()==='so'?'Waxaa lagugu martiqaaday: ':'You are invited: ')+e.title+'\n'+fmtWhen(e)+(e.venue?'\n'+e.venue:'')+'\n'+link}
function staffKey(){return SKEY?SKEY.split('-')[0]:''}
function doorKey(){return R.ev?R.ev.key:staffKey()}

/* ---------- check-in result (door screen and scanned ticket) ---------- */
function resultCard(r,e){if(!r)return'';var g=r.guest,tz=tzOf(e||r.event||{}),ev=r.event||e||{};
 function pv(){return g?'<div class="pv"><b>'+esc(g.name)+(plus(g.party)?' <span class="pill ac">'+plus(g.party)+'</span>':'')+'</b><br>'+people(g.party)+'<br>'+esc(ev.title||'')+'<br>'+esc(fmtWhen(ev))+(ev.venue?'<br>'+esc(ev.venue):'')+'</div>':''}
 if(r.ok&&r.result==='in')return'<div class="res in"><div class="ri">'+ic('check','l')+'</div><h2>'+esc(g.name)+(plus(g.party)?' '+plus(g.party):'')+'</h2><p class="m">'+t('ok_in')+' · '+people(g.party)+'</p><div class="fs">'+t('checked_at',{t:clockIn(g.checked_in_at,tz)})+'</div></div>';
 if(r.ok&&r.result==='already')return'<div class="res warn"><div class="ri">'+ic('alert','l')+'</div><h2>'+esc(g.name)+'</h2><p class="m">'+t('already',{t:whenAt(g.checked_in_at,tz)})+'</p>'+pv()+'</div>';
 if(r.ok&&r.result==='early')return'<div class="res early"><div class="ri">'+ic('clock','l')+'</div><h2>'+t('early')+'</h2><p class="m">'+t('starts_in',{t:whenAt(r.starts_at||ev.starts_at,tz),d:inTime(r.starts_at||ev.starts_at)})+'</p><p class="m" style="margin-top:2px">'+t('early_sub',{t:whenAt(r.opens_at,tz)})+'</p>'+pv()+
  '</div>';
 var msg=r.error==='not_attending'?t('not_attending'):r.error==='other_event'?t('other_event',{e:esc(r.other||'')}):r.error==='forbidden'?t('door_bad'):t('bad_code');
 return'<div class="res bad"><div class="ri">'+ic('x','l')+'</div>'+(g?'<h2>'+esc(g.name)+'</h2>':'')+'<p class="m">'+msg+'</p></div>'}
function doorCard(d){if(!d)return'';var pct=d.expected?Math.min(100,Math.round(d.arrived*100/d.expected)):0;
 return'<div class="card door"><div class="row"><div class="grow"><div class="fs">'+t('arrived')+'</div><b class="n">'+d.arrived+'</b> <span class="m">/ '+t('of_people',{b:d.expected})+'</span></div><div class="pill ac">'+pct+'%</div></div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="fs" style="margin-top:8px">'+(d.tickets===1?t('ticket_scanned1'):t('tickets_scanned',{n:d.tickets}))+'</div></div>'}

     '<label class="f">'+t('message')+'</label><textarea class="t" id="gmsg" maxlength="300">'+esc(rp.msg)+'</textarea></div><button class="btn" data-a="reply">'+ic('send')+t('send_reply')+'</button>'+
     '<div class="note">'+ic('lock','s')+'<span>'+t('final_note')+'</span></div>';
   return h+K.errBox()}
 },
 onSeg:function(n,v){if(n==='rsvp'){keepForm();R.reply.rsvp=v;K.render()}},
 actions:{
  new:function(){R.edit=blank();K.go('editor')},
  open:function(el,d){R.ev=(R.events||[]).filter(function(e){return e.key===d.key})[0];K.go('event')},
  edit:function(){R.edit=JSON.parse(JSON.stringify(R.ev));delete R.edit.guests;delete R.edit.stats;K.go('editor')},
  savedraft:function(){save(false)},
  publish:function(){if(S.screen==='editor')save(true);else publish(R.ev.key)},
  guests:function(){K.go('guests')},
  guestpdf:function(){var e=R.ev,s=e.stats||{},tz=tzOf(e),order={yes:0,maybe:1,pending:2,no:3};var gs=(e.guests||[]).slice().sort(function(a,b){return order[a.rsvp]-order[b.rsvp]||a.name.localeCompare(b.name)});
   K.showReport({brand:t('appName'),title:e.title,subtitle:fmtWhen(e)+(e.venue?' · '+e.venue:''),meta:(e.hosts?[[t('hosts'),e.hosts]]:[]).concat([[t('tz'),tzLabel(tz)]]),
    blocks:[{kpis:[[t('attending'),s.yesPeople||0,'good'],[t('declined'),s.no||0],[t('pending'),s.pending||0],[t('checked'),s.checked||0]]},{h:t('guests')+' ('+gs.length+')'},
     {table:{cols:[{label:t('name'),w:2.2},{label:t('reply_l'),w:1.3},{label:t('people_l'),w:0.8,align:'right'},{label:t('checked_l'),w:1.1},{label:t('message_l'),w:2.6}],
      rows:gs.map(function(g){return[g.name,{v:t(g.rsvp==='pending'?'pending':g.rsvp==='yes'?'attending':g.rsvp==='no'?'declined':'maybe'),tone:g.rsvp==='yes'?'good':g.rsvp==='no'?'bad':null},g.rsvp==='yes'?g.party:'',g.checked_in_at?clockIn(g.checked_in_at,tz):'',g.message||'']}),
      total:[t('total_people'),'',s.yesPeople||0,'','']}}]},(e.title.replace(/[^\w\- ]+/g,'')||'event')+' guests.pdf')},
  checkin:function(){R.scan=null;K.go('checkin')},
  addguests:function(){var lines=document.getElementById('bulk').value.split('\n').map(function(l){var p=l.split(',');return{name:p[0].trim(),max:Math.max(1,parseInt(p[1],10)||1)}}).filter(function(x){return x.name});
   if(!lines.length)return;api('rsvGuestAdd',{key:R.ev.key,guests:lines}).then(function(r){if(r.ok){R.ev=r.event;K.render()}else K.toast(t('e_gen'))})},
  delguest:function(el,d){api('rsvGuestDel',{key:R.ev.key,guest:d.key}).then(function(r){if(r.ok){R.ev=r.event;K.render()}})},
  reopen:function(el,d){confirmBox(t('reopen_q',{n:d.name}),function(){api('rsvGuestReset',{key:R.ev.key,guest:d.key}).then(function(r){if(r.ok){R.ev=r.event;S.msg=t('reopened');S.err=''}else S.err=t('e_gen');K.render()})})},
  undoin:function(el,d){confirmBox(t('undo_q',{n:d.name}),function(){api('rsvCheckinUndo',{key:R.ev.key,guest:d.key}).then(function(r){if(r.ok){R.ev=r.event;S.msg=t('undone');S.err=''}else S.err=t('e_gen');K.render()})})},
  staffmake:function(){api('rsvStaffLink',{key:R.ev.key}).then(function(r){if(r.ok){R.ev=r.event;K.haptic('ok')}K.render()})},
  staffnew:function(){api('rsvStaffLink',{key:R.ev.key,renew:true}).then(function(r){if(r.ok){R.ev=r.event;K.toast(t('door_new'));K.haptic('ok')}K.render()})},
  sharetg:function(el,d){K.shareTg(d.link,d.door?t('door_for')+': '+R.ev.title:inviteText(R.ev,'').trim())},
  sharewa:function(el,d){K.openLink('https://wa.me/?text='+encodeURIComponent(d.door?t('door_for')+': '+R.ev.title+'\n'+d.link:inviteText(R.ev,d.link)))},
  scan:function(){if(K.IN_TG&&K.TG.showScanQrPopup){K.TG.showScanQrPopup({text:t('scan')},function(txt){checkin(parseCode(txt));return true});return}
   var c=prompt(t('manual'));if(c)checkin(parseCode(c))},
  manual:function(){var c=document.getElementById('code').value.trim();if(c)checkin(parseCode(c))},
  tkcheck:function(el,d){var v=R.tk;api('rsvCheckin',{key:v.event.key,code:v.guest.key,staff:STAFF}).then(function(r){R.scan=r;K.haptic(r.ok&&r.result==='in'?'ok':'');K.render()})},
  minus:function(){keepForm();R.reply.party=Math.max(1,R.reply.party-1);K.render()},
  plus:function(){keepForm();R.reply.party++;K.render()},
  sendticket:function(){sendTicket(false)},
  sendmsg:function(){var m=document.getElementById('gmsg2'),tx=m?m.value.trim():'';if(!tx)return;
   api('rsvMessage',{e:EKEY,g:GKEY||(R.inv.guest&&R.inv.guest.key),text:tx}).then(function(r){if(r.ok){R.msgOk=true;S.err='';K.haptic('ok')}else S.err=r.error==='rate_limited'?t('e_rate'):t('e_gen');K.render()})},
  reply:function(){keepForm();var rp=R.reply;if(!R.inv.guest&&!rp.name){S.err=t('your_name');return K.render()}
   api('rsvReply',{e:EKEY,g:GKEY||(R.inv.guest&&R.inv.guest.key),rsvp:rp.rsvp,party:rp.rsvp==='no'?0:rp.party,name:rp.name,message:rp.msg}).then(function(r){
    if(r.ok){R.inv.guest=r.guest;if(r.event)R.inv.event=r.event;if(!GKEY)GKEY=r.guest.key;K.haptic('ok');S.err='';K.render();if(r.guest.rsvp==='yes'&&K.IN_TG&&K.CFG.fileUrl)sendTicket(true);return}
    if(r.error==='locked'&&r.guest){R.inv.guest=r.guest;S.err='';K.toast(t('locked'))}else S.err=r.error==='closed'?t('closed'):t('e_gen');K.render()})}
 },
 demoSeed:function(){var d=new Date(Date.now()+20*864e5).toISOString().slice(0,10),now=new Date(Date.now()-60*6e4).toISOString();
  return{events:[{key:'demoev',owner:'me',title:'Wedding of Amina & Yusuf',hosts:'The Ali and Omar families',date:d,time:'18:00',venue:'Grand Hall',address:'Main Road',map_url:'',notes:'We would be honoured to celebrate this day with you.',dress:'Formal',deadline:'',open_max:4,status:'published',tz:DEF_TZ,checkin_before:3,staff:'',
   guests:[{key:'g7k2m9',name:'Hodan Ahmed',max_party:2,rsvp:'yes',party:2,message:'Congratulations!',checked_in_at:''},{key:'g3p8x1',name:'Abdi Hassan',max_party:3,rsvp:'pending',party:0,message:'',checked_in_at:''},{key:'g5q1w4',name:'Faisal Omar',max_party:3,rsvp:'yes',party:3,message:'',checked_in_at:now}]}]}},
 demo:{
  rsvMine:function(d,s){return{ok:true,events:s.app.events.map(function(e){return full(e)})}},
  rsvSave:function(d,s){var e=d.event,ex=s.app.events.filter(function(x){return x.key===e.key})[0];if(ex){Object.assign(ex,e)}else{e.key='e'+K.uid().slice(-6);e.guests=[];e.status='draft';s.app.events.unshift(e);ex=e}return{ok:true,event:full(ex)}},
  rsvPublish:function(d,s){var e=find(s,d.key),a=K.S.me.access;if(!a.entitled)return{ok:true,allowed:false};
   var acc=s.settings.testMode&&!d.simulateFree?'test':(s.freeUsed<s.settings.freeAllowance?'free':s.credits>0?'credits':s.sub&&new Date(s.sub.expiry)>new Date()?'sub':'');
   if(!acc)return{ok:true,allowed:false};if(acc==='free')s.freeUsed++;if(acc==='credits')s.credits--;e.status='published';return{ok:true,allowed:true,event:full(e)}},
  rsvEvent:function(d,s){return{ok:true,event:full(find(s,d.key))}},
  rsvGuestAdd:function(d,s){var e=find(s,d.key);d.guests.forEach(function(g){e.guests.push({key:'g'+K.uid().slice(-5),name:g.name,max_party:g.max,rsvp:'pending',party:0,message:'',checked_in_at:''})});return{ok:true,event:full(e)}},
  rsvGuestDel:function(d,s){var e=find(s,d.key);e.guests=e.guests.filter(function(g){return g.key!==d.guest});return{ok:true,event:full(e)}},
  rsvGuestReset:function(d,s){var e=find(s,d.key),g=e.guests.filter(function(x){return x.key===d.guest})[0];if(!g||g.checked_in_at)return{ok:false};g.rsvp='pending';g.party=0;return{ok:true,event:full(e)}},
  rsvCheckinUndo:function(d,s){var e=find(s,d.key),g=e.guests.filter(function(x){return x.key===d.guest})[0];if(g)g.checked_in_at='';return{ok:true,event:full(e)}},
  rsvStaffLink:function(d,s){var e=find(s,d.key);if(!e.staff||d.renew)e.staff=e.key+'-'+K.uid().slice(-8);return{ok:true,event:full(e)}},
  rsvInvite:function(d,s){var x=byGuest(s,d.g),e=x?x.e:find(s,d.e);if(!e||e.status!=='published')return{ok:false,error:'not_found'};return{ok:true,event:pub(e),guest:x?x.g:null}},
  rsvReply:function(d,s){var x=byGuest(s,d.g),e,g;if(x){e=x.e;g=x.g}else{e=find(s,d.e);g={key:'g'+K.uid().slice(-5),name:d.name,max_party:e.open_max,rsvp:'pending',party:0,message:'',checked_in_at:''};e.guests.push(g)}
   if(g.rsvp==='yes'||g.rsvp==='no')return{ok:false,error:'locked',guest:g};g.rsvp=d.rsvp;g.party=Math.min(+d.party||0,+g.max_party||1);g.message=d.message||'';return{ok:true,guest:g,event:pub(e)}},
  rsvMessage:function(d,s){var x=byGuest(s,d.g);if(!x)return{ok:false};x.g.message=d.text;return{ok:true,guest:x.g}},
  rsvTicket:function(d,s){var x=byGuest(s,parseCode(d.t));if(!x)return{ok:false,error:'not_found'};return{ok:true,role:'host',event:pub(x.e),guest:x.g,door:counts(x.e)}},
  rsvDoor:function(d,s){var e=find(s,d.key)||find(s,String(d.key).split('-')[0]);if(!e)return{ok:false,error:'forbidden'};
   return{ok:true,role:'host',event:pub(e),door:counts(e),recent:e.guests.filter(function(g){return g.checked_in_at}).map(function(g){return{name:g.name,party:g.party,at:g.checked_in_at}})}},
  rsvCheckin:function(d,s){var e=find(s,d.key),code=String(parseCode(d.code)).toLowerCase(),g=e.guests.filter(function(x){return x.key===code})[0],base={event:pub(e)};
   if(!g)return{ok:false,error:'not_found'};if(g.rsvp!=='yes')return Object.assign(base,{ok:false,error:'not_attending',guest:g});if(g.checked_in_at)return Object.assign(base,{ok:true,result:'already',guest:g,door:counts(e)});
   var p=pub(e);if(p.checkin_opens_at&&new Date(p.checkin_opens_at)>Date.now())return Object.assign(base,{ok:true,result:'early',guest:g,opens_at:p.checkin_opens_at,starts_at:p.starts_at,door:counts(e)});
   g.checked_in_at=new Date().toISOString();return Object.assign(base,{ok:true,result:'in',guest:g,door:counts(e)})}
 }
});
function loadInvite(){R.inv=null;R.msgOk=false;K.render();api('rsvInvite',{e:EKEY,g:GKEY}).then(function(r){R.inv=r;if(r.ok&&r.guest){R.reply={rsvp:r.guest.rsvp==='pending'||r.guest.rsvp==='maybe'?'yes':r.guest.rsvp,party:Math.max(1,+r.guest.party||1),name:r.guest.name||'',msg:''}}
  else if(r.ok)R.reply.name=(K.TGU&&[K.TGU.first_name,K.TGU.last_name].filter(Boolean).join(' '))||'';K.render()})}
function doorScreen(e,role){var d=R.door,h=K.header(role==='staff'?t('door_for'):t('checkin'),e.title);
 h+=doorCard(R.scan&&R.scan.door||(d&&d.door));
 if(e.checkin_opens_at&&new Date(e.checkin_opens_at)>Date.now())h+='<div class="banner">'+ic('clock','s')+'<span>'+esc(opensLine(e))+' · '+esc(inTime(e.checkin_opens_at))+'</span></div>';
 h+=resultCard(R.scan,e);
 h+='<button class="btn" data-a="scan" style="padding:18px">'+ic('scan','l')+(R.scan?t('scan_next'):t('scan'))+'</button><div class="card" style="margin-top:12px"><label class="f">'+t('manual')+'</label><div class="row"><input class="t" id="code" autocomplete="off" style="text-transform:uppercase"><button class="btn sm" data-a="manual">'+t('check')+'</button></div></div>';
 var rec=d&&d.recent||[],tz=tzOf(e);if(rec.length)h+='<div class="sec">'+t('recent')+'</div><div class="card"><ul class="lst">'+rec.map(function(x){return'<li><span>'+esc(x.name)+(plus(x.party)?' <span class="pill ac">'+plus(x.party)+'</span>':'')+'</span><span class="fs">'+clockIn(x.at,tz)+'</span></li>'}).join('')+'</ul></div>';
 return h}
function confirmBox(msg,cb){if(K.IN_TG&&K.TG.showConfirm)K.TG.showConfirm(msg,function(ok){if(ok)cb()});else if(confirm(msg))cb()}
function find(s,k){return s.app.events.filter(function(e){return e.key===k})[0]}
function byGuest(s,k){var out=null;if(!k)return null;s.app.events.forEach(function(e){e.guests.forEach(function(g){if(g.key===k)out={e:e,g:g}})});return out}
function pub(e){var o=Object.assign({},e);delete o.guests;delete o.staff;var tz=tzOf(e),st=zoned(e.date,e.time,tz),b=e.checkin_before===undefined||e.checkin_before===''?3:+e.checkin_before;
 o.tz=tz;o.checkin_before=b;o.starts_at=st?st.toISOString():'';o.checkin_opens_at=st&&b<999?new Date(st.getTime()-b*36e5).toISOString():'';o.replies_closed=false;return o}
function counts(e){var r={expected:0,arrived:0,tickets:0};(e.guests||[]).forEach(function(g){if(g.rsvp==='yes')r.expected+=+g.party||0;if(g.checked_in_at){r.arrived+=+g.party||1;r.tickets++}});return r}
function stats(e){var r={yes:0,yesPeople:0,no:0,maybe:0,pending:0,checked:0};(e.guests||[]).forEach(function(g){r[g.rsvp]=(r[g.rsvp]||0)+1;if(g.rsvp==='yes')r.yesPeople+=+g.party||0;if(g.checked_in_at)r.checked+=+g.party||1});return r}
function full(e){return Object.assign(pub(e),{guests:e.guests,stats:stats(e),staff:e.staff||''})}
function keepForm(){var n=document.getElementById('gname'),m=document.getElementById('gmsg');if(n)R.reply.name=n.value.trim();if(m)R.reply.msg=m.value.trim()}
function readEditor(){document.querySelectorAll('[data-f]').forEach(function(el){R.edit[el.dataset.f]=el.type==='number'||el.dataset.f==='checkin_before'?+el.value:el.value.trim()})}
function save(andPublish){readEditor();var e=R.edit;if(!e.title||!e.date){S.err=t('title')+' · '+t('date');return K.render()}
 api('rsvSave',{event:e}).then(function(r){if(!r.ok){S.err=r.error==='date'?t('e_date'):t('e_gen');return K.render()}R.ev=r.event;R.edit.key=r.event.key;if(andPublish)publish(r.event.key,true);else{S.stack.pop();S.screen='event';S.msg=t('saved');K.render()}})}
function publish(key,fromEditor){api('rsvPublish',{key:key}).then(function(r){
 if(r.ok&&!r.allowed)return K.paywall({title:t('publish'),text:t('publish_hint'),icon:'calendar',features:[t('guests'),t('checkin'),'QR'],after:function(){K.S.stack=['home'];K.S.screen='event';K.render()}});
 if(!r.ok){S.err=t('e_gen');return K.render()}R.ev=r.event;if(r.access)S.me.access=r.access;K.refreshMe();if(fromEditor)S.stack.pop();S.screen='event';S.msg=t('live');K.haptic('ok');K.render()})}
function checkin(code){var key=doorKey()||(R.tk&&R.tk.event&&R.tk.event.key);api('rsvCheckin',{key:key,code:code,staff:STAFF}).then(function(r){R.scan=r;
 if(r.ok&&r.result==='in'&&R.door&&R.door.ok!==false){R.door.recent=[{name:r.guest.name,party:r.guest.party,at:r.guest.checked_in_at}].concat(R.door.recent||[]).slice(0,8)}
 K.haptic(r.ok&&r.result==='in'?'ok':'');K.render()})}
})();
</script>
