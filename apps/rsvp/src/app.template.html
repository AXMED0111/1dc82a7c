%%KIT%%
<script>
(function(){
var t=K.t,esc=K.esc,ic=K.ic,S=K.S,api=K.api;
var EKEY=K.param('e'),GKEY=K.param('g');
var R={events:null,ev:null,edit:null,inv:null,ticket:null,scan:null,reply:{rsvp:'yes',party:1,name:'',msg:''}};
function fmtWhen(e){var d=e.date?new Date(e.date+'T'+(e.time||'00:00')):null;if(!d||isNaN(d))return e.date||'';
  try{return d.toLocaleDateString(K.lang()==='so'?'so-SO':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(e.time?' · '+e.time:'')}catch(x){return e.date+' '+(e.time||'')}}
function qrSvg(text){try{var q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return''}}
function blank(){return{key:'',title:'',hosts:'',date:'',time:'',venue:'',address:'',map_url:'',notes:'',dress:'',deadline:'',open_max:4,status:'draft'}}
function inviteText(e,link){return(K.lang()==='so'?'Waxaa lagugu martiqaaday: ':'You are invited: ')+e.title+'\n'+fmtWhen(e)+(e.venue?'\n'+e.venue:'')+'\n'+link}

K.app({
 icon:'calendar',freeLabel:'Free events (total)',
 defaults:{appName:'Invitations',freeAllowance:1,plans:[{id:'event1',label:'One event',days:0,credits:1,usd:5,stars:350,region:'ALL'},{id:'event5',label:'5 events',days:0,credits:5,usd:15,stars:1000,region:'ALL'},{id:'pro_m',label:'Unlimited · 1 month',days:30,credits:0,usd:15,stars:1000,region:'ALL'}]},
 startScreen:function(){return EKEY||GKEY?'invite':'home'},
 strings:{
 en:{appName:'Invitations',tagline:'Weddings and events, RSVPs and door check-in',my_events:'My events',create:'Create event',no_events:'No events yet. Create your first invitation in a minute.',
  draft:'Draft',live:'Published',title:'Event title',title_ph:'Wedding of Amina & Yusuf',hosts:'Hosted by',date:'Date',time:'Time',venue:'Venue',address:'Address',map:'Map link (optional)',
  notes:'Message to guests',dress:'Dress code (optional)',deadline:'Reply by (optional)',open_max:'Max people per open-link reply',save_draft:'Save draft',publish:'Publish',publish_hint:'Publishing uses 1 event credit.',
  attending:'Attending',declined:'Declined',pending:'No reply',checked:'Checked in',guests:'Guests',checkin:'Check-in',open_link:'Open invitation link',open_link_sub:'Anyone with this link can reply. For a guest list, add guests and send each one a personal link.',
  add_guests:'Add guests',add_guests_ph:'One guest per line, e.g.\nAmina Ali, 3\nYusuf Omar',add_guests_hint:'Optional: add a comma and the number of people allowed.',add:'Add',
  personal:'Personal link',whatsapp:'WhatsApp',telegram:'Telegram',people:'{n} people',
  scan:'Scan ticket QR',manual:'Or enter ticket code',check:'Check in',ok_in:'Welcome — checked in',already:'Already checked in at {t}',bad_code:'Ticket not found for this event.',not_attending:'This guest did not confirm attendance.',
  you_invited:'You are invited',reply:'Your reply',yes:'Attending',no:'Can\'t attend',maybe:'Maybe',party:'Number of people',your_name:'Your name',message:'Message to the hosts (optional)',send_reply:'Send reply',
  thanks_yes:'Thank you. Your reply is saved. Show this ticket at the entrance.',thanks_no:'Thank you for letting the hosts know.',ticket:'Your ticket',code:'Ticket code',change:'Change reply',directions:'Directions',
  not_found:'This invitation is not available.',reply_by:'Please reply by {d}',edit_event:'Edit event',delete_guest:'Remove',guest_pdf:'Guest list PDF',name:'Name',reply_l:'Reply',people_l:'People',checked_l:'Checked in',message_l:'Message',total_people:'Total people attending'},
 so:{appName:'Casuumado',tagline:'Arooska iyo munaasabadaha, jawaabaha iyo hubinta albaabka',my_events:'Munaasabadahayga',create:'Samee munaasabad',no_events:'Weli munaasabad ma jirto. Samee casuumaddaada ugu horreysa hal daqiiqo gudaheed.',
  draft:'Qabyo',live:'La daabacay',title:'Magaca munaasabadda',title_ph:'Aroosga Aamina & Yuusuf',hosts:'Martigeliyayaasha',date:'Taariikhda',time:'Waqtiga',venue:'Goobta',address:'Cinwaanka',map:'Link khariidad (ikhtiyaari)',
  notes:'Fariin martida',dress:'Labiska (ikhtiyaari)',deadline:'Jawaab ka hor (ikhtiyaari)',open_max:'Tirada ugu badan ee dadka jawaabtii link-ga furan',save_draft:'Keydi qabyo',publish:'Daabac',publish_hint:'Daabacaaddu waxay isticmaashaa 1 dhibic munaasabad.',
  attending:'Imanaya',declined:'Diiday',pending:'Jawaab la\'aan',checked:'Soo galay',guests:'Martida',checkin:'Hubinta albaabka',open_link:'Link casuumad furan',open_link_sub:'Qof kasta oo haysta link-gan wuu jawaabi karaa. Liis martida, ku dar martida oo mid walba u dir link gaar ah.',
  add_guests:'Ku dar marti',add_guests_ph:'Marti kasta hal sadar, tusaale\nAamina Cali, 3\nYuusuf Cumar',add_guests_hint:'Ikhtiyaari: ku dar hakad iyo tirada dadka loo oggol yahay.',add:'Ku dar',
  personal:'Link gaar ah',whatsapp:'WhatsApp',telegram:'Telegram',people:'{n} qof',
  scan:'Iskaan QR-ka tigidhka',manual:'Ama geli koodhka tigidhka',check:'Hubi',ok_in:'Soo dhawoow — waa la hubiyay',already:'Horey ayaa loo hubiyay {t}',bad_code:'Tigidhkan lagama helin munaasabaddan.',not_attending:'Martidan ma xaqiijin imaanshaha.',
  you_invited:'Waa lagu martiqaaday',reply:'Jawaabtaada',yes:'Waan imanayaa',no:'Ma imaan karo',maybe:'Laga yaabee',party:'Tirada dadka',your_name:'Magacaaga',message:'Fariin martigeliyayaasha (ikhtiyaari)',send_reply:'Dir jawaabta',
  thanks_yes:'Mahadsanid. Jawaabtaada waa la keydiyay. Tigidhkan ku tus albaabka.',thanks_no:'Mahadsanid in aad ogeysiisay martigeliyayaasha.',ticket:'Tigidhkaaga',code:'Koodhka tigidhka',change:'Beddel jawaabta',directions:'Tilmaamaha',
  not_found:'Casuumaddan lama heli karo.',reply_by:'Fadlan jawaab ka hor {d}',edit_event:'Wax ka beddel',delete_guest:'Ka saar',guest_pdf:'Liiska martida PDF',name:'Magaca',reply_l:'Jawaab',people_l:'Dad',checked_l:'Soo galay',message_l:'Fariin',total_people:'Wadarta dadka imanaya'}},
 enter:{
  home:function(){R.events=null;api('rsvMine').then(function(r){R.events=r.ok?r.events:[];K.render()})},
  event:function(){api('rsvEvent',{key:R.ev.key}).then(function(r){if(r.ok)R.ev=r.event;K.render()})},
  invite:function(){R.inv=null;api('rsvInvite',{e:EKEY,g:GKEY}).then(function(r){R.inv=r;if(r.ok&&r.guest){R.reply={rsvp:r.guest.rsvp==='pending'?'yes':r.guest.rsvp,party:Math.max(1,+r.guest.party||1),name:r.guest.name||'',msg:r.guest.message||''}}
    else if(r.ok)R.reply.name=(K.TGU&&[K.TGU.first_name,K.TGU.last_name].filter(Boolean).join(' '))||'';K.render()})}
 },
 screens:{
  home:function(){var h=K.header(t('appName'),t('tagline'))+'<div class="row" style="margin:-4px 0 12px">'+K.planChip()+'</div>'+K.banners();
   if(!R.events)return h+K.spin();
   if(!R.events.length)h+=K.empty('calendar',t('no_events'));
   R.events.forEach(function(e){h+='<button class="chrow" data-a="open" data-key="'+esc(e.key)+'"><div class="av">'+ic('calendar')+'</div><div class="grow"><div class="fn">'+esc(e.title)+'</div><div class="fs">'+esc(fmtWhen(e))+'</div><div>'+
     '<span class="pill '+(e.status==='published'?'ok':'')+'">'+t(e.status==='published'?'live':'draft')+'</span><span class="pill">'+t('attending')+': '+(e.stats?e.stats.yesPeople:0)+'</span></div></div></button>'});
   return h+'<button class="btn" data-a="new">'+ic('plus')+t('create')+'</button>'},
  editor:function(){var e=R.edit,h=K.header(e.key?t('edit_event'):t('create'),'');
   function f(k,ty,ph){return'<label class="f">'+t(k)+'</label><input class="t" data-f="'+k+'" type="'+(ty||'text')+'" value="'+esc(e[k])+'" placeholder="'+esc(ph||'')+'">'}
   h+='<div class="card">'+f('title','text',t('title_ph'))+f('hosts')+'<div class="g2"><div>'+f('date','date')+'</div><div>'+f('time','time')+'</div></div>'+f('venue')+f('address')+f('map_url','url','https://maps.google.com/…').replace('>'+t('map_url')+'<','>'+t('map')+'<')+
     '<label class="f">'+t('notes')+'</label><textarea class="t" data-f="notes" maxlength="600">'+esc(e.notes)+'</textarea>'+f('dress')+'<div class="g2"><div>'+f('deadline','date')+'</div><div>'+f('open_max','number')+'</div></div></div>';
   h+='<button class="btn sec2" data-a="savedraft">'+ic('check')+t('save_draft')+'</button>';
   if(e.status!=='published')h+='<button class="btn" data-a="publish">'+ic('send')+t('publish')+'</button><div class="fs center" style="margin-top:6px">'+t('publish_hint')+'</div>';
   return h+K.errBox()},
  event:function(){var e=R.ev,s=e.stats||{},link=K.appLink('e_'+e.key),h=K.header(e.title,fmtWhen(e))+K.errBox();
   h+='<div class="card stat"><div><b>'+(s.yesPeople||0)+'</b><span>'+t('attending')+' ('+t('people',{n:s.yes||0}).replace(/^\d+ /,'')+')</span></div><div><b>'+(s.no||0)+'</b><span>'+t('declined')+'</span></div><div><b>'+(s.pending||0)+'</b><span>'+t('pending')+'</span></div><div><b>'+(s.checked||0)+'</b><span>'+t('checked')+'</span></div></div>';
   if(e.status!=='published')h+='<div class="banner">'+ic('info','s')+'<span>'+t('draft')+' — '+t('publish_hint')+'</span></div><button class="btn" data-a="publish">'+ic('send')+t('publish')+'</button>';
   else h+='<div class="sec">'+t('open_link')+'</div><div class="card">'+K.kv(t('open_link'),link,true)+'<p class="m">'+t('open_link_sub')+'</p><div class="g2" style="margin-top:10px"><button class="btn sm sec2" data-a="sharetg" data-link="'+esc(link)+'">'+ic('send','s')+t('telegram')+'</button><button class="btn sm sec2" data-a="sharewa" data-link="'+esc(link)+'">'+ic('message','s')+t('whatsapp')+'</button></div></div>';
   h+='<div class="g2"><button class="btn" data-a="guests">'+ic('users')+t('guests')+'</button><button class="btn" data-a="checkin">'+ic('scan')+t('checkin')+'</button></div>'+(e.status==='published'?'<button class="btn sec2" data-a="guestpdf">'+ic('file')+t('guest_pdf')+'</button>':'')+'<button class="btn ghost" data-a="edit">'+ic('edit')+t('edit_event')+'</button>';
   return h},
  guests:function(){var e=R.ev,h=K.header(t('guests'),e.title);
   h+='<div class="card"><label class="f">'+t('add_guests')+'</label><textarea class="t" id="bulk" placeholder="'+esc(t('add_guests_ph'))+'"></textarea><div class="fs" style="margin:6px 0 10px">'+t('add_guests_hint')+'</div><button class="btn sm" data-a="addguests">'+ic('plus','s')+t('add')+'</button></div>';
   (e.guests||[]).forEach(function(g){var link=K.appLink('g_'+g.key),cls=g.rsvp==='yes'?'ok':g.rsvp==='no'?'bad':'';
     h+='<div class="card" style="padding:12px"><div class="row"><div class="grow"><div class="fn">'+esc(g.name)+'</div><div><span class="pill '+cls+'">'+t(g.rsvp==='pending'?'pending':g.rsvp==='yes'?'attending':g.rsvp==='no'?'declined':'maybe')+(g.rsvp==='yes'?' · '+t('people',{n:g.party}):'')+'</span>'+(g.checked_in_at?'<span class="pill ac">'+t('checked')+'</span>':'')+'</div>'+(g.message?'<div class="fs">“'+esc(g.message)+'”</div>':'')+'</div>'+
       '<button class="mini" data-copy="'+esc(link)+'">'+ic('copy')+'</button><button class="mini" data-a="sharetg" data-link="'+esc(link)+'">'+ic('send')+'</button><button class="mini" data-a="sharewa" data-link="'+esc(link)+'">'+ic('message')+'</button><button class="mini" data-a="delguest" data-key="'+esc(g.key)+'">'+ic('trash')+'</button></div></div>'});
   return h},
  checkin:function(){var h=K.header(t('checkin'),R.ev.title),r=R.scan;
   h+='<button class="btn" data-a="scan" style="padding:18px">'+ic('scan','l')+t('scan')+'</button><div class="card" style="margin-top:12px"><label class="f">'+t('manual')+'</label><div class="row"><input class="t" id="code" autocomplete="off" style="text-transform:uppercase"><button class="btn sm" data-a="manual">'+t('check')+'</button></div></div>';
   if(r){var ok=r.ok&&r.result==='in',warn=r.ok&&r.result==='already';
     h+='<div class="card center"><div class="big '+(ok?'good':'')+'" style="'+(ok||warn?'':'color:var(--danger)')+'">'+ic(ok?'check':'alert','l')+'</div><h2>'+esc(r.guest?r.guest.name:'')+'</h2><p class="m">'+
       (ok?t('ok_in')+' · '+t('people',{n:r.guest.party}):warn?t('already',{t:new Date(r.guest.checked_in_at).toLocaleTimeString()}):r.error==='not_attending'?t('not_attending'):t('bad_code'))+'</p></div>'}
   return h},
  invite:function(){var v=R.inv;if(!v)return K.header(t('you_invited'),'')+K.spin();
   if(!v.ok)return K.header(t('you_invited'),'')+K.empty('alert',t('not_found'));
   var e=v.event,g=v.guest,h=K.header(t('you_invited'),'')+(K.DEMO?K.banners():'');
   h+='<div class="inv"><div class="eyebrow">'+t('you_invited')+'</div><h2>'+esc(e.title)+'</h2>'+(e.hosts?'<div class="m">'+esc(e.hosts)+'</div>':'')+'<div class="line"></div>'+
     '<div style="font-weight:600">'+esc(fmtWhen(e))+'</div>'+(e.venue?'<div class="m" style="margin-top:4px">'+esc(e.venue)+(e.address?' · '+esc(e.address):'')+'</div>':'')+
     (e.notes?'<p class="m" style="margin-top:14px;white-space:pre-line">'+esc(e.notes)+'</p>':'')+(e.dress?'<div class="pill ac" style="margin-top:10px">'+esc(e.dress)+'</div>':'')+
     (e.map_url?'<div style="margin-top:14px"><button class="btn sm ghost" data-open="'+esc(e.map_url)+'">'+ic('pin','s')+t('directions')+'</button></div>':'')+'</div>';
   if(g&&g.rsvp!=='pending'&&!R.changing){
     if(g.rsvp==='yes')h+='<div class="card center"><div class="sec" style="margin-top:0">'+t('ticket')+'</div><div class="qrbox">'+qrSvg('RSVP:'+g.key)+'</div><p class="m" style="margin-top:10px">'+t('thanks_yes')+'</p>'+K.kv(t('code'),g.key.toUpperCase())+'<div class="fs">'+esc(g.name)+' · '+t('people',{n:g.party})+'</div></div>';
     else h+='<div class="card center"><p class="m">'+(g.rsvp==='no'?t('thanks_no'):t('maybe'))+'</p></div>';
     return h+'<button class="btn ghost" data-a="change">'+ic('edit')+t('change')+'</button>'}
   var rp=R.reply,max=g?Math.max(1,+g.max_party||1):Math.max(1,+e.open_max||1);
   h+='<div class="sec">'+t('reply')+(e.deadline?' · '+t('reply_by',{d:e.deadline}):'')+'</div><div class="card">'+K.seg('rsvp',rp.rsvp,[['yes',t('yes')],['maybe',t('maybe')],['no',t('no')]])+
     (g?'':'<label class="f">'+t('your_name')+'</label><input class="t" id="gname" value="'+esc(rp.name)+'">')+
     (rp.rsvp!=='no'?'<label class="f">'+t('party')+'</label><div class="stepper"><button data-a="minus">−</button><b>'+rp.party+'</b><button data-a="plus" '+(rp.party>=max?'disabled':'')+'>+</button><span class="fs">max '+max+'</span></div>':'')+
     '<label class="f">'+t('message')+'</label><textarea class="t" id="gmsg" maxlength="300">'+esc(rp.msg)+'</textarea></div><button class="btn" data-a="reply">'+ic('send')+t('send_reply')+'</button>';
   return h+K.errBox()}
 },
 onSeg:function(n,v){if(n==='rsvp'){keepForm();R.reply.rsvp=v;K.render()}},
 actions:{
  new:function(){R.edit=blank();K.go('editor')},
  open:function(el,d){R.ev=(R.events||[]).filter(function(e){return e.key===d.key})[0];K.go('event')},
  edit:function(){R.edit=JSON.parse(JSON.stringify(R.ev));delete R.edit.guests;delete R.edit.stats;K.go('editor')},
  savedraft:function(){save(false)},
  publish:function(){if(S.screen==='editor')save(true);else publish(R.ev.key)},
  guests:function(){K.go('guests')},
  guestpdf:function(){var e=R.ev,s=e.stats||{},order={yes:0,maybe:1,pending:2,no:3};var gs=(e.guests||[]).slice().sort(function(a,b){return order[a.rsvp]-order[b.rsvp]||a.name.localeCompare(b.name)});
   K.showReport({brand:t('appName'),title:e.title,subtitle:fmtWhen(e)+(e.venue?' · '+e.venue:''),meta:e.hosts?[[t('hosts'),e.hosts]]:[],
    blocks:[{kpis:[[t('attending'),s.yesPeople||0,'good'],[t('declined'),s.no||0],[t('pending'),s.pending||0],[t('checked'),s.checked||0]]},{h:t('guests')+' ('+gs.length+')'},
     {table:{cols:[{label:t('name'),w:2.2},{label:t('reply_l'),w:1.3},{label:t('people_l'),w:0.8,align:'right'},{label:t('checked_l'),w:1.1},{label:t('message_l'),w:2.6}],
      rows:gs.map(function(g){return[g.name,{v:t(g.rsvp==='pending'?'pending':g.rsvp==='yes'?'attending':g.rsvp==='no'?'declined':'maybe'),tone:g.rsvp==='yes'?'good':g.rsvp==='no'?'bad':null},g.rsvp==='yes'?g.party:'',g.checked_in_at?new Date(g.checked_in_at).toISOString().slice(11,16):'',g.message||'']}),
      total:[t('total_people'),'',s.yesPeople||0,'','']}}]},(e.title.replace(/[^\w\- ]+/g,'')||'event')+' guests.pdf')},
  checkin:function(){R.scan=null;K.go('checkin')},
  addguests:function(){var lines=document.getElementById('bulk').value.split('\n').map(function(l){var p=l.split(',');return{name:p[0].trim(),max:Math.max(1,parseInt(p[1],10)||1)}}).filter(function(x){return x.name});
   if(!lines.length)return;api('rsvGuestAdd',{key:R.ev.key,guests:lines}).then(function(r){if(r.ok){R.ev=r.event;K.render()}else K.toast(t('e_gen'))})},
  delguest:function(el,d){api('rsvGuestDel',{key:R.ev.key,guest:d.key}).then(function(r){if(r.ok){R.ev=r.event;K.render()}})},
  sharetg:function(el,d){K.shareTg(d.link,inviteText(R.ev,'').trim())},
  sharewa:function(el,d){K.openLink('https://wa.me/?text='+encodeURIComponent(inviteText(R.ev,d.link)))},
  scan:function(){if(K.IN_TG&&K.TG.showScanQrPopup){K.TG.showScanQrPopup({text:t('scan')},function(txt){var m=/^RSVP:(\w+)$/.exec(txt||'');if(m){checkin(m[1]);return true}});return}
   var c=prompt(t('manual'));if(c)checkin(c.trim())},
  manual:function(){var c=document.getElementById('code').value.trim();if(c)checkin(c)},
  minus:function(){keepForm();R.reply.party=Math.max(1,R.reply.party-1);K.render()},
  plus:function(){keepForm();R.reply.party++;K.render()},
  change:function(){R.changing=true;K.render()},
  reply:function(){keepForm();var rp=R.reply;if(!R.inv.guest&&!rp.name){S.err=t('your_name');return K.render()}
   api('rsvReply',{e:EKEY,g:GKEY||(R.inv.guest&&R.inv.guest.key),rsvp:rp.rsvp,party:rp.rsvp==='no'?0:rp.party,name:rp.name,message:rp.msg}).then(function(r){
    if(r.ok){R.changing=false;R.inv.guest=r.guest;if(!GKEY)GKEY=r.guest.key;K.haptic('ok');S.err=''}else S.err=t('e_gen');K.render()})}
 },
 demoSeed:function(){var d=new Date(Date.now()+20*864e5).toISOString().slice(0,10);
  return{events:[{key:'demoev',owner:'me',title:'Wedding of Amina & Yusuf',hosts:'The Ali and Omar families',date:d,time:'18:00',venue:'Grand Hall',address:'Main Road',map_url:'',notes:'We would be honoured to celebrate this day with you.',dress:'Formal',deadline:'',open_max:4,status:'published',
   guests:[{key:'g7k2m9',name:'Hodan Ahmed',max_party:2,rsvp:'yes',party:2,message:'Congratulations!',checked_in_at:''},{key:'g3p8x1',name:'Abdi Hassan',max_party:3,rsvp:'pending',party:0,message:'',checked_in_at:''}]}]}},
 demo:{
  rsvMine:function(d,s){return{ok:true,events:s.app.events.map(function(e){return Object.assign({},e,{stats:stats(e)})})}},
  rsvSave:function(d,s){var e=d.event,ex=s.app.events.filter(function(x){return x.key===e.key})[0];if(ex){Object.assign(ex,e)}else{e.key='e'+K.uid().slice(-6);e.guests=[];e.status='draft';s.app.events.unshift(e);ex=e}return{ok:true,event:full(ex)}},
  rsvPublish:function(d,s){var e=find(s,d.key),a=K.S.me.access;if(!a.entitled)return{ok:true,allowed:false};
   var acc=s.settings.testMode&&!d.simulateFree?'test':(s.freeUsed<s.settings.freeAllowance?'free':s.credits>0?'credits':s.sub&&new Date(s.sub.expiry)>new Date()?'sub':'');
   if(!acc)return{ok:true,allowed:false};if(acc==='free')s.freeUsed++;if(acc==='credits')s.credits--;e.status='published';return{ok:true,allowed:true,event:full(e)}},
  rsvEvent:function(d,s){return{ok:true,event:full(find(s,d.key))}},
  rsvGuestAdd:function(d,s){var e=find(s,d.key);d.guests.forEach(function(g){e.guests.push({key:'g'+K.uid().slice(-5),name:g.name,max_party:g.max,rsvp:'pending',party:0,message:'',checked_in_at:''})});return{ok:true,event:full(e)}},
  rsvGuestDel:function(d,s){var e=find(s,d.key);e.guests=e.guests.filter(function(g){return g.key!==d.guest});return{ok:true,event:full(e)}},
  rsvInvite:function(d,s){var e,g;if(d.g){s.app.events.forEach(function(x){x.guests.forEach(function(y){if(y.key===d.g){e=x;g=y}})})}else e=find(s,d.e);
   if(!e||e.status!=='published')return{ok:false,error:'not_found'};var pub=Object.assign({},e);delete pub.guests;return{ok:true,event:pub,guest:g||null}},
  rsvReply:function(d,s){var e,g;s.app.events.forEach(function(x){x.guests.forEach(function(y){if(d.g&&y.key===d.g){e=x;g=y}})});
   if(!g){e=find(s,d.e);g={key:'g'+K.uid().slice(-5),name:d.name,max_party:e.open_max,rsvp:'pending',party:0,message:'',checked_in_at:''};e.guests.push(g)}
   g.rsvp=d.rsvp;g.party=Math.min(+d.party||0,+g.max_party||1);g.message=d.message||'';if(d.name&&!d.g)g.name=d.name;return{ok:true,guest:g}},
  rsvCheckin:function(d,s){var e=find(s,d.key),code=String(d.code).toLowerCase(),g=e.guests.filter(function(x){return x.key===code})[0];
   if(!g)return{ok:false,error:'not_found'};if(g.rsvp!=='yes')return{ok:false,error:'not_attending',guest:g};if(g.checked_in_at)return{ok:true,result:'already',guest:g};
   g.checked_in_at=new Date().toISOString();return{ok:true,result:'in',guest:g}}
 }
});
function find(s,k){return s.app.events.filter(function(e){return e.key===k})[0]}
function stats(e){var r={yes:0,yesPeople:0,no:0,maybe:0,pending:0,checked:0};(e.guests||[]).forEach(function(g){r[g.rsvp]=(r[g.rsvp]||0)+1;if(g.rsvp==='yes')r.yesPeople+=+g.party||0;if(g.checked_in_at)r.checked+=+g.party||1});return r}
function full(e){return Object.assign({},e,{stats:stats(e)})}
function keepForm(){var n=document.getElementById('gname'),m=document.getElementById('gmsg');if(n)R.reply.name=n.value.trim();if(m)R.reply.msg=m.value.trim()}
function readEditor(){document.querySelectorAll('[data-f]').forEach(function(el){R.edit[el.dataset.f]=el.type==='number'?+el.value:el.value.trim()})}
function save(andPublish){readEditor();var e=R.edit;if(!e.title||!e.date){S.err=t('title')+' · '+t('date');return K.render()}
 api('rsvSave',{event:e}).then(function(r){if(!r.ok){S.err=t('e_gen');return K.render()}R.ev=r.event;R.edit.key=r.event.key;if(andPublish)publish(r.event.key,true);else{S.stack.pop();S.screen='event';S.msg=t('saved');K.render()}})}
function publish(key,fromEditor){api('rsvPublish',{key:key}).then(function(r){
 if(r.ok&&!r.allowed)return K.paywall({title:t('publish'),text:t('publish_hint'),icon:'calendar',features:[t('guests'),t('checkin'),'QR'],after:function(){K.S.stack=['home'];K.S.screen='event';K.render()}});
 if(!r.ok){S.err=t('e_gen');return K.render()}R.ev=r.event;if(r.access)S.me.access=r.access;K.refreshMe();if(fromEditor)S.stack.pop();S.screen='event';S.msg=t('live');K.haptic('ok');K.render()})}
function checkin(code){api('rsvCheckin',{key:R.ev.key,code:code}).then(function(r){R.scan=r;K.haptic(r.ok&&r.result==='in'?'ok':'');K.render()})}
})();
</script>
