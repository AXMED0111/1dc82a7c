<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Field Tasks</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#f2f4f7);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#ffffff));
  --text:var(--tg-theme-text-color,#101828);
  --hint:var(--tg-theme-hint-color,#667085);
  --accent:var(--tg-theme-button-color,#2457d6);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
  --link:var(--tg-theme-link-color,#2457d6);
  --sep:var(--tg-theme-section-separator-color,rgba(128,128,128,.2));
  --danger:var(--tg-theme-destructive-text-color,#d92d20);
  --ok:#12b76a;
  --soft:color-mix(in srgb,var(--accent) 10%,transparent);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:var(--tg-theme-secondary-bg-color,#0e1116);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#171b22));
  --text:var(--tg-theme-text-color,#e6e9ef);
  --hint:var(--tg-theme-hint-color,#8b93a1);
  --accent:var(--tg-theme-button-color,#4c7cf0);
  --link:var(--tg-theme-link-color,#6f97f5);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;flex:none}
.top h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--hint)}
.grow{flex:1;min-width:0}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--sep);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.lang{display:flex;border:1px solid var(--sep);border-radius:10px;overflow:hidden;background:var(--card);flex:none}
.lang button{border:0;background:none;padding:7px 10px;font-size:12px;font-weight:650;color:var(--hint);cursor:pointer}
.lang button.on{background:var(--accent);color:var(--accent-text)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}svg.i.l{width:26px;height:26px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--accent);border:0;cursor:pointer}
.chip.warn{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.chip.good{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 12px;border:1px solid var(--sep)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tool{background:var(--card);border:1px solid var(--sep);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:128px}
.tool:active{transform:scale(.985)}
.tool .ic{width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.tool b{font-size:14.5px;font-weight:650}
.tool span{font-size:12.5px;color:var(--hint);line-height:1.35}
.tool.dis{opacity:.55;cursor:default}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);border:1px solid var(--sep);border-radius:6px;padding:2px 6px;align-self:flex-start}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--hint);margin:18px 4px 8px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--hint);padding:4px 4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:13px 16px;font-weight:650;background:var(--accent);color:var(--accent-text);cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec2{background:var(--soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--sep)}
.btn.sm{padding:9px 12px;font-size:13.5px;width:auto}
.btn+.btn{margin-top:8px}
.row{display:flex;gap:8px;align-items:center}
.drop{border:1.5px dashed var(--sep);border-radius:var(--r);padding:26px 16px;text-align:center;cursor:pointer;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.drop .ic{width:48px;height:48px;border-radius:14px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.drop small{color:var(--hint)}
.files{list-style:none;margin:0;padding:0}
.files li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep)}
.files li:last-child{border-bottom:0}
.thumb{width:40px;height:40px;border-radius:8px;background:var(--soft);color:var(--accent);display:grid;place-items:center;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.fn{font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs{font-size:12px;color:var(--hint)}
.mini{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--hint);display:grid;place-items:center;cursor:pointer;flex:none}
.mini:disabled{opacity:.3}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--hint);margin:12px 0 6px}
label.f:first-child{margin-top:0}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--hint);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--sep);background:var(--bg);border-radius:10px;padding:10px 12px;outline:none}
input.t:focus,select.t:focus{border-color:var(--accent)}
.opt{display:flex;flex-direction:column;gap:6px}
.radio{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--sep);border-radius:12px;cursor:pointer;background:var(--card)}
.radio.on{border-color:var(--accent);background:var(--soft)}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--hint);flex:none;display:grid;place-items:center}
.radio.on .dot{border-color:var(--accent)}
.radio.on .dot:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.bar{height:6px;border-radius:6px;background:var(--bg);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.err{color:var(--danger);font-size:13px;display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.okmsg{color:var(--ok);font-size:13px;display:flex;gap:8px;align-items:center;margin-top:10px}
.center{text-align:center}
.big{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:4px auto 10px;background:var(--soft);color:var(--accent)}
.big.good{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
h2{font-size:17px;margin:0 0 4px;font-weight:650}
p.m{margin:0;color:var(--hint);font-size:13.5px}
.feat{list-style:none;padding:0;margin:12px 0 0}
.feat li{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.feat svg{color:var(--ok)}
.price{font-weight:700;margin-left:auto;text-align:right;font-size:14px}
.price small{display:block;font-weight:500;color:var(--hint);font-size:11.5px}
.kv{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--sep);border-radius:10px;background:var(--bg);margin-bottom:8px}
.kv code{font:600 13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;flex:1}
.kv .k{font-size:11.5px;color:var(--hint);display:block;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:9;max-width:90%;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.banner{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--text);margin-bottom:12px}
.banner svg{color:var(--accent);margin-top:1px}
table.pl{width:100%;border-collapse:collapse;font-size:13px}
.plan{border:1px solid var(--sep);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.plan .full{grid-column:1/-1}
.plan input,.plan select{padding:8px 10px;font-size:13px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.tgl{width:44px;height:26px;border-radius:13px;background:var(--sep);border:0;position:relative;cursor:pointer;flex:none}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl.on{background:var(--accent)}.tgl.on:after{left:21px}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat div{background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-size:18px}
.stat span{font-size:11.5px;color:var(--hint)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.foot{text-align:center;color:var(--hint);font-size:11.5px;margin-top:18px}
</style>
<style>
textarea.t{min-height:84px;resize:vertical;font:inherit;width:100%}
.chrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--sep);border-radius:var(--r);background:var(--card);margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
.av{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--sep);background:var(--card);border-radius:10px;padding:9px 6px;font-weight:600;font-size:13px;color:var(--hint);cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
ol.steps{margin:0;padding-left:20px}ol.steps li{margin:6px 0;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--hint);margin:2px 4px 2px 0}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.pill.bad{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}.pill.ac{background:var(--soft);color:var(--accent)}
.num{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--sep);background:var(--card);font-size:18px;cursor:pointer}
.stepper b{min-width:28px;text-align:center;font-size:18px}
.score{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;margin:4px auto 8px;font-size:26px;font-weight:700;border:6px solid var(--accent);color:var(--accent)}
.meter{height:8px;border-radius:8px;background:var(--bg);overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--accent)}
.photo{width:100%;border-radius:12px;display:block;max-height:320px;object-fit:cover;background:var(--bg)}
.rec{width:84px;height:84px;border-radius:50%;border:0;background:var(--danger);color:#fff;display:grid;place-items:center;margin:8px auto;cursor:pointer}
.rec.on{animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--danger) 25%,transparent)}}
.inv{border-radius:18px;padding:26px 20px;text-align:center;border:1px solid var(--sep);background:var(--card);margin-bottom:12px}
.inv .eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--hint)}
.inv h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:26px;margin:10px 0 6px;line-height:1.2}
.inv .line{width:48px;height:1px;background:var(--accent);margin:14px auto}
.qrbox{background:#fff;border-radius:14px;padding:14px;display:inline-block}
.qrbox svg,.qrbox img{display:block;width:200px;height:200px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}table.tb td{padding:8px 4px;border-bottom:1px solid var(--sep);vertical-align:top}table.tb td:first-child{color:var(--hint);width:38%}
</style>

<body>

  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>

   if(w.withdrawals.length)h+='<div class="sec">'+t('withdraw')+'</div><div class="card"><ul class="files">'+w.withdrawals.map(function(x){return'<li><div class="grow"><div class="fn">'+usd(x.amount)+'</div><div class="fs">'+K.fmtDate(x.created)+'</div></div>'+statusPill(x.status)+'</li>'}).join('')+'</ul></div>';
   h+='<div class="sec">'+t('my_work')+'</div><div class="card">'+(w.subs.length?'<ul class="files">'+w.subs.map(function(x){return'<li><div class="grow"><div class="fn">'+esc(x.title)+'</div><div class="fs">'+K.fmtDate(x.created)+(x.reason?' · '+esc(x.reason):'')+'</div></div><b>'+usd(x.reward)+'</b>'+statusPill(x.status)+'</li>'}).join('')+'</ul>':'<p class="m">'+t('none_work')+'</p>')+'</div>';
   return h},
  task:function(){var k=M.task,h=K.header(k.title,k.city);
   h+='<div class="card"><div class="row"><div class="grow"><div class="fs">'+t('reward')+'</div><div class="num">'+usd(k.reward)+'</div></div><span class="pill">'+t('left',{n:k.slots-k.filled})+'</span></div><label class="f">'+t('instructions')+'</label><p class="m" style="color:var(--text);white-space:pre-line">'+esc(k.instructions)+'</p>'+
    (k.deadline?'<div class="fs" style="margin-top:8px">'+t('deadline')+': '+esc(k.deadline)+'</div>':'')+'</div>';
   return h+'<button class="btn" data-a="start">'+ic('play')+t('start')+'</button>'+K.errBox()},
  submit:function(){var k=M.task,h=K.header(k.title,t('submit'));
   if(k.needs_photo)h+='<div class="card"><label class="f">'+t('photo')+'</label>'+(M.photo?'<img class="photo" src="'+M.photo.dataUrl+'" alt="">':'')+'<button class="btn sm '+(M.photo?'ghost':'sec2')+'" style="width:100%;margin-top:8px" data-a="photo">'+ic('camera','s')+(M.photo?t('retake'):t('take_photo'))+'</button></div>';
   if(k.needs_gps)h+='<div class="card"><label class="f">'+t('gps')+'</label>'+(M.loc?'<div class="okmsg" style="margin:0">'+ic('pin','s')+t('loc_ok')+' · '+M.loc.lat+', '+M.loc.lng+'</div>':'<button class="btn sm sec2" style="width:100%" data-a="loc">'+ic('pin','s')+t('get_loc')+'</button>')+'</div>';
   if(k.questions.length)h+='<div class="card">'+k.questions.map(function(q,i){return'<label class="f">'+esc(q)+'</label><input class="t" data-q="'+i+'" value="'+esc((M.answers||[])[i]||'')+'">'}).join('')+'</div>';
   return h+'<button class="btn" data-a="send">'+ic('send')+t('submit')+'</button>'+K.errBox()},
  done:function(){return K.header(M.task.title,'')+'<div class="card center"><div class="big good">'+ic('check','l')+'</div><p class="m">'+t('submitted')+'</p></div><button class="btn" data-act="home">'+t('continue')+'</button>'},
  taskform:function(){var f=M.form,c=cost(f,M.fee||20),h=K.header(t('new_task'),'');
   function inp(k,ty,ph,ex){return'<input class="t" data-tf="'+k+'" type="'+(ty||'text')+'" value="'+esc(f[k])+'" placeholder="'+esc(ph||'')+'" '+(ex||'')+'>'}
   h+='<div class="card"><label class="f">'+t('title')+'</label>'+inp('title','text',t('title_ph'))+'<label class="f">'+t('instructions')+'</label><textarea class="t" data-tf="instructions" placeholder="'+esc(t('instr_ph'))+'">'+esc(f.instructions)+'</textarea>'+
    '<label class="f">'+t('t_city')+'</label>'+inp('city','text',t('city_ph'))+'<div class="g2"><div><label class="f">'+t('t_reward')+'</label>'+inp('reward','number','1','step="0.5" min="0.5"')+'</div><div><label class="f">'+t('t_slots')+'</label>'+inp('slots','number','20','min="1"')+'</div></div>'+
    '<div class="sw" style="margin-top:8px"><b style="font-size:14px">'+t('need_photo')+'</b><button class="tgl '+(f.needs_photo?'on':'')+'" data-a="tgl" data-k="needs_photo"></button></div><div class="sw"><b style="font-size:14px">'+t('need_gps')+'</b><button class="tgl '+(f.needs_gps?'on':'')+'" data-a="tgl" data-k="needs_gps"></button></div>'+
    '<label class="f">'+t('questions')+'</label><textarea class="t" data-tf="questions">'+esc(f.questions)+'</textarea><label class="f">'+t('deadline')+'</label>'+inp('deadline','date')+'</div>';
   h+='<div class="sec">'+t('cost')+'</div><div class="card"><table class="tb"><tr><td>'+t('c_base')+'</td><td>'+usd(c.base)+'</td></tr><tr><td>'+t('c_fee',{p:M.fee||20})+'</td><td>'+usd(c.fee)+'</td></tr><tr><td><b>'+t('c_total')+'</b></td><td><b>'+usd(c.total)+'</b></td></tr></table></div>';
   return h+'<button class="btn" data-a="savetask">'+ic('cash')+t('save_pay')+'</button>'+K.errBox()},
  mytask:function(){var k=M.task,h=K.header(k.title,k.city)+K.errBox();
   h+='<div class="card"><div class="row"><div class="grow">'+statusPill(k.status)+'<div class="fs" style="margin-top:6px">'+t('progress',{a:k.filled,b:k.slots})+' · '+usd(k.reward)+' '+t('per')+'</div></div><b>'+usd(k.total)+'</b></div></div>';
   if(k.status==='awaiting_payment')h+='<button class="btn" data-a="paytask">'+ic('cash')+t('pay_task')+' · '+usd(k.total)+'</button>';
   if(k.status==='live'||k.status==='closed')h+='<button class="btn" data-a="review">'+ic('list')+t('review')+(k.pending?' ('+k.pending+')':'')+'</button><button class="btn sec2" data-a="taskpdf">'+ic('file')+t('task_pdf')+'</button>';
   return h},
  review:function(){var h=K.header(t('review'),M.task.title);if(!M.review)return h+K.spin();if(!M.review.length)return h+K.empty('list',t('none_subs'));
   M.review.forEach(function(s){h+='<div class="card">'+(s.photo?'<img class="photo" src="'+s.photo+'" alt="">':'')+'<div class="row" style="margin-top:8px"><div class="grow fs">'+K.fmtDate(s.created)+' · '+esc(s.worker)+'</div>'+statusPill(s.status)+'</div>'+
    (s.lat?'<button class="btn sm ghost" style="margin-top:6px" data-open="https://maps.google.com/?q='+s.lat+','+s.lng+'">'+ic('pin','s')+t('map')+' · '+s.lat+', '+s.lng+'</button>':'')+
    (s.answers&&s.answers.length?'<table class="tb" style="margin-top:6px">'+s.answers.map(function(a,i){return'<tr><td>'+esc(M.task.questions[i]||'')+'</td><td>'+esc(a)+'</td></tr>'}).join('')+'</table>':'')+
    (s.status==='pending'?'<div class="g2" style="margin-top:10px"><button class="btn sm" data-a="approve" data-id="'+esc(s.id)+'">'+ic('check','s')+t('approve')+'</button><button class="btn sm ghost" data-a="reject" data-id="'+esc(s.id)+'">'+ic('x','s')+t('reject')+'</button></div>':'')+'</div>'});return h}
 },
 actions:{
  tab:function(el,d){M.tab=d.v;K.lsSet('mk_tab',d.v);M.feed=M.mine=M.wallet=null;K.home()},
  setcity:function(){M.city=document.getElementById('city').value.trim();K.lsSet('mk_city',M.city);M.feed=null;K.home()},
  task:function(el,d){M.task=M.feed.filter(function(k){return k.id===d.id})[0];K.go('task')},
  start:function(){M.photo=null;M.loc=null;M.answers=[];K.go('submit')},
  photo:function(){keepAnswers();document.getElementById('cam').click()},
  loc:function(){keepAnswers();getLoc(function(){S.err='';K.render()})},
  send:function(){keepAnswers();var k=M.task;if(k.needs_photo&&!M.photo){S.err=t('e_photo');return K.render()}if(k.needs_gps&&!M.loc){S.err=t('e_gps');return K.render()}
   if(k.questions.some(function(q,i){return!(M.answers[i]||'').trim()})){S.err=t('e_answers');return K.render()}
   api('mkSubmit',{task:k.id,photo:M.photo?M.photo.b64:'',lat:M.loc&&M.loc.lat,lng:M.loc&&M.loc.lng,answers:M.answers}).then(function(r){if(r.ok){K.haptic('ok');K.go('done',{replace:true})}else{S.err=t(r.error)!==r.error?t(r.error):t('e_gen');K.render()}})},
  newtask:function(){M.form={title:'',instructions:'',city:M.city,reward:1,slots:20,needs_photo:true,needs_gps:true,questions:'',deadline:''};K.go('taskform')},
  tgl:function(el,d){keepForm();M.form[d.k]=!M.form[d.k];K.render()},
  savetask:function(){keepForm();var f=M.form;if(!f.title||!f.instructions||!f.city||!(+f.reward>=0.5)||!(+f.slots>=1)){S.err=t('e_fields');return K.render()}
   api('mkSaveTask',{task:Object.assign({},f,{questions:f.questions.split('\n').map(function(x){return x.trim()}).filter(Boolean).slice(0,3)})}).then(function(r){if(!r.ok){S.err=t('e_gen');return K.render()}M.task=r.task;K.go('mytask',{replace:true});if(r.task.status==='awaiting_payment')payTask()})},
  mytask:function(el,d){M.task=M.mine.filter(function(k){return k.id===d.id})[0];K.go('mytask')},
  paytask:function(){payTask()},
  taskpdf:function(){var k=M.task;K.showReport(function(){return api('mkSubs',{task:k.id}).then(function(r){var subs=r.subs||[],c={approved:0,pending:0,rejected:0};subs.forEach(function(x){c[x.status]=(c[x.status]||0)+1});
    return{brand:t('appName'),title:k.title,subtitle:k.city+' · '+usd(k.reward)+' '+t('per'),meta:[[t('instructions'),k.instructions.slice(0,140)]],
     blocks:[{kpis:[[t('st_approved'),c.approved+' / '+k.slots,'good'],[t('st_pending'),c.pending],[t('st_rejected'),c.rejected,c.rejected?'bad':null],[t('spent'),usd(c.approved*k.reward)]]},
      {h:t('sub_l')},{table:{cols:[{label:t('date_l'),w:1.1},{label:t('worker_l'),w:1},{label:t('status_l'),w:1.1},{label:t('gps_l'),w:1.6}].concat(k.questions.map(function(q){return{label:q,w:1.6}})),
       rows:subs.map(function(x){return[K.fmtDate(x.created),x.worker,{v:t('st_'+x.status),tone:x.status==='approved'?'good':x.status==='rejected'?'bad':null},x.lat?(+x.lat).toFixed(4)+', '+(+x.lng).toFixed(4):''].concat(k.questions.map(function(q,i){return(x.answers||[])[i]||''}))})}},
      {h:t('photos_l')},{images:subs.filter(function(x){return x.photo&&x.status!=='rejected'}).map(function(x){return{src:x.photo,caption:x.worker+' · '+K.fmtDate(x.created)+(x.answers&&x.answers[0]?' · '+x.answers[0]:'')}})}]}})},(k.title.replace(/[^\w\- ]+/g,'')||'task')+' report.pdf')},
  review:function(){M.review=null;K.go('review')},
  approve:function(el,d){api('mkDecide',{sub:d.id,approve:true}).then(function(r){if(r.ok){M.review=null;K.render();K.S.screen='review';api('mkSubs',{task:M.task.id}).then(function(x){M.review=x.subs;K.render()})}else K.toast(t('e_gen'))})},
  reject:function(el,d){var why=prompt(t('reason'))||'';api('mkDecide',{sub:d.id,approve:false,reason:why}).then(function(){api('mkSubs',{task:M.task.id}).then(function(x){M.review=x.subs;K.render()})})},
  withdraw:function(){var a=document.getElementById('payout').value.trim();if(!/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(a)){S.err=t('e_addr');return K.render()}
   api('mkWithdraw',{address:a}).then(function(r){if(r.ok){S.msg=t('wd_ok');M.wallet=null;K.home();S.msg=t('wd_ok')}else{S.err=r.error==='min'?t('e_min'):t('e_gen');K.render()}})},
  wdpaid:function(el,d){api('adminMkWithdrawal',{id:d.id,paid:true}).then(function(){K.go('settings',{replace:true})})},
  wdreject:function(el,d){api('adminMkWithdrawal',{id:d.id,paid:false}).then(function(){K.go('settings',{replace:true})})}
 },
 demoResolvePlan:function(id,s){var m=/^task:(.+)$/.exec(id);if(!m)return null;var k=s.app.tasks.filter(function(x){return x.id===m[1]})[0];return k?{id:id,label:k.title,days:0,credits:0,usd:k.total,stars:Math.ceil(k.total*75)}:null},
 demoOnPaid:function(o,p,s){var m=/^task:(.+)$/.exec(o.plan);if(!m)return false;var k=s.app.tasks.filter(function(x){return x.id===m[1]})[0];if(k)k.status='live';return true},
 demoSeed:function(){var d=function(n){return new Date(Date.now()+n*864e5).toISOString().slice(0,10)};
  return{tasks:[
   {id:'k1',owner:'brand',title:'Photo of soft-drink shelf prices',instructions:'Visit a shop near you. Take one clear photo of the soft-drink shelf with prices visible. Answer the two questions.',city:'Hargeisa',reward:1,slots:30,filled:12,needs_photo:true,needs_gps:true,questions:['Shop name','Price of a 330 ml can'],deadline:d(10),status:'live',total:36},
   {id:'k2',owner:'ngo',title:'Water point check',instructions:'Go to the nearest public water point. Photo of the tap and tell us if it is working today.',city:'Hargeisa',reward:2,slots:15,filled:3,needs_photo:true,needs_gps:true,questions:['Is it working? (yes/no)'],deadline:d(5),status:'live',total:36},
   {id:'k3',owner:'brand',title:'Phone credit price survey',instructions:'Ask one shop the price of a $1 mobile top-up card. No photo needed.',city:'Mogadishu',reward:0.5,slots:50,filled:20,needs_photo:false,needs_gps:true,questions:['Operator','Price charged'],deadline:d(14),status:'live',total:30},
   {id:'k9',owner:'me',title:'Bread price in local bakeries',instructions:'Photo of the bread shelf and the price of one standard loaf.',city:'Hargeisa',reward:1,slots:10,filled:1,needs_photo:true,needs_gps:false,questions:['Price of one loaf'],deadline:d(7),status:'live',total:12}],
   subs:[{id:'u1',task:'k9',worker:'worker42',photo:'',lat:9.56,lng:44.06,answers:['$0.50'],status:'pending',created:new Date().toISOString()},{id:'u2',task:'k1',worker:'me',photo:'',answers:['Hodan Store','$0.60'],status:'approved',created:d(-3)}],
   wallet:{balance:1,earned:1,payout:'',withdrawals:[]}}},
 demo:{
  mkFeed:function(d,s){var c=(d.city||'').toLowerCase();return{ok:true,tasks:s.app.tasks.filter(function(k){return k.status==='live'&&k.filled<k.slots&&k.owner!=='me'&&(!c||k.city.toLowerCase().indexOf(c)>=0)})}},
  mkMine:function(d,s){return{ok:true,feePercent:s.settings.x_feePercent,tasks:s.app.tasks.filter(function(k){return k.owner==='me'}).map(function(k){return Object.assign({pending:s.app.subs.filter(function(u){return u.task===k.id&&u.status==='pending'}).length},k)})}},
  mkSaveTask:function(d,s){var f=d.task,fee=+s.settings.x_feePercent||0,k={id:'k'+K.uid(),owner:'me',title:f.title,instructions:f.instructions,city:f.city,reward:+f.reward,slots:+f.slots,filled:0,needs_photo:!!f.needs_photo,needs_gps:!!f.needs_gps,questions:f.questions,deadline:f.deadline,status:'awaiting_payment'};
   k.total=Math.round(k.reward*k.slots*(100+fee))/100;s.app.tasks.push(k);return{ok:true,task:k}},
  mkSubmit:function(d,s){var k=s.app.tasks.filter(function(x){return x.id===d.task})[0];if(k.filled>=k.slots)return{ok:false,error:'full'};
   if(s.app.subs.some(function(u){return u.task===k.id&&u.worker==='me'}))return{ok:false,error:'already'};
   s.app.subs.push({id:'u'+K.uid(),task:k.id,worker:'me',photo:d.photo?'data:image/jpeg;base64,'+d.photo:'',lat:d.lat,lng:d.lng,answers:d.answers,status:'pending',created:new Date().toISOString()});return{ok:true}},
  mkSubs:function(d,s){return{ok:true,subs:s.app.subs.filter(function(u){return u.task===d.task})}},
  mkDecide:function(d,s){var u=s.app.subs.filter(function(x){return x.id===d.sub})[0],k=s.app.tasks.filter(function(x){return x.id===u.task})[0];if(u.status!=='pending')return{ok:false};
   u.status=d.approve?'approved':'rejected';u.reason=d.reason||'';if(d.approve){k.filled++;if(k.filled>=k.slots)k.status='closed';if(u.worker==='me'){s.app.wallet.balance+=k.reward;s.app.wallet.earned+=k.reward}}return{ok:true}},
  mkWallet:function(d,s){var w=s.app.wallet;return{ok:true,balance:w.balance,earned:w.earned,payout:w.payout,min:+s.settings.x_minWithdraw||5,withdrawals:w.withdrawals,
   subs:s.app.subs.filter(function(u){return u.worker==='me'}).map(function(u){var k=s.app.tasks.filter(function(x){return x.id===u.task})[0]||{};return{title:k.title,reward:k.reward,status:u.status,created:u.created,reason:u.reason}})}},
  mkWithdraw:function(d,s){var w=s.app.wallet,min=+s.settings.x_minWithdraw||5;if(w.balance<min)return{ok:false,error:'min'};w.withdrawals.unshift({id:'w'+K.uid(),amount:w.balance,address:d.address,status:'requested',created:new Date().toISOString()});w.payout=d.address;w.balance=0;return{ok:true}},
  adminMk:function(d,s){return{ok:true,withdrawals:s.app.wallet.withdrawals.filter(function(w){return w.status==='requested'}).map(function(w){return Object.assign({user_id:'demo'},w)}),tasks:s.app.tasks.filter(function(k){return k.status==='live'})}},
  adminMkWithdrawal:function(d,s){var w=s.app.wallet.withdrawals.filter(function(x){return x.id===d.id})[0];if(w){w.status=d.paid?'paid':'rejected';if(!d.paid)s.app.wallet.balance+=w.amount}return{ok:true}}
 }
});
function payTask(){var k=M.task;K.paywall({title:t('pay_task'),text:k.title,icon:'briefcase',features:[t('progress',{a:0,b:k.slots}),usd(k.reward)+' '+t('per'),t('c_total')+': '+usd(k.total)],
 plans:[{id:'task:'+k.id,label:k.title,days:0,credits:0,usd:k.total,stars:Math.ceil(k.total*75)}],paidText:t('paid_task'),after:function(){M.tab='post';K.lsSet('mk_tab','post');M.mine=null;K.home()}})}
function keepAnswers(){M.answers=[].map.call(document.querySelectorAll('[data-q]'),function(el){return el.value})}
function keepForm(){document.querySelectorAll('[data-tf]').forEach(function(el){M.form[el.dataset.tf]=el.type==='number'?+el.value:el.value})}
document.getElementById('cam').addEventListener('change',function(e){var f=e.target.files[0];e.target.value='';if(!f)return;K.fileB64(f,1280,0.75).then(function(r){M.photo=r;S.err='';K.render()})});
})();
</script>
