<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0544F"/><stop offset="1" stop-color="#B3192A"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F4F7"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A0710" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="430" fill="#ffffff" opacity=".06"/>
  <!-- back page (tilted): many pages become one -->
  <g transform="rotate(-10 512 520)" filter="url(#sh)">
    <rect x="300" y="250" width="380" height="480" rx="34" fill="#FFD9D6"/>
  </g>
  <!-- front page with folded corner -->
  <g filter="url(#sh)">
    <path d="M370 250 H600 L720 370 V748 a34 34 0 0 1 -34 34 H370 a34 34 0 0 1 -34 -34 V284 a34 34 0 0 1 34 -34 Z" fill="url(#sheet)"/>
    <path d="M600 250 V336 a34 34 0 0 0 34 34 H720 Z" fill="#E3E6EC"/>
  </g>
  <!-- PDF wordmark -->
  <text x="528" y="560" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="150" letter-spacing="-4" fill="#C8202E">PDF</text>
  <!-- tool lines -->
  <rect x="398" y="610" width="260" height="22" rx="11" fill="#C8202E" opacity=".28"/>
  <rect x="398" y="656" width="180" height="22" rx="11" fill="#C8202E" opacity=".18"/>
  <!-- convert badge -->
  <g transform="translate(700 690)">
    <circle r="92" fill="#ffffff"/>
    <circle r="78" fill="#1F2A44"/>
    <path d="M-34 -14 a38 38 0 0 1 66 -14" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
    <path d="M38 -46 L34 -24 L13 -30" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 14 a38 38 0 0 1 -66 14" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
    <path d="M-38 46 L-34 24 L-13 30" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
